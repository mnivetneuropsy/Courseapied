function countryOptions(selected) {
  const list = countryList().slice().sort((a, b) => a.localeCompare(b, 'fr'));
  const known = list.some(c => c === selected);
  return list.map(c => `<option value="${escapeHtml(c)}" ${c === selected ? 'selected' : ''}>${escapeHtml(c)}</option>`).join('') +
    `<option value="__autre" ${selected && !known ? 'selected' : ''}>Autre pays…</option>`;
}
function deptOptions(selected) {
  return `<option value="">— Choisir —</option>` + departmentList().map(d =>
    `<option value="${d.code}" ${d.code === selected ? 'selected' : ''}>${d.code} — ${escapeHtml(d.name)}</option>`).join('');
}

function renderAjouter(el) {
  const run = editingRunId ? STATE.runs.find(r => r.id === editingRunId) : null;
  const last = sortedRuns().slice(-1)[0];
  const v = run || { date: todayStr(), time: `${pad2(new Date().getHours())}:${pad2(new Date().getMinutes())}`,
    country: last ? last.country : 'France', department: last ? last.department : '', weather: [], elevationGain: '' };
  const totalSec = run ? Math.round(run.durationMin * 60) : null;
  const knownCountry = countryList().includes(v.country);

  el.innerHTML = `
    <h1 class="screen-title">${run ? 'Modifier la course' : 'Ajouter une course'}</h1>
    ${run ? '' : `
    <label class="import-box">
      <span class="import-title">📥 Importer depuis un fichier TCX</span>
      <span class="import-sub">Un fichier : le formulaire se remplit. Plusieurs : import groupé de ton historique.</span>
      <input type="file" id="tcx-input" accept=".tcx,application/xml,text/xml" multiple hidden>
    </label>`}
    <form id="run-form" class="run-form" novalidate>
      <div class="form-row">
        <label>Date <input type="date" name="date" value="${v.date}" required></label>
        <label>Heure de départ <input type="time" name="time" value="${v.time || ''}"></label>
      </div>
      <label>Distance (km) <input type="number" inputmode="decimal" step="0.01" min="0.01" name="distanceKm" value="${run ? run.distanceKm : ''}" placeholder="ex : 8,5" required></label>
      <label>Durée
        <div class="duration-row">
          <input type="number" inputmode="numeric" min="0" name="dh" placeholder="h" value="${totalSec != null ? Math.floor(totalSec / 3600) : ''}"><span class="duration-sep">h</span>
          <input type="number" inputmode="numeric" min="0" max="59" name="dm" placeholder="min" value="${totalSec != null ? Math.floor(totalSec % 3600 / 60) : ''}"><span class="duration-sep">min</span>
          <input type="number" inputmode="numeric" min="0" max="59" name="ds" placeholder="s" value="${totalSec != null ? totalSec % 60 : ''}"><span class="duration-sep">s</span>
        </div>
      </label>
      <div class="pace-preview" id="pace-preview">Allure : —</div>
      <label>Dénivelé positif (m) <input type="number" inputmode="numeric" min="0" step="1" name="elevationGain" value="${v.elevationGain || ''}" placeholder="0"></label>
      <label>Pays <select name="country">${countryOptions(v.country)}</select></label>
      <label id="other-country-wrap" class="${knownCountry ? 'hidden' : ''}">Nom du pays <input type="text" name="countryOther" value="${knownCountry ? '' : escapeHtml(v.country || '')}"></label>
      <label id="dept-wrap" class="${v.country === 'France' ? '' : 'hidden'}">Département <select name="department">${deptOptions(v.department)}</select></label>
      <div class="field-label">Communes traversées <span class="muted">(3 maximum)</span></div>
      <div class="commune-box">
        <div class="chips" id="commune-chips"></div>
        <div class="commune-add">
          <input type="text" id="commune-input" list="commune-list" placeholder="ex : Ouroux-sur-Saône" autocomplete="off">
          <button type="button" class="btn-small" id="commune-add-btn">Ajouter</button>
        </div>
        <datalist id="commune-list">${knownCommunes().map(c => `<option value="${escapeHtml(c)}">`).join('')}</datalist>
      </div>
      <div class="field-label">Lieux croisés <span class="muted">(2 maximum)</span></div>
      <div class="chips" id="place-chips">${PLACE_TYPES.map(([k, ic, lb]) => `<label class="chip"><input type="checkbox" name="places" value="${k}" ${(v.places || []).includes(k) ? 'checked' : ''}><span>${ic} ${lb}</span></label>`).join('')}</div>
      <div class="field-label">Météo <span class="muted">(facultatif, plusieurs choix possibles)</span></div>
      <div class="chips">${WEATHER_OPTIONS.map(([k, ic, lb]) => `<label class="chip"><input type="checkbox" name="weather" value="${k}" ${(v.weather || []).includes(k) ? 'checked' : ''}><span>${ic} ${lb}</span></label>`).join('')}</div>
      <div class="field-label">Sensation <span class="muted">(facultatif)</span></div>
      <div class="chips feel-chips">${FEELINGS.map(([k, ic, lb]) => `<label class="chip feel"><input type="radio" name="feeling" value="${k}" ${v.feeling === k ? 'checked' : ''}><span><em>${ic}</em>${lb}</span></label>`).join('')}</div>
      <div class="field-label">Humeur après la sortie <span class="muted">(facultatif)</span></div>
      <div class="chips">${MOODS.map(([k, ic, lb]) => `<label class="chip"><input type="radio" name="mood" value="${k}" ${v.mood === k ? 'checked' : ''}><span>${ic} ${lb}</span></label>`).join('')}</div>
      <p class="safety-note">Jamais de sortie sous un orage proche ou dans des conditions dangereuses : aucun badge ne vaut ça.</p>
      <label class="switch-row"><input type="checkbox" name="officialRace" ${run && run.officialRace ? 'checked' : ''}><span>Course officielle (avec dossard)</span></label>
      <label id="official-type-wrap" class="${run && run.officialRace ? '' : 'hidden'}">Type de course
        <select name="officialRaceType"><option value="">—</option>${OFFICIAL_TYPES.map(([k, l]) => `<option value="${k}" ${run && run.officialRaceType === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
      </label>
      <label>Commentaire <textarea name="comment" rows="2" placeholder="Sensations, parcours…">${run ? escapeHtml(run.comment || '') : ''}</textarea></label>
      <button type="submit" class="btn-primary">${run ? 'Enregistrer les modifications' : 'Enregistrer la course'}</button>
      ${run ? '<button type="button" class="btn-ghost" id="cancel-edit">Annuler</button>' : ''}
    </form>
  `;

  const form = el.querySelector('#run-form');
  form._communes = (v.communes || []).slice();
  const drawCommunes = () => {
    const box = el.querySelector('#commune-chips');
    box.innerHTML = form._communes.map((c, i) => `<button type="button" class="chip-tag" data-i="${i}">${escapeHtml(c)} ✕</button>`).join('');
    box.querySelectorAll('.chip-tag').forEach(t => t.addEventListener('click', () => { form._communes.splice(Number(t.dataset.i), 1); drawCommunes(); }));
    const full = form._communes.length >= 3;
    el.querySelector('#commune-input').disabled = full;
    el.querySelector('#commune-add-btn').disabled = full;
    el.querySelector('#commune-input').placeholder = full ? '3 communes maximum' : 'ex : Ouroux-sur-Saône';
  };
  const addCommune = () => {
    const inp = el.querySelector('#commune-input');
    let c = cleanCommune(inp.value);
    if (!c) return;
    const known = knownCommunes().find(k => normText(k).replace(/[-']/g, ' ') === normText(c).replace(/[-']/g, ' '));
    if (known) c = known; // reprend l'orthographe déjà utilisée
    if (!form._communes.some(x => normText(x) === normText(c)) && form._communes.length < 3) form._communes.push(c);
    inp.value = ''; drawCommunes();
  };
  el.querySelector('#commune-add-btn').addEventListener('click', addCommune);
  el.querySelector('#commune-input').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addCommune(); } });
  drawCommunes();
  const placeBoxes = Array.from(el.querySelectorAll('input[name="places"]'));
  const limitPlaces = () => {
    const n = placeBoxes.filter(b => b.checked).length;
    placeBoxes.forEach(b => { b.disabled = !b.checked && n >= 2; b.parentElement.classList.toggle('disabled', b.disabled); });
  };
  placeBoxes.forEach(b => b.addEventListener('change', limitPlaces));
  // un second appui sur une sensation/humeur déjà choisie la désélectionne
  el.querySelectorAll('input[name="feeling"], input[name="mood"]').forEach(r => {
    r.addEventListener('pointerdown', () => { r.dataset.was = r.checked ? '1' : ''; });
    r.addEventListener('click', () => { if (r.dataset.was === '1') { r.checked = false; r.dataset.was = ''; } });
  });
  limitPlaces();
  const refresh = () => {
    const c = form.elements.country.value;
    el.querySelector('#dept-wrap').classList.toggle('hidden', c !== 'France');
    el.querySelector('#other-country-wrap').classList.toggle('hidden', c !== '__autre');
    el.querySelector('#official-type-wrap').classList.toggle('hidden', !form.elements.officialRace.checked);
    const dist = parseFloat(String(form.elements.distanceKm.value).replace(',', '.'));
    const dur = (Number(form.elements.dh.value) || 0) * 60 + (Number(form.elements.dm.value) || 0) + (Number(form.elements.ds.value) || 0) / 60;
    const p = calculatePace(dist, dur);
    el.querySelector('#pace-preview').textContent = p ? `Allure : ${paceToString(p)} /km · ${fmtNum(calculateSpeed(dist, dur))} km/h` : 'Allure : —';
  };
  form.addEventListener('input', refresh);
  form.addEventListener('change', refresh);
  refresh();
  form.addEventListener('submit', e => { e.preventDefault(); submitRunForm(form); });
  const cancel = el.querySelector('#cancel-edit');
  if (cancel) cancel.addEventListener('click', () => { editingRunId = null; goToScreen('historique'); });
  const tcx = el.querySelector('#tcx-input');
  if (tcx) tcx.addEventListener('change', e => handleTcxFiles(Array.from(e.target.files), form, refresh));
}

function readRunForm(form) {
  const f = form.elements;
  const country = f.country.value === '__autre' ? (f.countryOther.value || '').trim() : f.country.value;
  return {
    date: f.date.value,
    time: f.time.value,
    distanceKm: parseFloat(String(f.distanceKm.value).replace(',', '.')),
    durationMin: (Number(f.dh.value) || 0) * 60 + (Number(f.dm.value) || 0) + (Number(f.ds.value) || 0) / 60,
    elevationGain: Number(f.elevationGain.value) || 0,
    country,
    department: country === 'France' ? f.department.value : '',
    weather: Array.from(form.querySelectorAll('input[name="weather"]:checked')).map(i => i.value),
    communes: pendingCommunes(form),
    feeling: Number((form.querySelector('input[name="feeling"]:checked') || {}).value) || null,
    mood: (form.querySelector('input[name="mood"]:checked') || {}).value || '',
    places: Array.from(form.querySelectorAll('input[name="places"]:checked')).map(i => i.value).slice(0, 2),
    officialRace: f.officialRace.checked,
    officialRaceType: f.officialRace.checked ? f.officialRaceType.value : '',
    comment: (f.comment.value || '').trim(),
  };
}

// Une commune tapée mais pas encore « ajoutée » est prise en compte quand même
function pendingCommunes(form) {
  const list = (form._communes || []).slice();
  const typed = cleanCommune((form.querySelector('#commune-input') || {}).value);
  if (typed && list.length < 3 && !list.some(x => normText(x) === normText(typed))) list.push(typed);
  return list;
}

function knownCommunes() {
  const m = new Map();
  STATE.runs.forEach(r => (r.communes || []).forEach(c => { if (!m.has(normText(c))) m.set(normText(c), c); }));
  return [...m.values()].sort((a, b) => a.localeCompare(b, 'fr'));
}

function submitRunForm(form) {
  const data = readRunForm(form);
  if (!data.date) return toast('Indique la date.', true);
  if (!(data.distanceKm > 0)) return toast('Indique une distance.', true);
  if (!(data.durationMin > 0)) return toast('Indique une durée.', true);
  if (!data.country) return toast('Indique le pays.', true);
  if (data.country === 'France' && !data.department) return toast('Choisis le département.', true);
  if (data.durationMin / data.distanceKm < 2) return toast('Allure inférieure à 2 min/km : vérifie distance et durée.', true);

  if (editingRunId) {
    const res = updateRun(editingRunId, data);
    editingRunId = null;
    toast('Course modifiée, tout a été recalculé.');
    afterChange(res, 'historique', false);
  } else {
    const dup = findDuplicate(data);
    if (dup && !confirmDuplicate(dup)) return;
    const res = addRun(data);
    toast('Course enregistrée !');
    afterChange(res, 'accueil', true);
  }
}

function confirmDuplicate(dup) {
  return window.confirm(`Une course très proche existe déjà (${formatDate(dup.date)}, ${fmtNum(dup.distanceKm)} km). L'enregistrer quand même ?`);
}

function afterChange(res, nextScreen, showDuel) {
  syncCoach();
  const queue = [];
  if (showDuel && res.run && res.run.ghost) queue.push({ kind: 'ghost', run: res.run });
  res.newBadges.forEach(b => queue.push({ kind: 'badge', badge: b }));
  res.events.filter(e => e.checkpoint < 100).forEach(e => queue.push({ kind: 'checkpoint', ...e }));
  if (res.completed) queue.push({ kind: 'challenge', challenge: res.completed });
  goToScreen(nextScreen);
  showCelebrations(queue);
}

/* ---------------- Import TCX ---------------- */

function readFileText(file) {
  return new Promise((resolve, reject) => { const r = new FileReader(); r.onload = () => resolve(r.result); r.onerror = reject; r.readAsText(file); });
}

async function handleTcxFiles(files, form, refresh) {
  if (!files.length) return;
  const parsed = [], failed = [];
  for (const f of files) {
    try { parseTCX(await readFileText(f)).forEach(a => parsed.push(Object.assign(a, { file: f.name }))); }
    catch (e) { failed.push(f.name); }
  }
  if (!parsed.length) return toast('Aucune course lisible dans ce(s) fichier(s).', true);
  if (parsed.length === 1 && files.length === 1) {
    const a = parsed[0], F = form.elements;
    F.date.value = a.date; F.time.value = a.time; F.distanceKm.value = a.distanceKm;
    const sec = Math.round(a.durationMin * 60);
    F.dh.value = Math.floor(sec / 3600); F.dm.value = Math.floor(sec % 3600 / 60); F.ds.value = sec % 60;
    F.elevationGain.value = a.elevationGain;
    refresh();
    toast('Fichier lu ! Vérifie les champs et complète le lieu.');
    return;
  }
  openBatchImport(parsed, failed);
}

function openBatchImport(items, failed) {
  items.sort((a, b) => runSortKey(a).localeCompare(runSortKey(b)));
  items.forEach(a => { a.duplicate = !!findDuplicate(a); a.include = !a.duplicate; });
  const last = sortedRuns().slice(-1)[0];
  const ac = activeChallenge();
  openSheet(`
    <div class="sheet-title">Import de ${items.length} courses</div>
    ${failed.length ? `<p class="muted">${failed.length} fichier(s) illisible(s) ignoré(s).</p>` : ''}
    <p class="muted">Les doublons déjà présents sont décochés. Le lieu choisi s'applique à toutes les courses (modifiable ensuite une par une dans l'historique).</p>
    <div class="batch-list">${items.map((a, i) => `
      <label class="batch-row ${a.duplicate ? 'dup' : ''}"><input type="checkbox" data-i="${i}" ${a.include ? 'checked' : ''}>
        <span class="batch-date">${formatDate(a.date, { day: 'numeric', month: 'short', year: '2-digit' })}${a.time ? ' · ' + a.time : ''}</span>
        <span class="batch-data">${fmtNum(a.distanceKm, 2)} km · ${formatDuration(a.durationMin)}${a.elevationGain ? ' · D+ ' + a.elevationGain + ' m' : ''}${a.duplicate ? ' · déjà présente' : ''}</span>
      </label>`).join('')}</div>
    <label class="sheet-field">Pays <select id="b-country">${countryOptions(last ? last.country : 'France')}</select></label>
    <label class="sheet-field" id="b-other-wrap">Nom du pays <input type="text" id="b-other"></label>
    <label class="sheet-field" id="b-dept-wrap">Département <select id="b-dept">${deptOptions(last ? last.department : '')}</select></label>
    <label class="sheet-field">Commune de départ <span class="muted small">(facultatif, pour le badge Explorateur)</span>
      <input type="text" id="b-commune" list="b-commune-list" value="${escapeHtml(last && last.communes && last.communes[0] || '')}">
      <datalist id="b-commune-list">${knownCommunes().map(c => `<option value="${escapeHtml(c)}">`).join('')}</datalist></label>
    ${ac && !ac.completed ? `<label class="switch-row"><input type="checkbox" id="b-challenge"><span>Compter ces km dans le défi « ${escapeHtml(ac.name)} »</span></label>` : ''}
    <div class="sheet-actions"><button class="btn-ghost" data-close>Annuler</button><button class="btn-primary" id="b-go">Importer</button></div>
  `, (sheet, close) => {
    const upd = () => {
      const c = sheet.querySelector('#b-country').value;
      sheet.querySelector('#b-dept-wrap').classList.toggle('hidden', c !== 'France');
      sheet.querySelector('#b-other-wrap').classList.toggle('hidden', c !== '__autre');
      const n = sheet.querySelectorAll('.batch-row input:checked').length;
      sheet.querySelector('#b-go').textContent = `Importer ${n} course${n > 1 ? 's' : ''}`;
    };
    sheet.addEventListener('change', upd); upd();
    sheet.querySelector('#b-go').addEventListener('click', () => {
      const cSel = sheet.querySelector('#b-country').value;
      const country = cSel === '__autre' ? sheet.querySelector('#b-other').value.trim() : cSel;
      const dept = country === 'France' ? sheet.querySelector('#b-dept').value : '';
      if (!country) return toast('Indique le pays.', true);
      if (country === 'France' && !dept) return toast('Choisis le département.', true);
      const chosen = Array.from(sheet.querySelectorAll('.batch-row input:checked')).map(i => items[Number(i.dataset.i)]);
      if (!chosen.length) return toast('Aucune course sélectionnée.', true);
      const cb = sheet.querySelector('#b-challenge');
      const res = addRuns(chosen.map(a => ({ date: a.date, time: a.time, distanceKm: a.distanceKm, durationMin: a.durationMin,
        elevationGain: a.elevationGain, country, department: dept, weather: [], officialRace: false, officialRaceType: '', comment: '',
        communes: cleanCommune(sheet.querySelector('#b-commune').value) ? [cleanCommune(sheet.querySelector('#b-commune').value)] : [], places: [] })), cb && cb.checked);
      close();
      toast(`${chosen.length} course(s) importée(s).`);
      afterChange(res, 'historique');
    });
  });
}

/* ---------------- Célébrations (badges, checkpoints, défis) ---------------- */

function showCelebrations(queue) {
  if (!queue.length) return;
  if (queue.length > 6) {
    const badges = queue.filter(q => q.kind === 'badge');
    openSheet(`
      <div class="celebrate-head">🎉 ${badges.length} BADGES DÉBLOQUÉS</div>
      <div class="mini-grid">${badges.map(q => `<div class="mini-badge">${badgeVisual(q.badge, 'small')}<span>${escapeHtml(q.badge.name)}</span></div>`).join('')}</div>
      ${queue.filter(q => q.kind === 'challenge').map(q => `<p class="celebrate-line">🏆 Défi terminé : ${escapeHtml(q.challenge.name)}</p>`).join('')}
      <button class="btn-primary" data-close>Génial !</button>`);
    return;
  }
  const item = queue.shift();
  let html;
  if (item.kind === 'ghost') {
    const r = item.run, g = r.ghost;
    const d = Math.abs(g.deltaSec), mm = Math.floor(d / 60), ss = d % 60;
    const gap = mm ? `${mm} min ${pad2(ss)} s` : `${ss} s`;
    html = `<div class="unlock-label ghost-label">DUEL CONTRE TON FANTÔME</div>
      <div class="duel">
        <div class="duel-side ${g.win ? 'win' : ''}"><div class="duel-who">Toi</div><div class="duel-pace">${paceToString(r.paceMinPerKm)}</div><div class="duel-sub">/km · ${fmtNum(r.distanceKm)} km</div></div>
        <div class="duel-vs">VS</div>
        <div class="duel-side ghost ${g.win ? '' : 'win'}"><div class="duel-who">👻 ${formatDate(g.date, { day: 'numeric', month: 'short', year: '2-digit' })}</div><div class="duel-pace">${paceToString(g.pace)}</div><div class="duel-sub">/km · ${fmtNum(g.distanceKm)} km</div></div>
      </div>
      <div class="unlock-name">${g.win ? '🏆 Victoire !' : g.deltaSec === 0 ? 'Égalité parfaite' : '👻 Le fantôme gagne cette fois'}</div>
      <div class="unlock-condition">${g.deltaSec === 0 ? 'Exactement la même allure, impressionnant.' : g.win ? `${gap} d'avance sur la distance.` : `${gap} de retard. Il t'attendra à la prochaine sortie.`}</div>
      <div class="unlock-date">Fantôme : ${g.mode === 'last' ? 'ta dernière' : 'ta meilleure'} sortie similaire${g.commune ? ' à ' + escapeHtml(g.commune) : ''}</div>`;
  } else if (item.kind === 'badge') {
    const b = item.badge;
    html = `<div class="unlock-label">BADGE DÉBLOQUÉ !</div>
      <div class="unlock-image">${badgeVisual(b)}</div>
      <div class="unlock-name">${escapeHtml(b.name)}</div>
      <div class="unlock-condition">${escapeHtml(b.condition || b.description || '')}</div>
      <div class="unlock-date">${formatDate(b.unlockedDate)}</div>`;
  } else if (item.kind === 'checkpoint') {
    html = `<div class="unlock-label">CHECKPOINT ${item.checkpoint} %</div>
      <div class="unlock-image"><div class="bv"><span class="bv-icon">🚩</span></div></div>
      <div class="unlock-name">${escapeHtml(item.challenge.name)}</div>
      <div class="unlock-condition">${CHECKPOINT_MESSAGES[item.checkpoint]}</div>
      <div class="unlock-date">${fmtNum(item.challenge.targetKm * item.checkpoint / 100, 0)} km parcourus</div>`;
  } else {
    const c = item.challenge;
    html = `<div class="unlock-label">DÉFI TERMINÉ !</div>
      <div class="unlock-image">${badgeVisual({ collection: 'defis', image: c.image })}</div>
      <div class="unlock-name">${escapeHtml(c.name)}</div>
      <div class="unlock-condition">${fmtNum(c.targetKm, 0)} km parcourus au fil de tes sorties. Choisis ta prochaine aventure !</div>
      <div class="unlock-date">${formatDate(c.completedDate)}</div>`;
  }
  const overlay = document.createElement('div');
  overlay.className = 'unlock-overlay';
  overlay.innerHTML = `<div class="unlock-card">${html}<button class="btn-primary">${queue.length ? `Suivant (${queue.length})` : 'Continuer'}</button></div>`;
  overlay.querySelector('button').addEventListener('click', () => { overlay.remove(); showCelebrations(queue); });
  document.body.appendChild(overlay);
}

/* ---------------- Collection ---------------- */

function challengeBadges() {
  return STATE.challenges.map(c => ({ id: c.id, name: c.name, collection: 'defis', description: c.description,
    condition: `Terminer le défi (${fmtNum(c.targetKm, 0)} km cumulés)`, image: c.image, unlocked: c.completed, unlockedDate: c.completedDate }));
}

function visibleWeeklyBadges() {
  const cur = weekKeyOf(todayStr());
  const weeksWithRuns = new Set(STATE.runs.map(r => weekKeyOf(r.date)));
  return STATE.weeklyBadges.filter(b => { const k = `${b.year}-W${b.week}`; return k === cur || weeksWithRuns.has(k); });
}

function visibleMonthlyBadges() {
  const cur = todayStr().slice(0, 7);
  const months = new Set(STATE.runs.map(r => r.date.slice(0, 7)));
  return STATE.monthlyBadges.filter(b => b.monthKey === cur || months.has(b.monthKey));
}

function allBadgesForCollection() { return [...STATE.badges, ...challengeBadges(), ...visibleMonthlyBadges(), ...visibleWeeklyBadges()]; }

function renderCollection(el) {
  const all = allBadgesForCollection();
  const unlocked = all.filter(b => b.unlocked).length;
  const filt = b => collectionFilter === 'all' || (collectionFilter === 'on' ? b.unlocked : !b.unlocked);
  el.innerHTML = `
    <div class="collection-header">
      <div class="card-eyebrow">Badges obtenus</div>
      <div class="collection-count">${unlocked} <span>/ ${all.length}</span></div>
      ${progressBar(unlocked / all.length * 100)}
    </div>
    <div class="seg">${[['all', 'Tous'], ['on', 'Obtenus'], ['off', 'À débloquer']].map(([k, l]) =>
      `<button class="seg-btn ${collectionFilter === k ? 'active' : ''}" data-filter="${k}">${l}</button>`).join('')}</div>
    ${COLLECTION_ORDER.map(col => {
      const list = all.filter(b => b.collection === col);
      if (!list.length) return '';
      const got = list.filter(b => b.unlocked).length;
      const meta = CATEGORY_META[col];
      if (col === 'mensuel') {
        const months = {};
        list.forEach(b => { (months[b.monthKey] = months[b.monthKey] || []).push(b); });
        return `<details class="cat" open><summary><span>${meta.icon} ${meta.label}</span><span class="cat-count">${got} / ${list.length}</span></summary>
          ${Object.values(months).map(ms => {
            const shown = ms.filter(filt); if (!shown.length) return '';
            return `<div class="week-block"><div class="week-title"><span class="cap">${MONTH_NAMES_FR[ms[0].month - 1]} ${ms[0].year}</span><span>${ms.filter(b => b.unlocked).length} / ${ms.length} obtenus</span></div>
              <div class="badge-grid">${shown.map(badgeTile).join('')}</div></div>`;
          }).join('')}</details>`;
      }
      if (col === 'hebdomadaire') {
        const weeks = {};
        list.forEach(b => { (weeks[`${b.year}-W${b.week}`] = weeks[`${b.year}-W${b.week}`] || []).push(b); });
        return `<details class="cat" open><summary><span>${meta.icon} ${meta.label}</span><span class="cat-count">${got} / ${list.length}</span></summary>
          ${Object.values(weeks).map(ws => {
            const shown = ws.filter(filt); if (!shown.length) return '';
            return `<div class="week-block"><div class="week-title">Semaine ${ws[0].week} · ${ws[0].year}<span>${ws.filter(b => b.unlocked).length} / 5 obtenus</span></div>
              <div class="badge-grid">${shown.map(badgeTile).join('')}</div></div>`;
          }).join('')}</details>`;
      }
      const shown = list.filter(filt);
      if (!shown.length) return '';
      return `<details class="cat" ${list.length <= 20 ? 'open' : ''}><summary><span>${meta.icon} ${meta.label}</span><span class="cat-count">${got} / ${list.length}</span></summary>
        <div class="badge-grid">${shown.map(badgeTile).join('')}</div></details>`;
    }).join('')}
  `;
  el.querySelectorAll('[data-filter]').forEach(b => b.addEventListener('click', () => { collectionFilter = b.dataset.filter; renderCurrentScreen(); }));
  el.querySelectorAll('.badge-tile').forEach(t => t.addEventListener('click', () => openBadgeSheet(t.dataset.id)));
}

function badgeTile(b) {
  const label = b.collection === 'departements' ? `<span class="tile-code">${b.deptCode}</span>${escapeHtml(b.name)}` :
    b.collection === 'hebdomadaire' ? `Niveau ${b.level} · ${b.target} km` :
    b.collection === 'mensuel' ? (b.kind === 'single' ? (b.target === 5 ? '5K du mois' : '10K du mois') : `${b.target} km du mois`) : escapeHtml(b.name);

    ${badgeVisual(b, 'small')}${b.unlocked ? '' : '<span class="lock-icon">🔒</span>'}

function openBadgeSheet(id) {
  const b = allBadgesForCollection().find(x => x.id === id) || STATE.weeklyBadges.find(x => x.id === id) || STATE.monthlyBadges.find(x => x.id === id);

  }

    <div class="sheet-badge ${b.unlocked ? '' : 'locked'}">${badgeVisual(b)}</div>

    <button class="btn-primary" data-close>Fermer</button>`);
}

/* ---------------- Statistiques ---------------- */

function weeklyChartSvg() {
  const start = mondayOf(todayStr());
  const weeks = [];
  for (let i = 11; i >= 0; i--) {
    const d = addDays(start, -7 * i);
    weeks.push({ key: weekKeyOf(d), label: 'S' + isoWeekInfo(d).week, km: 0 });
  }
  STATE.runs.forEach(r => { const w = weeks.find(x => x.key === weekKeyOf(r.date)); if (w) w.km += r.distanceKm; });
  const max = Math.max(20, ...weeks.map(w => w.km));
  const W = 320, H = 150, bw = 17, x0 = 24, gap = (W - x0 - 4 - bw * 12) / 11;
  const lines = [10, 20, 30, 40, 50].filter(v => v <= max).map(v => {
    const y = 120 - v / max * 105;
    return `<line x1="${x0}" x2="${W - 4}" y1="${y}" y2="${y}" class="ch-grid"/><text x="${x0 - 5}" y="${y + 3}" class="ch-lbl" text-anchor="end">${v}</text>`;
  }).join('');
  const bars = weeks.map((w, i) => {
    const x = x0 + i * (bw + gap), h = w.km / max * 105, y = 120 - h;
    return `<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(h, 1)}" rx="4" class="ch-bar ${i === 11 ? 'cur' : ''}"/>
      ${w.km ? `<text x="${x + bw / 2}" y="${y - 4}" class="ch-val" text-anchor="middle">${Math.round(w.km)}</text>` : ''}
      <text x="${x + bw / 2}" y="138" class="ch-lbl" text-anchor="middle">${w.label}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="chart">${lines}${bars}</svg>`;
}

function paceChartSvg() {
  const runs = sortedRuns().filter(r => r.distanceKm >= 1 && r.paceMinPerKm).slice(-20);
  if (runs.length < 2) return '<p class="muted">Il faut au moins 2 sorties pour tracer ton allure.</p>';
  const paces = runs.map(r => r.paceMinPerKm);
  const lo = Math.min(...paces), hi = Math.max(...paces), span = Math.max(0.5, hi - lo);
  const W = 320, H = 150;
  const pts = runs.map((r, i) => [15 + i / (runs.length - 1) * (W - 50), 15 + (r.paceMinPerKm - lo) / span * 105]);
  return `<svg viewBox="0 0 ${W} ${H}" class="chart">
    <line x1="15" x2="${W - 35}" y1="15" y2="15" class="ch-grid"/><text x="${W - 3}" y="19" class="ch-lbl" text-anchor="end">${paceToString(lo)}</text>
    <line x1="15" x2="${W - 35}" y1="120" y2="120" class="ch-grid"/><text x="${W - 3}" y="124" class="ch-lbl" text-anchor="end">${paceToString(lo + span)}</text>
    <polyline points="${pts.map(p => p.map(v => v.toFixed(1)).join(',')).join(' ')}" class="ch-line"/>
    ${pts.map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" class="ch-dot"/>`).join('')}
    <text x="15" y="140" class="ch-lbl">${formatDate(runs[0].date, { day: 'numeric', month: 'short' })}</text>
    <text x="${W - 35}" y="140" class="ch-lbl" text-anchor="end">${formatDate(runs[runs.length - 1].date, { day: 'numeric', month: 'short' })}</text>
  </svg>`;
}

  const tile = (label, value) => `<div class="stat-tile"><div class="stat-num">${value}</div><div class="stat-label">${label}</div></div>`;

    <header class="topbar"><h1 class="screen-title">Statistiques</h1><button class="icon-btn" data-go="reglages" aria-label="Réglages">⚙️</button></header>
    <div class="stat-grid">
      ${tile('Sorties', st.totalRuns)}${tile('Km au total', fmtNum(st.totalKm))}
      ${tile('Temps couru', formatDuration(st.totalDuration))}${tile('D+ total', `${fmtNum(st.totalElevation, 0)} m`)}
      ${tile('Allure moyenne', st.avgPace ? paceToString(st.avgPace) + ' /km' : '—')}${tile('Meilleure allure', st.bestPace ? paceToString(st.bestPace) + ' /km' : '—')}
      ${tile('Plus longue sortie', `${fmtNum(st.longestRun)} km`)}${tile('Plus gros D+', `${fmtNum(st.biggestElevation, 0)} m`)}
      ${tile('Km cette semaine', fmtNum(st.kmWeek))}${tile('Km ce mois', fmtNum(st.kmMonth))}

      ${tile('Communes', st.communesCount)}${tile('Fantômes battus', `${LAST_ACC.ghostWins} / ${STATE.runs.filter(r => r.ghost).length}`)}
      ${tile('Courses officielles', st.officialCount)}${tile('Badges', `${all.filter(b => b.unlocked).length} / ${all.length}`)}
    </div>

function feelingCardHtml() {

/* ---------------- Historique ---------------- */

function renderHistorique(el) {
  const runs = sortedRuns().reverse();
  const months = {};
  runs.forEach(r => { (months[r.date.slice(0, 7)] = months[r.date.slice(0, 7)] || []).push(r); });
  el.innerHTML = `
    <header class="topbar"><button class="icon-btn" data-go="stats" aria-label="Retour">←</button><h1 class="screen-title">Historique</h1><span></span></header>
    ${runs.length ? Object.entries(months).map(([m, list]) => `
      <div class="month-title">${parseLocalDate(m + '-01').toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' })}
        <span>${list.length} sortie${list.length > 1 ? 's' : ''} · ${fmtNum(list.reduce((s, r) => s + r.distanceKm, 0))} km</span></div>
      <div class="history-list">${list.map(historyRow).join('')}</div>`).join('')
      : '<div class="empty-state">Aucune course pour le moment.<br><button class="btn-primary" data-go="ajouter">Ajouter ma première course</button></div>'}
  `;
  el.querySelectorAll('.history-row').forEach(row => row.addEventListener('click', () => openRunSheet(row.dataset.id)));
}

function historyRow(r) {
  const wx = (r.weather || []).map(k => (WEATHER_OPTIONS.find(w => w[0] === k) || [])[1] || '').join('');
  const nb = (r.badgesEarned || []).length;
  return `<button class="history-row" data-id="${escapeHtml(r.id)}">
    <div class="history-date"><b>${parseLocalDate(r.date).getDate()}</b><span>${formatDate(r.date, { weekday: 'short' })}</span></div>
    <div class="history-body">
      <div class="history-main">${fmtNum(r.distanceKm, 2)} km <span>· ${formatDuration(r.durationMin)} · ${paceToString(r.paceMinPerKm)} /km</span></div>
      <div class="history-sub">${r.officialRace ? '🎽 ' : ''}${r.communes && r.communes.length ? escapeHtml(r.communes[0]) + ' · ' : ''}${r.department ? escapeHtml(r.department) + ' · ' : ''}${escapeHtml(r.country)}${r.elevationGain ? ' · D+ ' + r.elevationGain + ' m' : ''} ${wx}</div>
    </div>
    <div class="history-side">${r.feeling ? `<span title="Sensation">${FEELINGS[r.feeling - 1][1]}</span>` : ''}${r.ghost ? `<span class="${r.ghost.win ? 'gw' : 'gl'}" title="Duel fantôme">👻${r.ghost.win ? '✓' : ''}</span>` : ''}${nb ? `<span class="history-badges">🏅 ${nb}</span>` : ''}</div>
  </button>`;
}

function badgeById(id) {
  return STATE.badges.find(b => b.id === id) || STATE.weeklyBadges.find(b => b.id === id) || STATE.monthlyBadges.find(b => b.id === id) || challengeBadges().find(b => b.id === id);
}

function openRunSheet(id) {
  const r = STATE.runs.find(x => x.id === id);
  if (!r) return;
  const earned = (r.badgesEarned || []).map(badgeById).filter(Boolean);
  const ch = r.challengeId ? STATE.challenges.find(c => c.id === r.challengeId) : null;
  const deptName = r.department ? (departmentList().find(d => d.code === r.department) || {}).name : '';
  const row = (k, val) => val ? `<div class="kv"><span>${k}</span><b>${val}</b></div>` : '';
  openSheet(`
    <div class="sheet-title">${formatDate(r.date, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}</div>
    <div class="kv-list">
      ${row('Départ', r.time)}${row('Distance', fmtNum(r.distanceKm, 2) + ' km')}${row('Durée', formatDuration(r.durationMin))}
      ${row('Allure', paceToString(r.paceMinPerKm) + ' /km')}${row('Vitesse', fmtNum(r.speedKmH) + ' km/h')}
      ${row('Dénivelé +', r.elevationGain ? r.elevationGain + ' m' : '')}
      ${row('Lieu', escapeHtml([deptName ? `${r.department} ${deptName}` : '', r.country].filter(Boolean).join(', ')))}
      ${row('Sensation', r.feeling ? feelingLabel(r.feeling) : '')}
      ${row('Humeur', r.mood ? MOODS.filter(m => m[0] === r.mood).map(m => m[1] + ' ' + m[2])[0] : '')}
      ${row('Fantôme', r.ghost ? `${r.ghost.win ? '🏆 battu' : '👻 gagnant'} (${paceToString(r.ghost.pace)} /km le ${formatDate(r.ghost.date, { day: 'numeric', month: 'short' })})` : '')}
      ${row('Communes', escapeHtml((r.communes || []).join(', ')))}
      ${row('Lieux', (r.places || []).map(k => { const p = PLACE_TYPES.find(x => x[0] === k); return p ? p[1] + ' ' + p[2] : ''; }).join(', '))}
      ${row('Météo', (r.weather || []).map(k => { const w = WEATHER_OPTIONS.find(x => x[0] === k); return w ? w[1] + ' ' + w[2] : ''; }).join(', '))}
      ${row('Course officielle', r.officialRace ? (OFFICIAL_TYPES.find(t => t[0] === r.officialRaceType) || [0, 'Oui'])[1] : '')}
      ${row('Défi', ch ? escapeHtml(ch.name) : '')}
    </div>
    ${r.comment ? `<p class="run-comment">${escapeHtml(r.comment)}</p>` : ''}
    ${earned.length ? `<div class="card-eyebrow">Badges gagnés ce jour-là</div>
      <div class="mini-grid">${earned.map(b => `<div class="mini-badge">${badgeVisual(b, 'small')}<span>${escapeHtml(b.name)}</span></div>`).join('')}</div>` : ''}
    <div class="sheet-actions">
      <button class="btn-danger" id="del-run">Supprimer</button>
      <button class="btn-primary" id="edit-run">Modifier</button>
    </div>
  `, (sheet, close) => {
    sheet.querySelector('#edit-run').addEventListener('click', () => { close(); editingRunId = r.id; goToScreen('ajouter'); });
    const del = sheet.querySelector('#del-run');
    del.addEventListener('click', () => {
      if (!del.classList.contains('confirm')) { del.classList.add('confirm'); del.textContent = 'Confirmer la suppression'; return; }
      deleteRun(r.id); syncCoach(); close(); renderCurrentScreen(); toast('Course supprimée, tout a été recalculé.');
    });
  });
}

/* ---------------- Bilan mensuel ---------------- */

function renderBilan(el) {
  const months = monthsWithRuns();
  const cur = todayStr().slice(0, 7);
  if (!months.includes(cur)) months.push(cur);
  if (!bilanMonth || !months.includes(bilanMonth)) bilanMonth = months[months.length - 1];
  const i = months.indexOf(bilanMonth);
  const R = monthReport(bilanMonth);
  const mName = MONTH_NAMES_FR[R.month - 1];
  const inProgress = bilanMonth === cur;
  const cmp = (now, before, label) => before > 0 ? `<div class="cmp ${now >= before ? 'up' : 'down'}">${now >= before ? '▲' : '▼'} ${fmtNum(Math.abs(now - before))} km vs ${label}</div>` : '';
  // calendrier du mois
  const first = new Date(R.year, R.month - 1, 1), nDays = new Date(R.year, R.month, 0).getDate();
  const offset = (first.getDay() + 6) % 7;
  const kmByDay = {};
  R.runs.forEach(r => { kmByDay[r.date] = (kmByDay[r.date] || 0) + r.distanceKm; });
  const maxDay = Math.max(1, ...Object.values(kmByDay));
  let cells = '';
  for (let k = 0; k < offset; k++) cells += '<div class="cal-cell empty"></div>';
  for (let d = 1; d <= nDays; d++) {
    const ds = `${bilanMonth}-${pad2(d)}`, km = kmByDay[ds] || 0;
    cells += `<div class="cal-cell ${km ? 'on' : ''}" style="${km ? `--i:${0.35 + 0.65 * km / maxDay}` : ''}" title="${km ? fmtNum(km) + ' km' : ''}">${d}</div>`;
  }
  el.innerHTML = `
    <header class="topbar"><button class="icon-btn" data-go="stats" aria-label="Retour">←</button><h1 class="screen-title">Bilan</h1><span></span></header>
    <div class="month-nav">
      <button class="icon-btn" id="m-prev" ${i <= 0 ? 'disabled' : ''}>‹</button>
      <div class="month-nav-title"><span class="cap">${mName}</span> ${R.year}${inProgress ? '<small>en cours</small>' : ''}</div>
      <button class="icon-btn" id="m-next" ${i >= months.length - 1 ? 'disabled' : ''}>›</button>
    </div>
    ${R.count ? `
    <section class="bilan-hero">
      <div class="bilan-km">${fmtNum(R.km)}<span> km</span></div>
      <div class="bilan-sub">${R.count} sortie${R.count > 1 ? 's' : ''} · ${formatDuration(R.duration)} · ${fmtNum(R.elevation, 0)} m D+</div>
      ${cmp(R.km, R.prevKm, 'le mois précédent')}${R.hasLy ? cmp(R.km, R.lyKm, `${mName} ${R.year - 1}`) : ''}
    </section>
    <section class="card"><div class="card-eyebrow">Jours courus : ${R.days.size}</div>
      <div class="cal-head">${['L', 'M', 'M', 'J', 'V', 'S', 'D'].map(x => `<span>${x}</span>`).join('')}</div>
      <div class="cal-grid">${cells}</div></section>
    <div class="stat-grid">
      <div class="stat-tile"><div class="stat-num">${fmtNum(R.longest.distanceKm)} km</div><div class="stat-label">plus longue sortie · ${formatDate(R.longest.date, { day: 'numeric', month: 'short' })}</div></div>
      <div class="stat-tile"><div class="stat-num">${R.fastest ? paceToString(R.fastest.paceMinPerKm) + ' /km' : '—'}</div><div class="stat-label">meilleure allure${R.fastest ? ' · ' + formatDate(R.fastest.date, { day: 'numeric', month: 'short' }) : ''}</div></div>
      <div class="stat-tile"><div class="stat-num">${R.avgPace ? paceToString(R.avgPace) : '—'}</div><div class="stat-label">allure moyenne /km</div></div>
      <div class="stat-tile"><div class="stat-num">${R.duels ? `${R.ghostWins} / ${R.duels}` : '—'}</div><div class="stat-label">duels fantôme gagnés</div></div>
      <div class="stat-tile"><div class="stat-num">${R.avgFeeling ? FEELINGS[Math.round(R.avgFeeling) - 1][1] : '—'}</div><div class="stat-label">sensation moyenne${R.avgFeeling ? ' · ' + FEELINGS[Math.round(R.avgFeeling) - 1][2].toLowerCase() : ''}</div></div>
      <div class="stat-tile"><div class="stat-num">${R.monthly.filter(b => b.unlocked).length} / ${R.monthly.length || 5}</div><div class="stat-label">défis du mois</div></div>
    </div>
    ${R.newCommunes.length ? `<section class="card"><div class="card-eyebrow">🧭 Nouvelles communes (${R.newCommunes.length})</div><p class="commune-list">${R.newCommunes.map(escapeHtml).join(' · ')}</p></section>` : ''}
    <section class="card"><div class="card-eyebrow">🏅 Badges gagnés : ${R.badges.length}</div>
      ${R.badges.length ? `<div class="mini-grid">${R.badges.slice(0, 18).map(b => `<div class="mini-badge">${badgeVisual(b, 'small')}<span>${escapeHtml(b.collection === 'hebdomadaire' ? `Semaine ${b.week} · ${b.target} km` : b.name)}</span></div>`).join('')}</div>${R.badges.length > 18 ? `<p class="muted small center">… et ${R.badges.length - 18} autres</p>` : ''}` : '<p class="muted">Pas de nouveau badge ce mois-ci.</p>'}
    </section>
    <button class="btn-primary" id="share-bilan">📤 Partager mon bilan en image</button>
    ` : `<div class="empty-state">Aucune sortie en ${mName} ${R.year} pour le moment.</div>`}
  `;
  const nav = (d) => { bilanMonth = months[i + d]; renderCurrentScreen(); };
  el.querySelector('#m-prev').addEventListener('click', () => i > 0 && nav(-1));
  el.querySelector('#m-next').addEventListener('click', () => i < months.length - 1 && nav(1));
  const sh = el.querySelector('#share-bilan');
  if (sh) sh.addEventListener('click', () => shareBilanImage(R));
}

function bilanCanvas(R) {
  const W = 1080, H = 1350, c = document.createElement('canvas');
  c.width = W; c.height = H;
  const x = c.getContext('2d');
  const F = (w, sz) => `${w} ${sz}px "Space Grotesk", "Inter", system-ui, sans-serif`;
  const g = x.createLinearGradient(0, 0, W, H); g.addColorStop(0, '#171D1A'); g.addColorStop(1, '#0E1210');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  x.fillStyle = 'rgba(255,122,69,.12)'; x.beginPath(); x.arc(W - 120, 160, 260, 0, Math.PI * 2); x.fill();
  x.fillStyle = '#EDF2EE'; x.font = F(700, 44); x.fillText('Run', 80, 110);
  x.fillStyle = '#FF7A45'; x.fillText('Quest', 80 + x.measureText('Run').width, 110);
  x.fillStyle = '#93A69A'; x.font = F(700, 34); x.fillText(`BILAN · ${MONTH_NAMES_FR[R.month - 1].toUpperCase()} ${R.year}`, 80, 190);
  x.fillStyle = '#EDF2EE'; x.font = F(700, 190); x.fillText(fmtNum(R.km), 70, 400);
  const w = x.measureText(fmtNum(R.km)).width; x.fillStyle = '#93A69A'; x.font = F(600, 64); x.fillText('km', 90 + w, 400);
  x.font = F(500, 38); x.fillStyle = '#EDF2EE';
  x.fillText(`${R.count} sortie${R.count > 1 ? 's' : ''}  ·  ${formatDuration(R.duration)}  ·  ${fmtNum(R.elevation, 0)} m D+`, 80, 480);
  const tiles = [
    ['Plus longue sortie', `${fmtNum(R.longest.distanceKm)} km`],
    ['Meilleure allure', R.fastest ? `${paceToString(R.fastest.paceMinPerKm)} /km` : '—'],
    ['Jours courus', String(R.days.size)],
    ['Badges gagnés', String(R.badges.length)],
    ['Fantômes battus', R.duels ? `${R.ghostWins} / ${R.duels}` : '—'],
    ['Nouvelles communes', String(R.newCommunes.length)],
  ];
  tiles.forEach(([lab, val], k) => {
    const tx = 80 + (k % 2) * 470, ty = 560 + Math.floor(k / 2) * 190;
    x.fillStyle = '#1F2620'; x.beginPath(); x.roundRect ? x.roundRect(tx, ty, 450, 160, 28) : x.rect(tx, ty, 450, 160); x.fill();
    x.fillStyle = '#EDF2EE'; x.font = F(700, 58); x.fillText(val, tx + 34, ty + 82);
    x.fillStyle = '#93A69A'; x.font = F(500, 30); x.fillText(lab, tx + 34, ty + 128);
  });
  if (R.prevKm > 0) {
    const up = R.km >= R.prevKm;
    x.fillStyle = up ? '#6BCB77' : '#E5615A'; x.font = F(700, 40);
    x.fillText(`${up ? '▲' : '▼'} ${fmtNum(Math.abs(R.km - R.prevKm))} km par rapport au mois précédent`, 80, 1200);
  }
  x.fillStyle = '#5E6D63'; x.font = F(500, 28); x.fillText('Généré avec RunQuest', 80, 1280);
  return c;
}

async function shareBilanImage(R) {
  const canvas = bilanCanvas(R);
  const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
  const name = `runquest-bilan-${R.mk}.png`;
  try {
    const file = new File([blob], name, { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: `Mon bilan RunQuest — ${MONTH_NAMES_FR[R.month - 1]} ${R.year}` });
      return;
    }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast('Image du bilan téléchargée.');
}

        <input type="number" inputmode="numeric" id="birth-year" min="1920" max="2020" placeholder="ex : 1988" value="${s.birthYear || ''}"></label>
    </section>

    <section class="card">
      <div class="card-eyebrow">💾 Données</div>
      <p class="muted small">Tes courses ne sont stockées que dans ce navigateur. Dernier export : <b>${s.lastExport ? formatDate(s.lastExport) : 'jamais'}</b>.</p>
      <button class="btn-secondary wide" id="export-btn">Exporter une sauvegarde (JSON)</button>
      <label class="btn-secondary wide file-label">Importer une sauvegarde<input type="file" id="import-input" accept="application/json,.json" hidden></label>
      <button class="btn-danger wide" id="reset-btn">Tout effacer</button>
    </section>
    <p class="muted small center">RunQuest ${APP_VERSION}</p>
  `;

  const $ = id => el.querySelector('#' + id);
  const bind = (id, ev, fn) => { const x = $(id); if (x) x.addEventListener(ev, fn); };
  bind('on-notif', 'click', () => enableNotifications());
  bind('off-notif', 'click', () => { n.enabled = false; saveData(); syncCoach(); renderCurrentScreen(); });
  bind('test-notif', 'click', () => testNotification());
  bind('install-btn', 'click', () => promptInstall());
  bind('inact-days', 'change', e => { n.inactivityDays = Number(e.target.value); saveData(); syncCoach(); });
  el.querySelectorAll('[data-notif]').forEach(c => c.addEventListener('change', () => { n[c.dataset.notif] = c.checked; saveData(); syncCoach(); }));
  el.querySelectorAll('input[name="smode"]').forEach(r => r.addEventListener('change', () => {
    s.streakMode = r.value; recalculateEverything(); saveData(); syncCoach(); renderCurrentScreen(); toast('Série recalculée.');
  }));
  bind('rest-days', 'change', e => { s.restDays = Number(e.target.value); recalculateEverything(); saveData(); syncCoach(); toast('Série recalculée.'); });
  el.querySelectorAll('input[name="gmode"]').forEach(r => r.addEventListener('change', () => {
    s.ghostMode = r.value; recalculateEverything(); saveData(); toast('Fantômes recalculés.');
  }));
  bind('goal-runs', 'change', e => { s.weeklyGoalRuns = Number(e.target.value); saveData(); toast('Objectif mis à jour.'); });
  bind('bday', 'change', e => {
    s.birthday = e.target.value ? e.target.value.slice(5) : null; s.birthdayAsked = true;
    const res = commitRunChange(() => {}); toast('Anniversaire enregistré.'); showCelebrations(res.newBadges.map(b => ({ kind: 'badge', badge: b })));
  });
  bind('birth-year', 'change', e => { const v = Number(e.target.value); s.birthYear = v >= 1920 && v <= 2020 ? v : null; saveData(); syncCoach(); toast(s.birthYear ? 'Âge pris en compte pour la récupération.' : 'Année retirée.'); });
  bind('export-btn', 'click', () => { exportData(); syncCoach(); renderCurrentScreen(); toast('Sauvegarde téléchargée.'); });
  bind('import-input', 'change', async e => {
    const f = e.target.files[0]; if (!f) return;
    try { importDataFromText(await readFileText(f)); syncCoach(); goToScreen('accueil'); toast('Sauvegarde importée.'); }
    catch (err) { toast("Ce fichier n'est pas une sauvegarde RunQuest valide.", true); }
  });
  bind('reset-btn', 'click', e => {
    const b = e.currentTarget;
    if (!b.classList.contains('confirm')) { b.classList.add('confirm'); b.textContent = 'Sûr ? Toutes les courses seront effacées'; return; }
    localStorage.removeItem(STORAGE_KEY); loadData(); recalculateEverything(); saveData(); goToScreen('accueil'); toast('Données effacées.');
  });
}

/* ---------------- Anniversaire (1re ouverture) ---------------- */

function maybeAskBirthday() {
  if (STATE.settings.birthdayAsked) return;
  openSheet(`
    <div class="sheet-title center">Bienvenue sur RunQuest 👟</div>
    <p class="muted center">Quelle est ta date d'anniversaire ? Elle sert uniquement au badge « 🎂 Birthday Run ». Seuls le jour et le mois sont gardés, sur cet appareil.</p>
    <input type="date" id="bday-first" class="text-input">
    <div class="sheet-actions"><button class="btn-ghost" id="bday-skip">Plus tard</button><button class="btn-primary" id="bday-ok">Valider</button></div>
  `, (sheet, close) => {
    sheet.querySelector('#bday-skip').addEventListener('click', () => { STATE.settings.birthdayAsked = true; saveData(); close(); });
    sheet.querySelector('#bday-ok').addEventListener('click', () => {
      const v = sheet.querySelector('#bday-first').value;
      STATE.settings.birthdayAsked = true;
      if (v) STATE.settings.birthday = v.slice(5);
      recalculateEverything(); saveData(); close(); renderCurrentScreen();
    });
  });
}

/* ---------------- PWA & notifications ---------------- */

async function registerServiceWorker() {
  if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
  try {
    await navigator.serviceWorker.register('./sw.js');
    SW_REG = await navigator.serviceWorker.ready;
    syncCoach();
    registerPeriodicSync();
  } catch (e) { console.warn('Service worker indisponible', e); }
}

async function syncCoach() {
  if (!SW_REG || !('caches' in window)) return;
  try {
    const cache = await caches.open('runquest-data');
    await cache.put('./__rq_summary.json', new Response(JSON.stringify(buildCoachSummary()), { headers: { 'Content-Type': 'application/json' } }));
    if (SW_REG.active) SW_REG.active.postMessage({ type: 'coach-check' });
  } catch (e) { console.warn(e); }
}

async function registerPeriodicSync() {
  try {
    if (!SW_REG || !('periodicSync' in SW_REG) || !STATE.settings.notifications.enabled) return;
    const perm = await navigator.permissions.query({ name: 'periodic-background-sync' });
    if (perm.state === 'granted') await SW_REG.periodicSync.register('rq-coach', { minInterval: 6 * 60 * 60 * 1000 });
  } catch (e) { /* non supporté : rappels à l'ouverture seulement */ }
}

async function enableNotifications() {
  if (!('Notification' in window)) return toast('Notifications non disponibles sur ce navigateur.', true);
  if (location.protocol === 'file:' || !SW_REG) return toast("Ouvre l'appli depuis son adresse web pour activer les notifications.", true);
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') { toast('Notifications refusées.', true); renderCurrentScreen(); return; }
  STATE.settings.notifications.enabled = true;
  saveData();
  await syncCoach();
  registerPeriodicSync();
  renderCurrentScreen();
  toast('Notifications activées 🔔');
}

function testNotification() {
  if (!SW_REG) return;
  SW_REG.showNotification('RunQuest 👟', { body: 'Les notifications fonctionnent. À bientôt sur la route !', icon: 'icons/icon-192.png', badge: 'icons/icon-192.png', tag: 'test' });
}

async function promptInstall() {
  if (!deferredInstall) return;
  deferredInstall.prompt();
  await deferredInstall.userChoice;
  deferredInstall = null;
  renderCurrentScreen();
}

document.addEventListener('DOMContentLoaded', initApp);

</script>
