<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1210">
<title>RunQuest — Motivation course à pied</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   RunQuest — design tokens
   Palette : nuit forestière + accent lever-de-soleil
   Type : Space Grotesk (display) + Inter (texte)
   ========================================================= */

:root {
  --bg: #0E1210;
  --surface: #171D1A;
  --surface-2: #1F2620;
  --surface-3: #263029;
  --border: #2B342E;
  --text: #EDF2EE;
  --text-muted: #8FA396;
  --text-faint: #5A6960;
  --accent: #FF7A45;
  --accent-dim: #B85C34;
  --moss: #6BCB77;
  --gold: #E8B84B;
  --danger: #E5615A;
  --radius-lg: 20px;
  --radius-md: 14px;
  --radius-sm: 10px;
  --nav-height: 76px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', system-ui, sans-serif;
  -webkit-tap-highlight-color: transparent;
}

body {
  min-height: 100vh;
  padding-bottom: calc(var(--nav-height) + 16px);
}

h1, h2, h3 { font-family: 'Space Grotesk', 'Inter', sans-serif; margin: 0; }

button, input, select, textarea {
  font-family: inherit;
  color: inherit;
}

.app-root {
  max-width: 560px;
  margin: 0 auto;
  padding: 20px 16px 8px;
}

/* ---------------- Navigation basse ---------------- */

.bottom-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: var(--nav-height);
  background: rgba(23, 29, 26, 0.92);
  backdrop-filter: blur(14px);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-around;
  padding-bottom: env(safe-area-inset-bottom);
  z-index: 50;
}

.nav-btn {
  background: none;
  border: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  color: var(--text-faint);
  font-size: 11px;
  font-weight: 600;
  padding: 8px 10px;
  min-width: 56px;
  min-height: 48px;
  justify-content: center;
  border-radius: var(--radius-sm);
}

.nav-btn .nav-icon { font-size: 20px; line-height: 1; }
.nav-btn.active { color: var(--accent); }

.nav-btn-center {
  background: linear-gradient(160deg, var(--accent), var(--accent-dim));
  color: #1a0f08;
  width: 56px; height: 56px;
  border-radius: 50%;
  font-size: 28px;
  font-weight: 700;
  box-shadow: 0 6px 18px rgba(255, 122, 69, 0.35);
  margin-top: -18px;
}
.nav-btn-center .nav-icon { font-size: 28px; }
.nav-btn-center.active { color: #1a0f08; }

/* ---------------- Cartes génériques ---------------- */

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 18px;
  margin-bottom: 14px;
}
.card.empty { text-align: center; cursor: pointer; }

.card-eyebrow, .collection-eyebrow {
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-muted);
  font-weight: 600;
  margin-bottom: 6px;
}
.card-title { font-size: 18px; font-weight: 600; margin-bottom: 10px; }
.card-foot { font-size: 13px; color: var(--text-muted); margin-top: 8px; }

.progress-bar {
  height: 10px;
  background: var(--surface-3);
  border-radius: 999px;
  overflow: hidden;
}
.progress-bar.small { height: 7px; }
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--moss), #8FE39C);
  border-radius: 999px;
  transition: width 0.4s ease;
}
.progress-fill.accent {
  background: linear-gradient(90deg, var(--accent), var(--gold));
}

/* ---------------- Accueil ---------------- */

.hero {
  padding: 22px 4px 26px;
}
.hero-label {
  font-size: 12px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-muted);
  font-weight: 600;
}
.hero-value {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 56px;
  font-weight: 700;
  line-height: 1.05;
  margin-top: 4px;
  background: linear-gradient(120deg, var(--text), var(--moss));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}
.hero-unit { font-size: 24px; font-weight: 600; color: var(--text-muted); -webkit-text-fill-color: var(--text-muted); }
.hero-sub { margin-top: 8px; font-size: 14px; color: var(--text-muted); }

.stat-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin: 18px 0;
}
.stat-grid.full { grid-template-columns: repeat(2, 1fr); }
.stat-tile {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 14px;
}
.stat-num { font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; }
.stat-label { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

.fab-inline {
  width: 100%;
  padding: 16px;
  border: none;
  border-radius: var(--radius-lg);
  background: linear-gradient(160deg, var(--accent), var(--accent-dim));
  color: #1a0f08;
  font-weight: 700;
  font-size: 16px;
  margin-top: 6px;
  cursor: pointer;
}

/* ---------------- Écrans génériques ---------------- */

.screen-title { font-size: 26px; font-weight: 700; margin-bottom: 16px; }
.section-title {
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  margin: 22px 0 10px;
  font-weight: 700;
}

/* ---------------- Défis ---------------- */

.challenge-list { display: flex; flex-direction: column; gap: 10px; }
.challenge-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 14px;
}
.challenge-item.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.challenge-item.completed { border-color: var(--gold); }
.challenge-name { font-weight: 700; font-size: 15px; }
.challenge-desc { font-size: 12.5px; color: var(--text-muted); margin: 4px 0 10px; }
.challenge-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 12.5px; color: var(--text-muted); }

.badge-pill {
  background: var(--accent);
  color: #1a0f08;
  font-weight: 700;
  font-size: 11px;
  padding: 4px 10px;
  border-radius: 999px;
}
.btn-small {
  background: var(--surface-3);
  border: 1px solid var(--border);
  color: var(--text);
  font-size: 12px;
  font-weight: 600;
  padding: 8px 12px;
  border-radius: 999px;
  min-height: 34px;
}

/* ---------------- Formulaire ---------------- */

.run-form {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.run-form label {
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-muted);
}
.run-form input, .run-form select, .run-form textarea {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 14px;
  font-size: 16px;
  color: var(--text);
  min-height: 48px;
}
.run-form textarea { min-height: 72px; resize: vertical; }
.duration-row { display: flex; align-items: center; gap: 8px; }
.duration-row input { flex: 1; min-width: 0; }
.duration-sep { font-size: 12px; color: var(--text-faint); font-weight: 600; }
.tcx-import-label { display: block; margin-bottom: 6px; text-align: center; cursor: pointer; }
.tcx-hint { font-size: 12px; color: var(--text-muted); text-align: center; margin-bottom: 18px; }
.checkbox-row { flex-direction: row; align-items: center; gap: 10px; }
.checkbox-row input { width: 22px; height: 22px; min-height: unset; }

.btn-primary {
  border: none;
  border-radius: var(--radius-lg);
  padding: 16px;
  background: linear-gradient(160deg, var(--accent), var(--accent-dim));
  color: #1a0f08;
  font-weight: 700;
  font-size: 16px;
  margin-top: 6px;
  min-height: 52px;
}
.btn-secondary {
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 14px;
  background: var(--surface);
  color: var(--text);
  font-weight: 600;
  font-size: 14px;
  text-align: center;
  min-height: 48px;
  cursor: pointer;
}
.file-label { display: block; }

/* ---------------- Collection ---------------- */

.collection-header {
  text-align: center;
  padding: 20px 0;
}
.collection-count {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 40px;
  font-weight: 700;
}

.badge-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
.badge-tile {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 14px 8px;
  text-align: center;
  position: relative;
  min-height: 96px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.badge-tile.unlocked {
  border-color: var(--moss);
  background: linear-gradient(160deg, var(--surface-2), var(--surface));
}
.badge-tile.locked { opacity: 0.55; filter: grayscale(0.7); }
.badge-tile-icon { font-size: 24px; }
.lock-icon { position: absolute; top: 8px; right: 8px; font-size: 12px; }
.badge-tile-name { font-size: 10.5px; font-weight: 600; line-height: 1.25; }

/* ---------------- Historique ---------------- */

.history-list { display: flex; flex-direction: column; gap: 8px; }
.history-row {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 12px 14px;
  cursor: pointer;
}
.history-date { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; font-weight: 700; }
.history-main { font-weight: 600; margin: 3px 0; }
.history-sub { font-size: 12px; color: var(--text-muted); }
.empty-state { color: var(--text-muted); font-size: 14px; padding: 20px 0; text-align: center; }

.data-actions { display: flex; flex-direction: column; gap: 10px; margin: 22px 0; }

/* ---------------- Animation de déblocage ---------------- */

.unlock-overlay {
  position: fixed;
  inset: 0;
  background: rgba(5, 8, 6, 0.88);
  backdrop-filter: blur(6px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 24px;
  animation: fadeIn 0.25s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.unlock-card {
  background: var(--surface);
  border: 1px solid var(--gold);
  border-radius: var(--radius-lg);
  padding: 28px 22px;
  max-width: 340px;
  width: 100%;
  text-align: center;
  animation: popIn 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.2);
}
@keyframes popIn { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }

.unlock-label {
  font-family: 'Space Grotesk', sans-serif;
  color: var(--gold);
  font-weight: 700;
  letter-spacing: 0.08em;
  font-size: 13px;
  margin-bottom: 14px;
}
.unlock-image { display: flex; justify-content: center; margin-bottom: 14px; }
.badge-image-wrap { width: 96px; height: 96px; }
.badge-real-image {
  width: 96px; height: 96px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid var(--gold);
  background: var(--surface-2);
}
.badge-placeholder {
  width: 96px; height: 96px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, var(--surface-3), var(--surface));
  border: 2px solid var(--gold);
  display: flex;
  align-items: center;
  justify-content: center;
}
.badge-icon { font-size: 42px; }
.unlock-name { font-weight: 700; font-size: 18px; margin-bottom: 6px; }
.unlock-condition { font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
.unlock-date { font-size: 12px; color: var(--text-faint); margin-bottom: 18px; }
.birthday-input {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px;
  font-size: 16px;
  color: var(--text);
  width: 100%;
  margin: 14px 0;
  min-height: 46px;
}
.birthday-actions { display: flex; gap: 10px; }
.birthday-actions .btn-secondary, .birthday-actions .btn-primary { flex: 1; margin-top: 0; }

/* ---------------- Toast ---------------- */

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(var(--nav-height) + 16px);
  transform: translate(-50%, 12px);
  background: var(--surface-3);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 12px 18px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
  opacity: 0;
  transition: all 0.3s ease;
  z-index: 200;
  max-width: 90%;
  text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast-error { border-color: var(--danger); color: var(--danger); }

/* ---------------- Accessibilité / responsive ---------------- */

button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

@media (min-width: 640px) {
  .badge-grid { grid-template-columns: repeat(4, 1fr); }
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

</style>

/* ============ data/weekly.js ============ */
// Données des badges hebdomadaires temporaires.
// Chaque entrée = une semaine avec 5 niveaux (10/20/30/40/50 km).
// Pour ajouter une nouvelle semaine : copier un bloc, changer year/week/theme/images.
// Le "theme" est purement graphique et sert de nom interne ; l'affichage utilisateur
// reste générique ("Badge hebdomadaire — Semaine XX — Niveau N").

const WEEKLY_LEVELS_KM = [10, 20, 30, 40, 50];

function makeWeeklyBadges(year, week, theme) {
  return WEEKLY_LEVELS_KM.map((km, idx) => ({
    id: `weekly_${year}_${week}_${idx + 1}`,
    name: `Badge hebdomadaire — Semaine ${week} (${year}) — Niveau ${idx + 1}`,
    collection: "hebdomadaire",
    theme,
    level: idx + 1,
    description: `Courir ${km} km cumulés durant la semaine ${week} de ${year}`,
    condition: `${km} km cumulés cette semaine-là`,
    target: km,
    unit: "km",
    image: `assets/badges/weekly/${theme}_niveau${idx + 1}.png`,
    unlocked: false,
    unlockedDate: null,
    year,
    week,
  }));
}

// Semaines pré-configurées (thèmes graphiques indicatifs, à personnaliser librement)
const WEEKLY_THEMES = [
  { year: 2026, week: 32, theme: "constellation" },
  { year: 2026, week: 33, theme: "vagues" },
  { year: 2026, week: 34, theme: "foret_nocturne" },
];

const WEEKLY_BADGES = WEEKLY_THEMES.flatMap(w => makeWeeklyBadges(w.year, w.week, w.theme));

// Pioche de thèmes utilisée pour générer AUTOMATIQUEMENT les semaines non
// pré-configurées (passées ou futures). Cycle déterministe : la même semaine
// tombe toujours sur le même thème, même après rechargement.
const THEME_POOL = [
  "constellation", "vagues", "foret_nocturne", "aurore", "comete", "dune",
  "glacier", "meteore", "brasier", "lagune", "eclipse", "canyon", "toundra",
  "nebuleuse", "maree_haute", "orage", "corail", "sequoia", "givre", "mirage",
];

function themeForWeek(year, week) {
  const index = (year * 100 + week) % THEME_POOL.length;
  return THEME_POOL[index];
}

if (typeof module !== 'undefined') module.exports = { WEEKLY_LEVELS_KM, makeWeeklyBadges, WEEKLY_THEMES, WEEKLY_BADGES, THEME_POOL, themeForWeek };


/* ============ app.js (moteur) ============ */
'use strict';

/* =========================================================
   RunQuest — moteur de l'application
   Architecture : moteur générique + données externes (data/*.js)
   ========================================================= */

const STORAGE_KEY = 'runquest_state_v1';

const DEFAULT_STATE = () => ({
  runs: [],
  badges: JSON.parse(JSON.stringify(typeof BADGES !== 'undefined' ? BADGES : [])),
  weeklyBadges: JSON.parse(JSON.stringify(typeof WEEKLY_BADGES !== 'undefined' ? WEEKLY_BADGES : [])),
  challenges: JSON.parse(JSON.stringify(typeof CHALLENGES !== 'undefined' ? CHALLENGES : [])),
  activeChallengeId: null,
  settings: { birthday: null },
});

let STATE = null;

/* ---------------- Stockage ---------------- */

function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
    return true;
  } catch (e) {
    console.error('Erreur de sauvegarde', e);
    return false;
  }
}

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) {
      STATE = DEFAULT_STATE();
      saveData();
      return STATE;
    }
    const parsed = JSON.parse(raw);
    // Fusion souple : si de nouveaux badges/défis/semaines ont été ajoutés au code
    // depuis la dernière sauvegarde, on les ajoute sans perdre la progression existante.
    STATE = mergeWithDefaults(parsed);
    return STATE;
  } catch (e) {
    console.error('Erreur de chargement, réinitialisation', e);
    STATE = DEFAULT_STATE();
    saveData();
    return STATE;
  }
}

function mergeWithDefaults(saved) {
  const fresh = DEFAULT_STATE();
  const merged = {
    runs: saved.runs || [],
    badges: mergeById(fresh.badges, saved.badges || [], ['unlocked', 'unlockedDate']),
    weeklyBadges: mergeById(fresh.weeklyBadges, saved.weeklyBadges || [], ['unlocked', 'unlockedDate']),
    challenges: mergeById(fresh.challenges, saved.challenges || [], ['currentKm', 'checkpointsReached', 'completed', 'completedDate', 'startTotalKm']),
    activeChallengeId: saved.activeChallengeId || null,
    settings: Object.assign({ birthday: null, birthdayAsked: false }, saved.settings || {}),
  };
  return merged;
}

// Ne conserve QUE les champs de progression indiqués dans keepKeys depuis la
// sauvegarde ; tout le reste (nom, description, image...) vient toujours de
// la définition actuelle du code, pour que les mises à jour de contenu
// (renommage d'un badge, etc.) s'appliquent bien même aux joueurs existants.
function mergeById(freshArr, savedArr, keepKeys) {
  const savedById = {};
  savedArr.forEach(item => { savedById[item.id] = item; });
  return freshArr.map(item => {
    const saved = savedById[item.id];
    if (!saved) return item;
    const merged = Object.assign({}, item);
    keepKeys.forEach(k => { if (saved[k] !== undefined) merged[k] = saved[k]; });
    return merged;
  });
}

function exportData() {
  const blob = new Blob([JSON.stringify(STATE, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `runquest-sauvegarde-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function importData(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      if (!parsed || !Array.isArray(parsed.runs)) throw new Error('Format invalide');
      STATE = mergeWithDefaults(parsed);
      recalculateEverything();
      saveData();
      renderCurrentScreen();
      toast('Sauvegarde importée avec succès.');
    } catch (e) {
      console.error(e);
      toast("Le fichier importé n'est pas une sauvegarde valide.", true);
    }
  };
  reader.readAsText(file);
}

/* ---------------- Calculs ---------------- */

function calculatePace(distanceKm, durationMin) {
  if (!distanceKm || distanceKm <= 0) return null;
  return durationMin / distanceKm; // min/km
}

function paceToString(paceMinPerKm) {
  if (paceMinPerKm == null || !isFinite(paceMinPerKm)) return '—';
  const min = Math.floor(paceMinPerKm);
  const sec = Math.round((paceMinPerKm - min) * 60);
  return `${min}:${String(sec).padStart(2, '0')} /km`;
}

function paceStringToMinutes(str) {
  // "5:00" -> 5.0
  const [m, s] = str.split(':').map(Number);
  return m + (s || 0) / 60;
}

function calculateSpeed(distanceKm, durationMin) {
  if (!durationMin || durationMin <= 0) return null;
  return (distanceKm / durationMin) * 60; // km/h
}

function startOfWeek(date) {
  const d = new Date(date);
  const day = (d.getDay() + 6) % 7; // lundi = 0
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - day);
  return d;
}

function isoWeekInfo(dateStr) {
  const d = new Date(dateStr);
  const target = new Date(d.valueOf());
  const dayNr = (d.getDay() + 6) % 7;
  target.setDate(target.getDate() - dayNr + 3);
  const firstThursday = new Date(target.getFullYear(), 0, 4);
  const week = 1 + Math.round(((target - firstThursday) / 86400000 - 3 + ((firstThursday.getDay() + 6) % 7)) / 7);
  return { year: target.getFullYear(), week };
}

function calculateStats() {
  const runs = STATE.runs;
  const now = new Date();
  const weekStart = startOfWeek(now);
  const monthKey = `${now.getFullYear()}-${now.getMonth()}`;
  const yearKey = `${now.getFullYear()}`;

  let totalKm = 0, totalDuration = 0, totalElevation = 0;
  let kmWeek = 0, kmMonth = 0, kmYear = 0;
  let longestRun = 0, bestPace = Infinity, biggestElevation = 0;
  const departmentsVisited = new Set();
  const countriesVisited = new Set();
  let officialCount = 0;

  runs.forEach(r => {
    totalKm += r.distanceKm;
    totalDuration += r.durationMin;
    totalElevation += r.elevationGain || 0;
    longestRun = Math.max(longestRun, r.distanceKm);
    biggestElevation = Math.max(biggestElevation, r.elevationGain || 0);
    if (r.paceMinPerKm && r.paceMinPerKm < bestPace) bestPace = r.paceMinPerKm;
    if (r.department) departmentsVisited.add(r.department);
    if (r.country) countriesVisited.add(r.country);
    if (r.officialRace) officialCount++;

    const rDate = new Date(r.date);
    if (rDate >= weekStart) kmWeek += r.distanceKm;
    if (`${rDate.getFullYear()}-${rDate.getMonth()}` === monthKey) kmMonth += r.distanceKm;
    if (`${rDate.getFullYear()}` === yearKey) kmYear += r.distanceKm;
  });

  const streaks = calculateStreaks(runs);

  return {
    totalKm, totalDuration, totalElevation,
    kmWeek, kmMonth, kmYear,
    totalRuns: runs.length,
    longestRun, bestPace: isFinite(bestPace) ? bestPace : null, biggestElevation,
    departmentsVisited: [...departmentsVisited],
    countriesVisited: [...countriesVisited],
    officialCount,
    currentStreak: streaks.current,
    longestStreak: streaks.longest,
    lastRun: runs.length ? runs.slice().sort((a, b) => new Date(b.date) - new Date(a.date))[0] : null,
  };
}

function calculateStreaks(runs) {
  if (!runs.length) return { current: 0, longest: 0 };
  const days = [...new Set(runs.map(r => r.date))].sort();
  let longest = 1, current = 1, streak = 1;
  for (let i = 1; i < days.length; i++) {
    const prev = new Date(days[i - 1]);
    const cur = new Date(days[i]);
    const diff = Math.round((cur - prev) / 86400000);
    if (diff === 1) { streak++; } else { streak = 1; }
    longest = Math.max(longest, streak);
  }
  // série "actuelle" : à partir d'aujourd'hui, en remontant
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const daySet = new Set(days);
  let cur = 0;
  let cursor = new Date(today);
  // si pas couru aujourd'hui, la série actuelle part d'hier
  if (!daySet.has(today.toISOString().slice(0, 10))) {
    cursor.setDate(cursor.getDate() - 1);
  }
  while (daySet.has(cursor.toISOString().slice(0, 10))) {
    cur++;
    cursor.setDate(cursor.getDate() - 1);
  }
  return { current: cur, longest };
}

function weeklyKmFor(year, week, runs) {
  return runs
    .filter(r => {
      const info = isoWeekInfo(r.date);
      return info.year === year && info.week === week;
    })
    .reduce((sum, r) => sum + r.distanceKm, 0);
}

/* ---------------- Moteur de badges (data-driven) ---------------- */

// Chaque collection a une fonction "progress(badge, ctx) -> {value, unlocked}"
const BADGE_CHECKERS = {
  distance_unique: (badge, ctx) => ({ value: ctx.stats.longestRun, unlocked: ctx.stats.longestRun >= badge.target }),
  regularite: (badge, ctx) => ({ value: ctx.stats.longestStreak, unlocked: ctx.stats.longestStreak >= badge.target }),
  vitesse: (badge, ctx) => {
    const targetPace = paceStringToMinutes(badge.target);
    const best = ctx.stats.bestPace;
    const unlocked = best != null && best <= targetPace;
    return { value: best, unlocked };
  },
  denivele: (badge, ctx) => ({ value: ctx.stats.biggestElevation, unlocked: ctx.stats.biggestElevation >= badge.target }),
  departements: (badge, ctx) => ({ value: null, unlocked: ctx.stats.departmentsVisited.includes(badge.deptCode) }),
  pays: (badge, ctx) => ({ value: null, unlocked: ctx.stats.countriesVisited.some(c => c.toLowerCase() === badge.country.toLowerCase()) }),
  distance_cumulee: (badge, ctx) => ({ value: ctx.stats.totalKm, unlocked: ctx.stats.totalKm >= badge.target }),
  jours_particuliers: (badge, ctx) => {
    if (badge.date === 'configurable') {
      const bday = STATE.settings.birthday; // "MM-DD"
      if (!bday) return { value: null, unlocked: false };
      return { value: null, unlocked: ctx.runs.some(r => r.date.slice(5) === bday) };
    }
    return { value: null, unlocked: ctx.runs.some(r => r.date.slice(5) === badge.date) };
  },
  horaires: (badge, ctx) => ({ value: null, unlocked: checkTimingBadge(badge, ctx) }),
  meteo: (badge, ctx) => ({ value: null, unlocked: ctx.runs.some(r => r.weather === weatherKeyForBadge(badge.id)) }),
  courses_officielles: (badge, ctx) => ({ value: null, unlocked: checkOfficialBadge(badge, ctx) }),
};

function weatherKeyForBadge(id) {
  return id.replace('weather_', '');
}

function checkTimingBadge(badge, ctx) {
  const runs = ctx.runs;
  switch (badge.id) {
    case 'time_sunrise':
      return runs.some(r => r.time && r.time >= '06:00' && r.time <= '07:30');
    case 'time_sunset':
      return runs.some(r => r.time && r.time >= '20:00' && r.time <= '21:30');
    case 'time_midnight_runner':
      return runs.some(r => runCrossesMidnight(r));
    case 'time_night_owl':
      return runs.some(r => runEntirelyBetween(r, '00:00', '05:00'));
    case 'time_summer_solstice':
      return runs.some(r => r.date.slice(5) === '06-21');
    case 'time_winter_solstice':
      return runs.some(r => r.date.slice(5) === '12-21');
    default:
      return false;
  }
}

function runCrossesMidnight(r) {
  if (!r.time || !r.durationMin) return false;
  const [h, m] = r.time.split(':').map(Number);
  const startMin = h * 60 + m;
  return startMin + r.durationMin >= 24 * 60;
}

function runEntirelyBetween(r, startStr, endStr) {
  if (!r.time || !r.durationMin) return false;
  const [h, m] = r.time.split(':').map(Number);
  const startMin = h * 60 + m;
  const endMin = startMin + r.durationMin;
  const [sh, sm] = startStr.split(':').map(Number);
  const [eh, em] = endStr.split(':').map(Number);
  return startMin >= sh * 60 + sm && endMin <= eh * 60 + em;
}

function checkOfficialBadge(badge, ctx) {
  const officialRuns = ctx.runs.filter(r => r.officialRace);
  switch (badge.id) {
    case 'official_first': return officialRuns.length >= 1;
    case 'official_first_5k': return officialRuns.some(r => r.distanceKm >= 5);
    case 'official_first_10k': return officialRuns.some(r => r.distanceKm >= 10);
    case 'official_first_half': return officialRuns.some(r => r.distanceKm >= 21.1);
    case 'official_first_nature': return officialRuns.some(r => r.officialRaceType === 'nature');
    case 'official_first_trail': return officialRuns.some(r => r.officialRaceType === 'trail');
    case 'official_first_night': return officialRuns.some(r => r.officialRaceType === 'nocturne');
    case 'official_first_charity': return officialRuns.some(r => r.officialRaceType === 'caritative');
    case 'official_first_abroad': return officialRuns.some(r => r.country && r.country.toLowerCase() !== 'france');
    case 'official_10': return officialRuns.length >= 10;
    case 'official_25': return officialRuns.length >= 25;
    case 'official_50': return officialRuns.length >= 50;
    case 'official_100': return officialRuns.length >= 100;
    default: return false;
  }
}

function checkBadges(stats) {
  const ctx = { runs: STATE.runs, stats };
  const newlyUnlocked = [];
  STATE.badges.forEach(badge => {
    if (badge.unlocked) return;
    const checker = BADGE_CHECKERS[badge.collection];
    if (!checker) return;
    const result = checker(badge, ctx);
    if (result.unlocked) {
      badge.unlocked = true;
      badge.unlockedDate = new Date().toISOString().slice(0, 10);
      newlyUnlocked.push(badge);
    }
  });
  return newlyUnlocked;
}

function checkWeeklyBadges() {
  ensureWeeklyBadgesExist();
  const newlyUnlocked = [];
  const byWeek = {};
  STATE.weeklyBadges.forEach(b => {
    const key = `${b.year}-${b.week}`;
    (byWeek[key] = byWeek[key] || []).push(b);
  });
  Object.entries(byWeek).forEach(([key, badgesOfWeek]) => {
    const { year, week } = badgesOfWeek[0];
    const kmThisWeek = weeklyKmFor(year, week, STATE.runs);
    badgesOfWeek.forEach(b => {
      if (!b.unlocked && kmThisWeek >= b.target) {
        b.unlocked = true;
        b.unlockedDate = new Date().toISOString().slice(0, 10);
        newlyUnlocked.push(b);
      }
    });
  });
  return newlyUnlocked;
}

// Génère automatiquement les 5 badges d'une semaine dès qu'elle est concernée
// (semaine en cours à chaque ouverture de l'appli, ou toute semaine où une
// course a été enregistrée — y compris rétroactivement). Un thème est choisi
// de façon déterministe dans THEME_POOL, sauf si la semaine a été
// pré-configurée manuellement dans WEEKLY_THEMES (data/weekly.js).
function ensureWeeklyBadgesExist() {
  const neededWeeks = new Set();
  const { year: curYear, week: curWeek } = isoWeekInfo(new Date().toISOString().slice(0, 10));
  neededWeeks.add(`${curYear}-${curWeek}`);
  STATE.runs.forEach(r => {
    const { year, week } = isoWeekInfo(r.date);
    neededWeeks.add(`${year}-${week}`);
  });
  const existing = new Set(STATE.weeklyBadges.map(b => `${b.year}-${b.week}`));
  neededWeeks.forEach(key => {
    if (existing.has(key)) return;
    const [year, week] = key.split('-').map(Number);
    const preset = (typeof WEEKLY_THEMES !== 'undefined') ? WEEKLY_THEMES.find(w => w.year === year && w.week === week) : null;
    const theme = preset ? preset.theme : themeForWeek(year, week);
    const created = makeWeeklyBadges(year, week, theme);
    STATE.weeklyBadges.push(...created);
    existing.add(key);
  });
}

/* ---------------- Défis ---------------- */

function updateChallengeProgress() {
  if (!STATE.activeChallengeId) return null;
  const challenge = STATE.challenges.find(c => c.id === STATE.activeChallengeId);
  if (!challenge) return null;
  const totalKm = STATE.runs.reduce((sum, r) => sum + r.distanceKm, 0);
  // Le défi cumule les km parcourus DEPUIS son activation
  const startKm = challenge.startTotalKm || 0;
  challenge.currentKm = Math.min(challenge.targetKm, Math.max(0, totalKm - startKm));
  const pct = (challenge.currentKm / challenge.targetKm) * 100;
  [25, 50, 75, 100].forEach(cp => {
    if (pct >= cp && !challenge.checkpointsReached.includes(cp)) {
      challenge.checkpointsReached.push(cp);
    }
  });
  if (pct >= 100 && !challenge.completed) {
    challenge.completed = true;
    challenge.completedDate = new Date().toISOString().slice(0, 10);
  }
  return challenge;
}

function activateChallenge(challengeId) {
  const totalKm = STATE.runs.reduce((sum, r) => sum + r.distanceKm, 0);
  STATE.challenges.forEach(c => {
    if (c.id === challengeId) {
      c.startTotalKm = totalKm - c.currentKm; // conserve la progression déjà faite si ré-activé
    }
  });
  STATE.activeChallengeId = challengeId;
  saveData();
}

/* ---------------- Recalcul global ---------------- */

function recalculateEverything() {
  // Repartir des badges/défis vierges puis rejouer l'historique dans l'ordre chronologique
  const runsSorted = STATE.runs.slice().sort((a, b) => new Date(a.date) - new Date(b.date));
  STATE.badges.forEach(b => { b.unlocked = false; b.unlockedDate = null; });
  STATE.weeklyBadges.forEach(b => { b.unlocked = false; b.unlockedDate = null; });
  STATE.challenges.forEach(c => { c.currentKm = 0; c.checkpointsReached = []; c.completed = false; c.completedDate = null; });

  // recompute pace per run
  STATE.runs.forEach(r => {
    r.paceMinPerKm = calculatePace(r.distanceKm, r.durationMin);
    r.speedKmH = calculateSpeed(r.distanceKm, r.durationMin);
  });

  const stats = calculateStats();
  checkBadges(stats);
  checkWeeklyBadges();
  updateChallengeProgress();
  return stats;
}

/* ---------------- Ajout / édition / suppression de course ---------------- */

function addRun(runData) {
  const run = Object.assign({ id: 'run_' + Date.now() }, runData);
  run.paceMinPerKm = calculatePace(run.distanceKm, run.durationMin);
  run.speedKmH = calculateSpeed(run.distanceKm, run.durationMin);
  STATE.runs.push(run);

  const stats = calculateStats();
  updateChallengeProgress();
  const newBadges = checkBadges(stats);
  const newWeekly = checkWeeklyBadges();
  saveData();
  return { stats, newBadges: [...newBadges, ...newWeekly] };
}

function deleteRun(runId) {
  STATE.runs = STATE.runs.filter(r => r.id !== runId);
  recalculateEverything();
  saveData();
}

function updateRun(runId, updates) {
  const idx = STATE.runs.findIndex(r => r.id === runId);
  if (idx === -1) return;
  STATE.runs[idx] = Object.assign({}, STATE.runs[idx], updates);
  recalculateEverything();
  saveData();
}

function nextReachableWeeklyBadge(stats) {
  const { year, week } = isoWeekInfo(new Date().toISOString().slice(0, 10));
  const badgesThisWeek = STATE.weeklyBadges.filter(b => b.year === year && b.week === week);
  if (!badgesThisWeek.length) return null;
  const kmThisWeek = weeklyKmFor(year, week, STATE.runs);
  const next = badgesThisWeek.find(b => !b.unlocked);
  if (!next) return null;
  return {
    badge: next,
    remaining: Math.max(0, next.target - kmThisWeek),
    pct: (kmThisWeek / next.target) * 100,
  };
}

  const categories = ['court', 'moyen', 'long', 'legendaire'];
  const catLabels = { court: 'Courts (20–150 km)', moyen: 'Moyens (150–500 km)', long: 'Longs (500–1500 km)', legendaire: 'Légendaires (1500+ km)' };

  el.innerHTML = `<h1 class="screen-title">Défis</h1>` + categories.map(cat => {
    const items = STATE.challenges.filter(c => c.category === cat);
    return `
      <h2 class="section-title">${catLabels[cat]}</h2>
      <div class="challenge-list">
        ${items.map(c => renderChallengeCard(c)).join('')}
      </div>
    `;
  }).join('');
  root.appendChild(el);

  el.querySelectorAll('.btn-activate-challenge').forEach(btn => {
    btn.addEventListener('click', () => handleActivateChallenge(btn.dataset.id));
  });
}

function renderChallengeCard(c) {
  const active = c.id === STATE.activeChallengeId;
  const pct = Math.min(100, Math.round((c.currentKm / c.targetKm) * 100));
  return `
    <div class="challenge-item ${active ? 'active' : ''} ${c.completed ? 'completed' : ''}">
      <div class="challenge-name">${escapeHtml(c.name)}${c.completed ? ' 🏆' : ''}</div>
      <div class="challenge-desc">${escapeHtml(c.description)}</div>
      <div class="progress-bar small"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="challenge-foot">
        <span>${formatKm(c.currentKm)} / ${formatKm(c.targetKm)} km (${pct}%)</span>
        ${active ? '<span class="badge-pill">Actif</span>' : `<button class="btn-small btn-activate-challenge" data-id="${c.id}">Activer</button>`}
      </div>
    </div>
  `;
}

function escapeHtml(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function handleActivateChallenge(id) {
  activateChallenge(id);
  renderCurrentScreen();
  toast('Nouveau défi actif !');
}

/* ---------------- Ajouter une course ---------------- */

function renderAjouter(root) {
  const el = document.createElement('div');
  el.className = 'screen screen-ajouter';
  const today = new Date().toISOString().slice(0, 10);
  const nowTime = new Date().toTimeString().slice(0, 5);
  el.innerHTML = `
    <h1 class="screen-title">Ajouter une course</h1>

    <label class="tcx-import-label btn-secondary file-label">📥 Importer un fichier TCX
      <input type="file" id="tcx-input" accept=".tcx,application/xml,text/xml" hidden>
    </label>
    <div class="tcx-hint">Remplit automatiquement date, heure, distance, durée et dénivelé. Pays/département restent à saisir toi-même.</div>

    <form id="run-form" class="run-form">
      <label>Date <input type="date" name="date" value="${today}" required></label>
      <label>Heure de départ <input type="time" name="time" value="${nowTime}" required></label>
      <label>Distance (km) <input type="number" step="0.01" min="0.01" name="distanceKm" required></label>
      <label>Durée
        <div class="duration-row">
          <input type="number" step="1" min="0" name="durationMinPart" placeholder="min" required>
          <span class="duration-sep">min</span>
          <input type="number" step="1" min="0" max="59" name="durationSecPart" placeholder="sec" value="0">
          <span class="duration-sep">sec</span>
        </div>
      </label>
      <label>Dénivelé positif (m) <input type="number" step="1" min="0" name="elevationGain" value="0"></label>
      <label>Pays <input type="text" name="country" value="France" required></label>
      <label>Département (si France) <input type="text" name="department" placeholder="ex : 75, 2A, 971"></label>
      <label>Météo
        <select name="weather">
          <option value="">—</option>
          <option value="pluie_fine">Pluie fine</option>
          <option value="deluge">Déluge</option>
          <option value="vent_face">Vent de face</option>
          <option value="canicule">Canicule</option>
          <option value="grand_froid">Grand froid</option>
          <option value="neige">Neige</option>
          <option value="brouillard">Brouillard</option>
          <option value="orage_loin">Orage au loin</option>
        </select>
      </label>
      <label class="checkbox-row"><input type="checkbox" name="officialRace"> Course officielle</label>
      <label>Type de course officielle
        <select name="officialRaceType">
          <option value="">—</option>
          <option value="route">Route</option>
          <option value="nature">Nature</option>
          <option value="trail">Trail</option>
          <option value="nocturne">Nocturne</option>
          <option value="caritative">Caritative</option>
        </select>
      </label>
      <label>Commentaire <textarea name="comment" rows="2"></textarea></label>
      <button type="submit" class="btn-primary">Enregistrer la course</button>
    </form>
  `;
  root.appendChild(el);
  document.getElementById('run-form').addEventListener('submit', handleRunSubmit);
  document.getElementById('tcx-input').addEventListener('change', (e) => {
    if (e.target.files[0]) handleTcxImport(e.target.files[0]);
  });
}

function handleTcxImport(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = parseTCX(reader.result);
      if (!parsed.distanceKm && !parsed.durationMin) throw new Error('Fichier TCX vide ou non reconnu');
      const form = document.getElementById('run-form');
      if (parsed.startDateTime) {
        const d = new Date(parsed.startDateTime);
        form.elements['date'].value = d.toISOString().slice(0, 10);
        form.elements['time'].value = d.toTimeString().slice(0, 5);
      }
      if (parsed.distanceKm) form.elements['distanceKm'].value = Math.round(parsed.distanceKm * 100) / 100;
      if (parsed.durationMin) {
        form.elements['durationMinPart'].value = Math.floor(parsed.durationMin);
        form.elements['durationSecPart'].value = Math.round((parsed.durationMin % 1) * 60);
      }
      if (parsed.elevationGain != null) form.elements['elevationGain'].value = parsed.elevationGain;
      toast('Fichier TCX importé — vérifie les champs puis complète pays/département.');
    } catch (e) {
      console.error(e);
      toast("Impossible de lire ce fichier TCX.", true);
    }
  };
  reader.readAsText(file);
}

function parseTCX(xmlString) {
  const parser = new DOMParser();
  const xml = parser.parseFromString(xmlString, 'application/xml');
  if (xml.querySelector('parsererror')) throw new Error('XML invalide');
  const laps = Array.from(xml.getElementsByTagName('Lap'));
  let totalTimeSec = 0, totalDistanceM = 0, elevationGain = 0;
  let firstTime = null, prevAltitude = null;
  laps.forEach(lap => {
    const t = lap.getElementsByTagName('TotalTimeSeconds')[0];
    if (t) totalTimeSec += parseFloat(t.textContent) || 0;
    const d = lap.getElementsByTagName('DistanceMeters')[0];
    if (d) totalDistanceM += parseFloat(d.textContent) || 0;
    Array.from(lap.getElementsByTagName('Trackpoint')).forEach(tp => {
      const timeEl = tp.getElementsByTagName('Time')[0];
      if (timeEl && !firstTime) firstTime = timeEl.textContent;
      const altEl = tp.getElementsByTagName('AltitudeMeters')[0];
      if (altEl) {
        const alt = parseFloat(altEl.textContent);
        if (!isNaN(alt)) {
          if (prevAltitude != null && alt > prevAltitude) elevationGain += (alt - prevAltitude);
          prevAltitude = alt;
        }
      }
    });
  });
  return {
    distanceKm: totalDistanceM / 1000,
    durationMin: totalTimeSec / 60,
    elevationGain: Math.round(elevationGain),
    startDateTime: firstTime,
  };
}

function handleRunSubmit(ev) {
  ev.preventDefault();
  const form = ev.target;
  const fd = new FormData(form);
  const minPart = parseFloat(fd.get('durationMinPart') || 0);
  const secPart = parseFloat(fd.get('durationSecPart') || 0);
  const runData = {
    date: fd.get('date'),
    time: fd.get('time'),
    distanceKm: parseFloat(fd.get('distanceKm')),
    durationMin: minPart + secPart / 60,
    elevationGain: parseFloat(fd.get('elevationGain') || 0),
    country: (fd.get('country') || '').trim(),
    department: (fd.get('department') || '').trim(),
    weather: fd.get('weather') || '',
    officialRace: fd.get('officialRace') === 'on',
    officialRaceType: fd.get('officialRaceType') || '',
    comment: (fd.get('comment') || '').trim(),
  };
  if (!runData.distanceKm || !runData.durationMin) {
    toast('Distance et durée sont requises.', true);
    return;
  }
  const { newBadges } = addRun(runData);
  updateChallengeProgress();
  saveData();
  form.reset();
  toast('Course enregistrée !');
  if (newBadges.length) {
    showBadgeUnlockSequence(newBadges);
  } else {
    goToScreen('accueil');
  }
}

/* ---------------- Animation de déblocage ---------------- */

function showBadgeUnlockSequence(badges) {
  let idx = 0;
  function showNext() {
    if (idx >= badges.length) { goToScreen('accueil'); return; }
    const badge = badges[idx];
    idx++;
    const overlay = document.createElement('div');
    overlay.className = 'unlock-overlay';
    overlay.innerHTML = `
      <div class="unlock-card">
        <div class="unlock-label">BADGE DÉBLOQUÉ !</div>
        <div class="unlock-image">${badgeImageOrPlaceholder(badge)}</div>
        <div class="unlock-name">${badge.name}</div>
        <div class="unlock-condition">${badge.condition || badge.description || ''}</div>
        <div class="unlock-date">${formatDate(badge.unlockedDate)}</div>
        <button class="btn-primary">Continuer</button>
      </div>
    `;
    overlay.querySelector('button').addEventListener('click', () => {
      overlay.remove();
      showNext();
    });
    document.body.appendChild(overlay);
  }
  showNext();
}

function badgeImageOrPlaceholder(badge) {
  // Si un fichier image existe au chemin indiqué (badge.image), on l'affiche.
  // Sinon (fichier absent), l'événement onerror bascule automatiquement sur
  // un placeholder stylé basé sur la catégorie — l'appli fonctionne donc
  // même si aucune image n'a encore été créée.
  const icon = categoryIcon(badge.collection);
  return `<div class="badge-image-wrap">
    <img src="${escapeHtml(badge.image)}" alt="${escapeHtml(badge.name)}" class="badge-real-image"
         onerror="this.parentElement.innerHTML='<div class=&quot;badge-placeholder&quot;><span class=&quot;badge-icon&quot;>${icon}</span></div>'">
  </div>`;
}

function categoryIcon(collection) {
  const icons = {
    distance_unique: '🐾', regularite: '🔥', vitesse: '⚡', denivele: '⛰️',
    departements: '📍', pays: '🌍', jours_particuliers: '📅', horaires: '🕐',
    meteo: '☁️', distance_cumulee: '🛣️', courses_officielles: '🏅', hebdomadaire: '✨',
  };
  return icons[collection] || '🏆';
}

/* ---------------- Collection ---------------- */

function renderCollection(root) {
  const el = document.createElement('div');
  el.className = 'screen screen-collection';
  const allBadges = [...STATE.badges, ...STATE.weeklyBadges];
  const unlockedCount = allBadges.filter(b => b.unlocked).length;

  const byCategory = {};
  allBadges.forEach(b => { (byCategory[b.collection] = byCategory[b.collection] || []).push(b); });

  el.innerHTML = `
    <div class="collection-header">
      <div class="collection-eyebrow">Badges obtenus</div>
      <div class="collection-count">${unlockedCount} / ${allBadges.length}</div>
    </div>
    ${Object.entries(byCategory).map(([cat, badges]) => `
      <h2 class="section-title">${CATEGORY_LABELS[cat] || cat}</h2>
      <div class="badge-grid">
        ${badges.map(b => renderBadgeTile(b)).join('')}
      </div>
    `).join('')}
  `;
  root.appendChild(el);

  el.querySelectorAll('.badge-tile').forEach(tile => {
    tile.addEventListener('click', () => openBadgeSheet(tile.dataset.id, tile.dataset.weekly === '1'));
  });
}

function renderBadgeTile(b) {
  return `
    <div class="badge-tile ${b.unlocked ? 'unlocked' : 'locked'}" data-id="${b.id}" data-weekly="${b.year ? '1' : '0'}">
      <div class="badge-tile-icon">${categoryIcon(b.collection)}</div>
      ${!b.unlocked ? '<div class="lock-icon">🔒</div>' : ''}
      <div class="badge-tile-name">${b.name}</div>
    </div>
  `;
}

function openBadgeSheet(id, isWeekly) {
  const badge = (isWeekly ? STATE.weeklyBadges : STATE.badges).find(b => b.id === id);
  if (!badge) return;
  const progress = badgeProgressText(badge);
  const sheet = document.createElement('div');
  sheet.className = 'unlock-overlay';
  sheet.innerHTML = `
    <div class="unlock-card">
      <div class="unlock-image">${badgeImageOrPlaceholder(badge)}</div>
      <div class="unlock-name">${badge.name}</div>
      <div class="unlock-condition">${badge.condition || badge.description || ''}</div>
      ${badge.unlocked
        ? `<div class="unlock-date">Débloqué le ${formatDate(badge.unlockedDate)}</div>`
        : `<div class="unlock-date">${progress}</div>`}
      <button class="btn-primary">Fermer</button>
    </div>
  `;
  sheet.querySelector('button').addEventListener('click', () => sheet.remove());
  document.body.appendChild(sheet);
}

function badgeProgressText(badge) {
  const stats = calculateStats();
  const ctx = { runs: STATE.runs, stats };
  const checker = BADGE_CHECKERS[badge.collection];
  if (!checker) return 'Progression indisponible';
  const result = checker(badge, ctx);
  if (badge.target != null && result.value != null && typeof result.value === 'number') {
    const unit = badge.unit === 'min/km' ? '' : ` ${badge.unit || ''}`;
    if (badge.unit === 'min/km') {
      return `Meilleure allure : ${paceToString(result.value)} (objectif ${badge.target})`;
    }
    return `Progression : ${formatKm(result.value)} / ${badge.target}${unit}`;
  }
  return 'Non débloqué pour le moment';
}

/* ---------------- Statistiques ---------------- */

function renderStats(root) {
  const stats = calculateStats();
  const el = document.createElement('div');
  el.className = 'screen screen-stats';
  el.innerHTML = `
    <h1 class="screen-title">Statistiques</h1>
    <div class="stat-grid full">
      ${statTile('Sorties', stats.totalRuns)}
      ${statTile('Km totaux', formatKm(stats.totalKm))}
      ${statTile('Temps total', formatDuration(stats.totalDuration))}
      ${statTile('D+ total', `${Math.round(stats.totalElevation)} m`)}
      ${statTile('Plus longue sortie', `${formatKm(stats.longestRun)} km`)}
      ${statTile('Meilleure allure', stats.bestPace ? paceToString(stats.bestPace) : '—')}
      ${statTile('Plus gros D+', `${Math.round(stats.biggestElevation)} m`)}
      ${statTile('Km cette semaine', formatKm(stats.kmWeek))}
      ${statTile('Km ce mois', formatKm(stats.kmMonth))}
      ${statTile('Km cette année', formatKm(stats.kmYear))}
      ${statTile('Départements visités', stats.departmentsVisited.length)}
      ${statTile('Pays visités', stats.countriesVisited.length)}
      ${statTile('Courses officielles', stats.officialCount)}
      ${statTile('Badges obtenus', [...STATE.badges, ...STATE.weeklyBadges].filter(b => b.unlocked).length)}
    </div>

    <h2 class="section-title">Historique</h2>
    <div class="history-list">
      ${STATE.runs.slice().sort((a, b) => new Date(b.date) - new Date(a.date)).map(r => renderHistoryRow(r)).join('') || '<div class="empty-state">Aucune course enregistrée pour le moment.</div>'}
    </div>

    <div class="data-actions">
      <button class="btn-secondary" id="btn-export">Exporter les données (JSON)</button>
      <label class="btn-secondary file-label">Importer une sauvegarde
        <input type="file" id="btn-import" accept="application/json" hidden>
      </label>
    </div>
  `;
  root.appendChild(el);

  document.getElementById('btn-export').addEventListener('click', exportData);
  document.getElementById('btn-import').addEventListener('change', (e) => {
    if (e.target.files[0]) importData(e.target.files[0]);
  });

  el.querySelectorAll('.history-row').forEach(row => {
    row.addEventListener('click', () => handleHistoryRowClick(row.dataset.id));
  });
}

function statTile(label, value) {
  return `<div class="stat-tile"><div class="stat-num">${value}</div><div class="stat-label">${label}</div></div>`;
}

function renderHistoryRow(r) {
  return `
    <div class="history-row" data-id="${r.id}">
      <div class="history-date">${formatDate(r.date)}</div>
      <div class="history-main">${formatKm(r.distanceKm)} km · ${formatDuration(r.durationMin)} · ${paceToString(r.paceMinPerKm)}</div>
      <div class="history-sub">${r.department ? 'Dép. ' + r.department + ' · ' : ''}${r.country}${r.elevationGain ? ' · D+ ' + Math.round(r.elevationGain) + ' m' : ''}</div>
    </div>
  `;
}

function handleHistoryRowClick(runId) {
  const run = STATE.runs.find(r => r.id === runId);
  if (!run) return;
  const action = confirm(`Course du ${formatDate(run.date)} — ${formatKm(run.distanceKm)} km.\n\nOK pour supprimer, Annuler pour garder.`);
  if (action) {
    deleteRun(runId);
    renderCurrentScreen();
    toast('Course supprimée, statistiques recalculées.');
  }
}

/* ---------------- Formatage ---------------- */

function formatKm(n) {
  if (n == null) return '—';
  return (Math.round(n * 10) / 10).toLocaleString('fr-FR');
}

function formatDate(dateStr) {
  if (!dateStr) return '—';
  const d = new Date(dateStr);
  return d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' });
}

function formatDuration(minutes) {
  if (minutes == null) return '—';
  const h = Math.floor(minutes / 60);
  const m = Math.round(minutes % 60);
  return h > 0 ? `${h} h ${String(m).padStart(2, '0')}` : `${m} min`;
}

document.addEventListener('DOMContentLoaded', initApp);

</script>
