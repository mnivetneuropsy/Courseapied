<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1210">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>RunQuest</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* RunQuest — nuit forestière + accent lever de soleil */
:root {
  --bg: #0E1210; --surface: #171D1A; --surface-2: #1F2620; --surface-3: #283129; --border: #2B342E;
  --text: #EDF2EE; --text-muted: #93A69A; --text-faint: #5E6D63;
  --accent: #FF7A45; --accent-dim: #C45B31; --moss: #6BCB77; --gold: #E8B84B; --danger: #E5615A;
  --radius-lg: 20px; --radius-md: 14px; --radius-sm: 10px; --nav-height: 72px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
body { min-height: 100vh; padding-bottom: calc(var(--nav-height) + env(safe-area-inset-bottom, 0px) + 20px); }
h1, h2, h3 { font-family: 'Space Grotesk', 'Inter', system-ui, sans-serif; margin: 0; }
button, input, select, textarea { font-family: inherit; color: inherit; }
button { cursor: pointer; }
.hidden { display: none !important; }
.muted { color: var(--text-muted); font-size: 14px; line-height: 1.45; }
.small { font-size: 12px; }
.center { text-align: center; }
.app-root { max-width: 560px; margin: 0 auto; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 8px; }
.screen { animation: screenIn .25s ease; }
@keyframes screenIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* Barre du haut */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 4px 0 8px; min-height: 44px; }
.topbar .screen-title { margin: 0; flex: 1; }
.brand { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: -0.02em; }
.brand span { color: var(--accent); }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); font-size: 18px; display: grid; place-items: center; flex-shrink: 0; }

/* Navigation basse */
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: calc(var(--nav-height) + env(safe-area-inset-bottom, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px);
  background: rgba(20, 26, 23, 0.94); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-around; z-index: 50; }
.nav-btn { background: none; border: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: var(--text-faint); font-size: 11px; font-weight: 600; min-width: 60px; min-height: 52px; border-radius: var(--radius-sm); }
.nav-btn .nav-icon { font-size: 20px; line-height: 1; filter: grayscale(0.6); }
.nav-btn.active { color: var(--accent); }
.nav-btn.active .nav-icon { filter: none; }
.nav-btn-center { background: linear-gradient(160deg, var(--accent), var(--accent-dim)); color: #1a0f08; width: 58px; height: 58px; min-width: 58px; border-radius: 50%;
  box-shadow: 0 6px 20px rgba(255, 122, 69, 0.35); margin-top: -22px; }
.nav-btn-center .nav-icon { font-size: 30px; font-weight: 700; filter: none; }
.nav-btn-center.active { color: #1a0f08; }

/* Cartes */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 18px; margin-bottom: 14px; }
.card.empty { text-align: center; cursor: pointer; }
.card-eyebrow { font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--text-muted); font-weight: 700; margin-bottom: 8px; }
.card-title { font-size: 17px; font-weight: 700; margin-bottom: 10px; }
.card-desc { font-size: 13px; color: var(--text-muted); margin: -4px 0 8px; }
.card-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.card-big { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 22px; white-space: nowrap; color: var(--accent); }
.card-big small { font-size: 12px; color: var(--text-muted); font-weight: 600; }
.card-foot { font-size: 13px; color: var(--text-muted); margin-top: 8px; }
.challenge-card { cursor: pointer; }

.progress-bar { height: 10px; background: var(--surface-3); border-radius: 999px; overflow: hidden; }
.progress-bar.small { height: 6px; margin-top: 6px; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--moss), #9BE7A5); border-radius: 999px; transition: width .5s ease; }
.progress-bar.accent .progress-fill { background: linear-gradient(90deg, var(--accent), var(--gold)); }

/* Accueil */
.hero { padding: 14px 4px 20px; }
.hero-label { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); font-weight: 700; }
.hero-value { font-family: 'Space Grotesk', sans-serif; font-size: 62px; font-weight: 700; line-height: 1.05; margin-top: 4px; letter-spacing: -0.03em; }
.hero-unit { font-size: 24px; color: var(--text-muted); font-weight: 600; letter-spacing: 0; }
.hero-sub { margin-top: 12px; font-size: 14px; color: var(--text-muted); display: flex; gap: 16px; flex-wrap: wrap; }
.level-dots { display: flex; gap: 8px; margin-top: 12px; }
.level-dot { flex: 1; text-align: center; font-size: 11px; font-weight: 700; padding: 6px 0; border-radius: 999px; background: var(--surface-2); color: var(--text-faint); border: 1px solid var(--border); }
.level-dot.on { background: linear-gradient(160deg, var(--gold), var(--accent)); color: #1a0f08; border-color: transparent; }
.next-badge.done .card-title { margin: 0; }
.banner { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px 14px; margin-bottom: 12px; font-size: 14px; display: flex; flex-direction: column; gap: 10px; }
.banner-actions { display: flex; gap: 8px; }
.coach-card { border-radius: var(--radius-md); padding: 14px 16px; margin-bottom: 14px; background: linear-gradient(135deg, rgba(255,122,69,.16), rgba(232,184,75,.08)); border: 1px solid rgba(255,122,69,.35); }
.coach-title { font-weight: 700; font-size: 15px; }
.coach-body { font-size: 13px; color: var(--text-muted); margin-top: 3px; }
.near-list { display: flex; flex-direction: column; gap: 14px; }
.near-item { display: flex; gap: 12px; align-items: center; }
.near-icon { width: 40px; height: 40px; border-radius: 12px; background: var(--surface-2); display: grid; place-items: center; font-size: 20px; flex-shrink: 0; }
.near-main { flex: 1; min-width: 0; }
.near-name { font-weight: 600; font-size: 14px; }
.near-hint { font-size: 12px; color: var(--text-muted); margin-top: 1px; }

.stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 16px 0; }
.stat-tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 14px; }
.stat-tile[data-go] { cursor: pointer; }
.stat-num { font-family: 'Space Grotesk', sans-serif; font-size: 21px; font-weight: 700; }
.stat-label { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.fab-inline { width: 100%; padding: 17px; border: none; border-radius: var(--radius-lg); background: linear-gradient(160deg, var(--accent), var(--accent-dim)); color: #1a0f08; font-weight: 800; font-size: 16px; }

/* Carte stylisée des défis */
.route-svg { width: 100%; height: auto; display: block; margin: 4px 0 6px; }
.rt-base { fill: none; stroke: var(--surface-3); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
.rt-done { fill: none; stroke: var(--accent); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
.rt-cp { fill: var(--surface); stroke: var(--text-faint); stroke-width: 2; }
.rt-cp.on { fill: var(--gold); stroke: var(--gold); }
.rt-runner { fill: var(--text); stroke: var(--accent); stroke-width: 3; }
.rt-finish { font-size: 16px; }
.cp-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 12px; }
.cp { text-align: center; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 4px; }
.cp.on { border-color: var(--gold); }
.cp-pct { font-weight: 700; font-size: 13px; }
.cp.on .cp-pct { color: var(--gold); }
.cp-km { font-size: 11px; color: var(--text-muted); }
.cp-date { font-size: 10px; color: var(--gold); min-height: 12px; }

/* Écrans génériques */
.screen-title { font-size: 26px; font-weight: 700; margin: 6px 0 16px; }
.section-title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--text-muted); margin: 24px 0 10px; font-weight: 700; }

/* Défis */
.challenge-active .btn-ghost { margin-top: 10px; }
.challenge-list { display: flex; flex-direction: column; gap: 10px; }
.challenge-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 14px; }
.challenge-item.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.challenge-item.completed { border-color: rgba(232, 184, 75, .6); }
.challenge-head { display: flex; justify-content: space-between; gap: 10px; }
.challenge-name { font-weight: 700; font-size: 15px; }
.challenge-km { font-size: 12px; color: var(--text-muted); font-weight: 700; white-space: nowrap; }
.challenge-desc { font-size: 12.5px; color: var(--text-muted); margin: 4px 0 8px; }
.challenge-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 12.5px; color: var(--text-muted); gap: 8px; }
.badge-pill { background: var(--accent); color: #1a0f08; font-weight: 800; font-size: 11px; padding: 5px 11px; border-radius: 999px; }

/* Boutons */
.btn-primary { border: none; border-radius: var(--radius-md); padding: 15px 18px; background: linear-gradient(160deg, var(--accent), var(--accent-dim)); color: #1a0f08; font-weight: 800; font-size: 15px; min-height: 50px; width: 100%; }
.btn-secondary { border: 1px solid var(--border); border-radius: var(--radius-md); padding: 14px; background: var(--surface); color: var(--text); font-weight: 600; font-size: 14px; text-align: center; min-height: 48px; display: block; }
.btn-secondary.wide, .btn-danger.wide { width: 100%; margin-top: 10px; }
.btn-small { background: var(--surface-3); border: 1px solid var(--border); color: var(--text); font-size: 13px; font-weight: 700; padding: 9px 14px; border-radius: 999px; min-height: 38px; }
.btn-ghost { background: none; border: 1px solid transparent; color: var(--text-muted); font-weight: 600; font-size: 14px; padding: 12px; min-height: 44px; width: 100%; }
.banner .btn-ghost { width: auto; padding: 9px 12px; min-height: 38px; }
.btn-danger { border: 1px solid rgba(229, 97, 90, .5); background: rgba(229, 97, 90, .08); color: var(--danger); border-radius: var(--radius-md); padding: 14px; font-weight: 700; font-size: 14px; min-height: 48px; }
.btn-danger.confirm { background: var(--danger); color: #1a0806; }
.file-label { cursor: pointer; }
.row-actions { display: flex; gap: 8px; margin-top: 12px; }
.row-actions .btn-ghost { width: auto; }

/* Formulaire */
.import-box { display: flex; flex-direction: column; gap: 4px; align-items: center; text-align: center; border: 1.5px dashed var(--border); border-radius: var(--radius-lg); padding: 16px; margin-bottom: 20px; cursor: pointer; background: var(--surface); }
.import-title { font-weight: 700; }
.import-sub { font-size: 12px; color: var(--text-muted); }
.run-form { display: flex; flex-direction: column; gap: 14px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.run-form label, .sheet-field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--text-muted); }
.sheet-field { margin-top: 12px; }
.sheet-field.inline { flex-direction: row; align-items: center; gap: 8px; margin-top: 12px; }
.field-label { font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: -6px; }
.run-form input, .run-form select, .run-form textarea, .sheet-field input, .sheet-field select, .text-input {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px; font-size: 16px; color: var(--text); min-height: 48px; width: 100%; }
.sheet .sheet-field input, .sheet .sheet-field select, .sheet .text-input { background: var(--surface-2); }
.sheet-field.inline select { width: auto; min-height: 40px; padding: 8px 30px 8px 10px; }
.run-form select, .sheet-field select { appearance: none; -webkit-appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--text-muted) 50%), linear-gradient(135deg, var(--text-muted) 50%, transparent 50%);
  background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
.run-form textarea { min-height: 72px; resize: vertical; }
.run-form input:focus, .run-form select:focus, .run-form textarea:focus, .text-input:focus { outline: none; border-color: var(--accent); }
input[type="date"], input[type="time"] { color-scheme: dark; }
.duration-row { display: flex; align-items: center; gap: 6px; }
.duration-row input { flex: 1; min-width: 0; text-align: center; }
.duration-sep { font-size: 12px; color: var(--text-faint); font-weight: 700; }
.pace-preview { font-size: 13px; color: var(--moss); font-weight: 600; margin-top: -6px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.run-form .chip { display: inline-block; cursor: pointer; }
.chip input { position: absolute; opacity: 0; pointer-events: none; width: 0; height: 0; min-height: 0; }
.chip span { display: inline-block; padding: 9px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); font-size: 13px; font-weight: 600; color: var(--text-muted); }
.chip input:checked + span { background: rgba(107, 203, 119, .15); border-color: var(--moss); color: var(--text); }
.safety-note { font-size: 11.5px; color: var(--text-faint); margin: -4px 0 0; }
.switch-row, .radio-row, .run-form .switch-row { flex-direction: row; align-items: center; gap: 12px; font-size: 14px; color: var(--text); font-weight: 500; padding: 8px 0; cursor: pointer; display: flex; }
.switch-row input, .radio-row input { width: 22px; height: 22px; min-height: 0; flex-shrink: 0; accent-color: var(--accent); margin: 0; }
.radio-row span b { font-weight: 700; }

/* Collection */
.collection-header { text-align: center; padding: 14px 0 18px; }
.collection-count { font-family: 'Space Grotesk', sans-serif; font-size: 44px; font-weight: 700; margin-bottom: 10px; }
.collection-count span { font-size: 22px; color: var(--text-muted); }
.seg { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 4px; margin-bottom: 16px; }
.seg-btn { flex: 1; border: none; background: none; color: var(--text-muted); font-weight: 700; font-size: 13px; padding: 9px; border-radius: 999px; }
.seg-btn.active { background: var(--surface-3); color: var(--text); }
details.cat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); margin-bottom: 12px; overflow: hidden; }
details.cat summary { list-style: none; display: flex; justify-content: space-between; align-items: center; padding: 16px; font-weight: 700; cursor: pointer; }
details.cat summary::-webkit-details-marker { display: none; }
details.cat summary::after { content: '▾'; color: var(--text-faint); margin-left: 8px; transition: transform .2s; }
details.cat[open] summary::after { transform: rotate(180deg); }
.cat-count { margin-left: auto; font-size: 13px; color: var(--text-muted); }
details.cat > .badge-grid { padding: 0 12px 14px; }
.week-block { padding: 0 12px 6px; }
.week-title { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--text-muted); padding: 4px 4px 8px; }
.week-block .badge-grid { padding: 0 0 10px; }
.badge-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.badge-tile { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px 6px 10px; position: relative;
  display: flex; flex-direction: column; align-items: center; gap: 7px; color: var(--text); min-height: 112px; }
.badge-tile.unlocked { border-color: rgba(232, 184, 75, .55); background: linear-gradient(170deg, #2a2a1f, var(--surface-2)); }
.badge-tile.locked .bv { filter: grayscale(1) brightness(.55); opacity: .7; }
.lock-icon { position: absolute; top: 6px; right: 7px; font-size: 11px; }
.badge-tile-name { font-size: 10.5px; font-weight: 600; line-height: 1.25; text-align: center; }
.badge-tile.locked .badge-tile-name { color: var(--text-muted); }
.tile-code { display: block; font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 700; color: var(--gold); }
.badge-tile.locked .tile-code { color: var(--text-muted); }

/* Visuel de badge (image ou icône de repli) */
.bv { position: relative; width: 96px; height: 96px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 30% 30%, var(--surface-3), var(--surface)); border: 2px solid var(--gold); overflow: hidden; flex-shrink: 0; }
.bv-small { width: 52px; height: 52px; border-width: 1.5px; }
.bv-icon { font-size: 42px; }
.bv-small .bv-icon { font-size: 24px; }
.bv img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

/* Feuilles (bottom sheets) */
.sheet-overlay { position: fixed; inset: 0; background: rgba(5, 8, 6, .7); backdrop-filter: blur(4px); z-index: 90; display: flex; align-items: flex-end; justify-content: center; animation: fadeIn .2s ease; }
.sheet { background: var(--surface); border: 1px solid var(--border); border-radius: 22px 22px 0 0; width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto;
  padding: 22px 18px calc(22px + env(safe-area-inset-bottom, 0px)); animation: sheetUp .28s cubic-bezier(.2, .9, .3, 1); }
@keyframes sheetUp { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet > .btn-primary { margin-top: 18px; }
.sheet-title { font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700; margin-bottom: 10px; }
.sheet-badge { display: flex; justify-content: center; margin: 4px 0 12px; }
.sheet-badge.locked .bv { filter: grayscale(1) brightness(.55); }
.sheet-symbol { margin-top: 8px; font-size: 14px; }
.sheet-unlocked { margin-top: 16px; text-align: center; font-weight: 600; font-size: 14px; }
.sheet-progress { margin-top: 16px; background: var(--surface-2); border-radius: var(--radius-md); padding: 12px; }
.sheet-progress-val { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px; margin: 2px 0 8px; }
.sheet-actions { display: flex; gap: 10px; margin-top: 18px; }
.sheet-actions > * { flex: 1; width: auto; }
.kv-list { display: flex; flex-direction: column; margin: 6px 0 12px; }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
.kv span { color: var(--text-muted); }
.kv b { text-align: right; font-weight: 600; }
.run-comment { background: var(--surface-2); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 14px; font-style: italic; }
.mini-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 8px 0; }
.mini-badge { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 10.5px; text-align: center; font-weight: 600; }
.batch-list { display: flex; flex-direction: column; gap: 6px; max-height: 40vh; overflow-y: auto; margin: 10px 0; }
.batch-row { display: grid; grid-template-columns: 24px 1fr; gap: 2px 10px; align-items: center; background: var(--surface-2); border-radius: var(--radius-sm); padding: 10px; cursor: pointer; }
.batch-row input { grid-row: span 2; width: 20px; height: 20px; accent-color: var(--accent); }
.batch-date { font-weight: 700; font-size: 13px; }
.batch-data { font-size: 12px; color: var(--text-muted); }
.batch-row.dup { opacity: .6; }

/* Célébrations */
.unlock-overlay { position: fixed; inset: 0; background: rgba(5, 8, 6, .9); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 24px; animation: fadeIn .25s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.unlock-card { background: var(--surface); border: 1px solid var(--gold); border-radius: 24px; padding: 30px 22px 22px; max-width: 340px; width: 100%; text-align: center;
  animation: popIn .4s cubic-bezier(.2, .9, .3, 1.25); box-shadow: 0 0 60px rgba(232, 184, 75, .18); }
@keyframes popIn { from { transform: scale(.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.unlock-label { font-family: 'Space Grotesk', sans-serif; color: var(--gold); font-weight: 700; letter-spacing: .1em; font-size: 13px; margin-bottom: 16px; }
.unlock-image { display: flex; justify-content: center; margin-bottom: 16px; }
.unlock-image .bv { width: 120px; height: 120px; animation: glow 2s ease-in-out infinite; }
@keyframes glow { 0%, 100% { box-shadow: 0 0 0 rgba(232, 184, 75, 0); } 50% { box-shadow: 0 0 34px rgba(232, 184, 75, .45); } }
.unlock-name { font-weight: 800; font-size: 19px; margin-bottom: 6px; }
.unlock-condition { font-size: 13px; color: var(--text-muted); margin-bottom: 6px; line-height: 1.4; }
.unlock-date { font-size: 12px; color: var(--text-faint); margin-bottom: 18px; }
.celebrate-head { font-family: 'Space Grotesk', sans-serif; color: var(--gold); font-weight: 700; font-size: 18px; text-align: center; margin-bottom: 12px; }
.celebrate-line { text-align: center; font-weight: 600; }

/* Graphiques */
.chart { width: 100%; height: auto; display: block; }
.ch-grid { stroke: var(--border); stroke-width: 1; stroke-dasharray: 3 4; }
.ch-lbl { fill: var(--text-faint); font-size: 9px; font-family: 'Inter', sans-serif; }
.ch-val { fill: var(--text-muted); font-size: 9px; font-weight: 700; font-family: 'Inter', sans-serif; }
.ch-bar { fill: var(--surface-3); }
.ch-bar.cur { fill: var(--accent); }
.ch-line { fill: none; stroke: var(--moss); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.ch-dot { fill: var(--bg); stroke: var(--moss); stroke-width: 2; }

/* Historique */
.month-title { display: flex; justify-content: space-between; align-items: baseline; text-transform: capitalize; font-weight: 700; margin: 20px 2px 10px; }
.month-title span { text-transform: none; font-size: 12px; color: var(--text-muted); font-weight: 600; }
.history-list { display: flex; flex-direction: column; gap: 8px; }
.history-row { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px; color: var(--text); }
.history-date { width: 44px; flex-shrink: 0; text-align: center; background: var(--surface-2); border-radius: var(--radius-sm); padding: 6px 0; }
.history-date b { display: block; font-family: 'Space Grotesk', sans-serif; font-size: 18px; }
.history-date span { font-size: 10px; color: var(--text-muted); text-transform: uppercase; font-weight: 700; }
.history-body { flex: 1; min-width: 0; }
.history-main { font-weight: 700; font-size: 15px; }
.history-main span { font-weight: 500; color: var(--text-muted); font-size: 13px; }
.history-sub { font-size: 12px; color: var(--text-muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.history-badges { font-size: 12px; font-weight: 700; color: var(--gold); white-space: nowrap; }
.empty-state { color: var(--text-muted); font-size: 14px; padding: 40px 0; text-align: center; display: flex; flex-direction: column; gap: 16px; align-items: center; }
.empty-state .btn-primary { width: auto; }

/* Toast */
.toast { position: fixed; left: 50%; bottom: calc(var(--nav-height) + env(safe-area-inset-bottom, 0px) + 16px); transform: translate(-50%, 12px); background: var(--surface-3); border: 1px solid var(--border);
  color: var(--text); padding: 12px 18px; border-radius: 999px; font-size: 13px; font-weight: 600; opacity: 0; transition: all .3s ease; z-index: 200; max-width: 90%; text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast-error { border-color: var(--danger); color: var(--danger); }

button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (min-width: 640px) { .badge-grid { grid-template-columns: repeat(4, 1fr); } }
@media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

/* v2.1 : mois, communes, lieux */
.month-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.month-chip { font-size: 12px; font-weight: 700; padding: 6px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-muted); }
.month-chip.on { background: rgba(232, 184, 75, .15); border-color: var(--gold); color: var(--gold); }
.commune-box { display: flex; flex-direction: column; gap: 8px; }
.commune-add { display: flex; gap: 8px; }
.commune-add input { flex: 1; }
.commune-add .btn-small { min-height: 48px; border-radius: var(--radius-sm); }
.commune-add input:disabled, .commune-add .btn-small:disabled { opacity: .45; }
.chip-tag { border: 1px solid var(--moss); background: rgba(107, 203, 119, .15); color: var(--text); border-radius: 999px; padding: 8px 12px; font-size: 13px; font-weight: 600; }
#commune-chips:empty { display: none; }
.chip.disabled span { opacity: .35; }
.cap { text-transform: capitalize; }

/* v2.2 : fantôme, sensations, bilan */
.cg-row { margin-top: 10px; }
.cg-head { display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; }
.cg-head b.ahead { color: var(--moss); } .cg-head b.behind { color: var(--text-muted); }
.cg-bars { display: flex; flex-direction: column; gap: 3px; margin: 6px 0 4px; }
.cg-bar { height: 7px; border-radius: 999px; min-width: 3px; }
.cg-bar.me { background: linear-gradient(90deg, var(--accent), var(--gold)); }
.cg-bar.ghost { background: repeating-linear-gradient(90deg, #7d8ba0 0 6px, transparent 6px 9px); opacity: .7; }
.cg-foot { font-size: 12px; color: var(--text-muted); }
.feel-chips { gap: 6px; }
.chip.feel span { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 10px; min-width: 58px; font-size: 11px; }
.chip.feel em { font-style: normal; font-size: 22px; }
.ghost-label { color: #A9B7CC; }
.duel { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; margin: 4px 0 18px; }
.duel-side { background: var(--surface-2); border: 1px solid var(--border); border-radius: 16px; padding: 14px 8px; }
.duel-side.win { border-color: var(--gold); box-shadow: 0 0 22px rgba(232, 184, 75, .2); }
.duel-side.ghost { opacity: .85; border-style: dashed; }
.duel-side.ghost.win { opacity: 1; border-style: solid; border-color: #A9B7CC; box-shadow: 0 0 22px rgba(169, 183, 204, .2); }
.duel-who { font-size: 12px; color: var(--text-muted); font-weight: 700; }
.duel-pace { font-family: 'Space Grotesk', sans-serif; font-size: 30px; font-weight: 700; margin-top: 4px; }
.duel-sub { font-size: 11px; color: var(--text-muted); }
.duel-vs { font-weight: 800; color: var(--text-faint); font-size: 13px; }
.history-side { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; font-size: 13px; }
.history-side .gw { color: var(--gold); font-weight: 700; } .history-side .gl { opacity: .5; }
.feel-summary { display: flex; gap: 14px; align-items: center; margin-bottom: 8px; }
.feel-big { font-size: 44px; }
.insight { margin: 12px 0 0; font-size: 14px; background: rgba(107, 203, 119, .1); border-radius: var(--radius-sm); padding: 10px 12px; }
.month-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.month-nav .icon-btn:disabled { opacity: .3; }
.month-nav-title { font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; text-align: center; }
.month-nav-title small { display: block; font-size: 11px; color: var(--accent); font-family: 'Inter', sans-serif; text-transform: uppercase; letter-spacing: .08em; }
.bilan-hero { text-align: center; padding: 10px 0 18px; }
.bilan-km { font-family: 'Space Grotesk', sans-serif; font-size: 64px; font-weight: 700; letter-spacing: -0.03em; }
.bilan-km span { font-size: 24px; color: var(--text-muted); }
.bilan-sub { color: var(--text-muted); font-size: 14px; }
.cmp { font-size: 13px; font-weight: 700; margin-top: 6px; }
.cmp.up { color: var(--moss); } .cmp.down { color: var(--danger); }
.cal-head, .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.cal-head span { text-align: center; font-size: 11px; color: var(--text-faint); font-weight: 700; margin-bottom: 4px; }
.cal-cell { aspect-ratio: 1; border-radius: 8px; background: var(--surface-2); display: grid; place-items: center; font-size: 11px; color: var(--text-faint); }
.cal-cell.empty { background: none; }
.cal-cell.on { background: rgba(255, 122, 69, var(--i)); color: #1a0f08; font-weight: 800; }
.commune-list { margin: 0; line-height: 1.6; }
#share-bilan { margin: 6px 0 10px; }

/* v2.3 : jauge de récupération */
.rec-card { display: flex; gap: 16px; align-items: center; cursor: pointer; }
.rec-ring { flex-shrink: 0; }
.rec-track { fill: none; stroke: var(--surface-3); stroke-width: 9; }
.rec-val { fill: none; stroke-width: 9; stroke-linecap: round; transition: stroke-dasharray .6s ease; }
.rec-pct { fill: var(--text); font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; }
.rec-main { flex: 1; min-width: 0; }
.rec-main .card-eyebrow { margin-bottom: 2px; }
.rec-title { font-weight: 800; font-size: 17px; margin-bottom: 4px; }
.rec-line { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
.rec-line b { color: var(--text); font-weight: 600; }
.rec-warn { font-size: 12px; color: var(--gold); margin-top: 6px; font-weight: 600; }
.rec-sheet-head { display: flex; gap: 16px; align-items: center; margin-bottom: 8px; }
.rec-sheet-head p { margin: 4px 0 0; }
.rec-acwr { margin-top: 12px; border-radius: var(--radius-md); padding: 12px; font-size: 13px; display: flex; flex-direction: column; gap: 4px; background: var(--surface-2); border: 1px solid var(--border); }
.rec-acwr.ok { border-color: rgba(107, 203, 119, .5); } .rec-acwr.warn { border-color: var(--gold); } .rec-acwr.low { border-color: var(--border); }
.rec-acwr span { color: var(--text-muted); }
.rec-method { margin-top: 14px; background: var(--surface-2); border-radius: var(--radius-md); padding: 12px; font-size: 13px; line-height: 1.5; color: var(--text-muted); }
.rec-method summary { font-weight: 700; color: var(--text); cursor: pointer; }
.rec-method b { color: var(--text); }

/* ===== weekly.js ===== */
// Badges hebdomadaires temporaires : 5 niveaux par semaine (km cumulés du lundi au dimanche).
// Les semaines sont générées AUTOMATIQUEMENT. Aucun thème n'est nécessaire côté appli :
// il suffit de déposer les images nommées par semaine, par exemple
//   assets/badges/weekly/2026-S32_niveau1.png  …  2026-S32_niveau5.png
// Optionnel : WEEKLY_OVERRIDES permet de donner un nom affiché à une semaine précise.

const WEEKLY_LEVELS_KM = [10, 20, 30, 40, 50];

const WEEKLY_OVERRIDES = [
  // { year: 2026, week: 32, label: "Semaine spéciale" },
];

function makeWeeklyBadges(year, week) {
  const ov = WEEKLY_OVERRIDES.find(w => w.year === year && w.week === week);
  const ww = String(week).padStart(2, '0');
  return WEEKLY_LEVELS_KM.map((km, idx) => ({
    id: `weekly_${year}_${week}_${idx + 1}`,
    name: `${ov && ov.label ? ov.label + ' — ' : ''}Semaine ${week} (${year}) — Niveau ${idx + 1}`,
    collection: 'hebdomadaire',
    level: idx + 1,
    description: `Courir ${km} km cumulés durant la semaine ${week} de ${year}`,
    condition: `${km} km cumulés dans la semaine`,
    target: km,
    unit: 'km',
    image: `assets/badges/weekly/${year}-S${ww}_niveau${idx + 1}.png`,
    unlocked: false,
    unlockedDate: null,
    year,
    week,
  }));
}

/* ===== monthly.js ===== */
// Badges mensuels temporaires, générés AUTOMATIQUEMENT chaque mois.
// Images : assets/badges/monthly/2026-10_5k.png, _10k, _50km, _100km, _150km
const MONTH_NAMES_FR = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
const MONTHLY_DEFS = [
  { key: '5k', kind: 'single', target: 5, label: '5K', cond: 'Une sortie d\'au moins 5 km' },
  { key: '10k', kind: 'single', target: 10, label: '10K', cond: 'Une sortie d\'au moins 10 km' },
  { key: '50km', kind: 'volume', target: 50, label: '50 km', cond: '50 km cumulés' },
  { key: '100km', kind: 'volume', target: 100, label: '100 km', cond: '100 km cumulés' },
  { key: '150km', kind: 'volume', target: 150, label: '150 km', cond: '150 km cumulés' },
];

function makeMonthlyBadges(year, month) { // month : 1-12
  const mm = String(month).padStart(2, '0');
  const mName = MONTH_NAMES_FR[month - 1];
  const de = /^[aeiouéè]/i.test(mName) ? "d'" : 'de ';
  return MONTHLY_DEFS.map((d, i) => ({
    id: `monthly_${year}_${mm}_${d.key}`,
    name: `${d.label} ${de}${mName} ${year}`,
    collection: 'mensuel',
    kind: d.kind,
    level: i + 1,
    description: `${d.cond} en ${mName} ${year}`,
    condition: `${d.cond} dans le mois`,
    target: d.target,
    unit: 'km',
    image: `assets/badges/monthly/${year}-${mm}_${d.key}.png`,
    unlocked: false,
    unlockedDate: null,
    year, month, monthKey: `${year}-${mm}`,
  }));
}

/* ===== coach.js ===== */
/* ============================================================
   Coach : messages de motivation / rappels.
   Fonction PURE partagée par la page et le service worker :
   elle ne lit que le "résumé" que l'appli lui fournit.
   ============================================================ */

function coachPad(n) { return String(n).padStart(2, '0'); }
function coachDateStr(d) { return `${d.getFullYear()}-${coachPad(d.getMonth() + 1)}-${coachPad(d.getDate())}`; }
function coachParse(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function coachDaysBetween(a, b) { return Math.round((coachParse(b) - coachParse(a)) / 86400000); }
function coachWeekKey(dateStr) {
  const t = coachParse(dateStr);
  const dayNr = (t.getDay() + 6) % 7;
  t.setDate(t.getDate() - dayNr + 3);
  const firstThursday = new Date(t.getFullYear(), 0, 4);
  const week = 1 + Math.round(((t - firstThursday) / 86400000 - 3 + ((firstThursday.getDay() + 6) % 7)) / 7);
  return `${t.getFullYear()}-W${week}`;
}

const COACH_NUDGES = [
  "Même 20 minutes tranquilles, ça compte.",
  "Tes baskets t'attendent près de la porte.",
  "Une petite sortie, et la semaine repart.",
  "Pas besoin d'aller vite : juste d'y aller.",
  "Le plus dur, c'est de lacer les chaussures.",
];

// summary : voir buildCoachSummary() dans l'appli.
// Retourne une liste de { key, type, title, body } triée par priorité.
function computeCoachMessages(summary, now, opts) {
  opts = opts || {};
  if (!summary || !summary.prefs || (!summary.prefs.enabled && !opts.inApp)) return [];
  const p = summary.prefs;
  const today = coachDateStr(now);
  const hour = now.getHours();
  const out = [];
  if (!opts.inApp && (hour < 9 || hour >= 21)) return out; // jamais de notification la nuit

  const sameWeek = summary.weekKey === coachWeekKey(today);
  const kmWeek = sameWeek ? summary.kmWeek : 0;
  const levels = summary.weeklyLevels || [10, 20, 30, 40, 50];
  const unlockedLevels = sameWeek ? (summary.weeklyUnlockedCount || 0) : 0;
  const daysSince = summary.lastRunDate ? coachDaysBetween(summary.lastRunDate, today) : null;
  const dow = now.getDay(); // 0 = dimanche

  // 1. Série en jeu aujourd'hui
  if ((p.streak || opts.inApp) && summary.currentStreak >= 3 && daysSince === summary.restDays + 1 && (hour >= 16 || opts.inApp)) {
    out.push({
      key: `streak:${today}`, type: 'streak',
      title: `🔥 Ta série de ${summary.currentStreak} jours se joue aujourd'hui`,
      body: "Une sortie avant ce soir et elle continue.",
    });
  }

  // 2. Fin de semaine : badge hebdomadaire à portée
  if ((p.weekEnd || opts.inApp) && (dow === 6 || dow === 0) && unlockedLevels < levels.length) {
    const target = levels[unlockedLevels];
    const remaining = Math.round((target - kmWeek) * 10) / 10;
    if (remaining > 0 && remaining <= 12) {
      out.push({
        key: `weekend:${today}`, type: 'weekEnd',
        title: `🏅 Plus que ${String(remaining).replace('.', ',')} km pour le niveau ${unlockedLevels + 1}`,
        body: dow === 0 ? "Dernier jour de la semaine : le badge se joue aujourd'hui !" : "Il reste le week-end pour décrocher le badge de la semaine.",
      });
    }
  }

  // 3. Checkpoint du défi en vue
  const ch = summary.challenge;
  if ((p.challenge || opts.inApp) && ch && ch.nextCheckpointKm != null) {
    const remaining = Math.round((ch.nextCheckpointKm - ch.currentKm) * 10) / 10;
    if (remaining > 0 && remaining <= 5) {
      out.push({
        key: `challenge:${ch.id}:${ch.nextCheckpointPct}`, type: 'challenge',
        title: `🗺️ ${ch.name} : checkpoint ${ch.nextCheckpointPct} % en vue`,
        body: `Plus que ${String(remaining).replace('.', ',')} km pour l'atteindre.`,
      });
    }
  }

  // 2 bis. Récupéré après une grosse séance
  const rec = summary.recovery;
  if ((p.recovery || opts.inApp) && rec && rec.hours >= 36) {
    const ra = new Date(rec.readyAt);
    if (now >= ra && now - ra < 20 * 3600000) {
      out.push({
        key: `recovered:${rec.runDate}`, type: 'recovery',
        title: "✅ Tu es récupéré !",
        body: "Tes jambes ont eu le temps d'encaisser : prêt pour une belle séance.",
      });
    }
  }

  // 3 bis. Bilan du mois écoulé disponible (les 3 premiers jours du mois)
  if ((p.bilan || opts.inApp) && now.getDate() <= 3 && summary.prevMonthRuns > 0) {
    out.push({
      key: `bilan:${today.slice(0, 7)}`, type: 'bilan',
      title: "🗓️ Ton bilan du mois est prêt",
      body: `${summary.prevMonthRuns} sortie${summary.prevMonthRuns > 1 ? 's' : ''} le mois dernier : viens voir ton récap.`,
    });
  }

  // 4. Inactivité
  if ((p.inactivity || opts.inApp) && summary.runsCount > 0 && daysSince != null && daysSince >= p.inactivityDays) {
    const nudge = COACH_NUDGES[coachParse(today).getDate() % COACH_NUDGES.length];
    out.push({
      key: `inactivity:${today}`, type: 'inactivity',
      title: `👟 Ça fait ${daysSince} jours sans courir`,
      body: nudge,
    });
  }

  // 5. Sauvegarde
  if ((p.backup || opts.inApp) && summary.runsCount >= 5) {
    const since = summary.lastExport ? coachDaysBetween(summary.lastExport, today) : 999;
    if (since >= 30) {
      out.push({
        key: `backup:${coachWeekKey(today)}`, type: 'backup',
        title: "💾 Pense à sauvegarder tes courses",
        body: "Tes données ne sont stockées que sur cet appareil : un export JSON prend 2 secondes.",
      });
    }
  }
  return out;
}

// Filtre selon l'historique d'envoi : max 2 notifications par jour, jamais deux fois la même.
function pickCoachNotifications(messages, log, now) {
  const today = coachDateStr(now);
  const sentToday = Object.values(log || {}).filter(d => d === today).length;
  const budget = Math.max(0, 2 - sentToday);
  return messages.filter(m => !(log && log[m.key])).slice(0, Math.min(1, budget));
}
