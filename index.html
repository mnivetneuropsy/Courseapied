let STATE = null;

/* ---------------- Dates (toujours en heure locale) ---------------- */

function pad2(n) { return String(n).padStart(2, '0'); }
function localDateStr(d) { return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }
function parseLocalDate(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function todayStr() { return localDateStr(new Date()); }
function addDays(s, n) { const d = parseLocalDate(s); d.setDate(d.getDate() + n); return localDateStr(d); }
function daysBetween(a, b) { return Math.round((parseLocalDate(b) - parseLocalDate(a)) / 86400000); }
function timeToMin(t) { if (!t) return null; const [h, m] = t.split(':').map(Number); return h * 60 + (m || 0); }

function isoWeekInfo(dateStr) {
  const t = parseLocalDate(dateStr);
  const dayNr = (t.getDay() + 6) % 7;
  t.setDate(t.getDate() - dayNr + 3);
  const firstThursday = new Date(t.getFullYear(), 0, 4);
  const week = 1 + Math.round(((t - firstThursday) / 86400000 - 3 + ((firstThursday.getDay() + 6) % 7)) / 7);
  return { year: t.getFullYear(), week };
}
function weekKeyOf(dateStr) { const w = isoWeekInfo(dateStr); return `${w.year}-W${w.week}`; }
function mondayOf(dateStr) { const d = parseLocalDate(dateStr); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return localDateStr(d); }

/* ---------------- Astronomie simplifiée ---------------- */

// Équinoxes / solstices (Meeus, valeurs moyennes — précis à quelques heures près)
function seasonDate(year, which) {
  const Y = (year - 2000) / 1000;
  const f = {
    march_equinox: 2451623.80984 + 365242.37404 * Y + 0.05169 * Y * Y - 0.00411 * Y ** 3 - 0.00057 * Y ** 4,
    june_solstice: 2451716.56767 + 365241.62603 * Y + 0.00325 * Y * Y + 0.00888 * Y ** 3 - 0.00030 * Y ** 4,
    september_equinox: 2451810.21715 + 365242.01767 * Y - 0.11575 * Y * Y + 0.00337 * Y ** 3 + 0.00078 * Y ** 4,
    december_solstice: 2451900.05952 + 365242.74049 * Y - 0.06223 * Y * Y - 0.00823 * Y ** 3 + 0.00032 * Y ** 4,
  }[which];
  if (f == null) return null;
  return localDateStr(new Date((f - 2440587.5) * 86400000));
}

// Lever / coucher du soleil (minutes depuis minuit, heure locale) — centre de la France par défaut
const SUN_LAT = 46.6, SUN_LON = 2.4;
function sunTimes(dateStr) {
  const d = parseLocalDate(dateStr);
  const rad = Math.PI / 180;
  const doy = Math.round((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
  const g = 2 * Math.PI / 365 * (doy - 1);
  const eqt = 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g) - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));
  const decl = 0.006918 - 0.399912 * Math.cos(g) + 0.070257 * Math.sin(g) - 0.006758 * Math.cos(2 * g) + 0.000907 * Math.sin(2 * g) - 0.002697 * Math.cos(3 * g) + 0.00148 * Math.sin(3 * g);
  const cosHa = Math.cos(90.833 * rad) / (Math.cos(SUN_LAT * rad) * Math.cos(decl)) - Math.tan(SUN_LAT * rad) * Math.tan(decl);
  const ha = Math.acos(Math.max(-1, Math.min(1, cosHa))) / rad;
  const offset = -new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12).getTimezoneOffset();
  return { sunrise: 720 - 4 * (SUN_LON + ha) - eqt + offset, sunset: 720 - 4 * (SUN_LON - ha) - eqt + offset };
}

function runOverlaps(run, centerMin, margin) {
  const s = timeToMin(run.time);
  if (s == null || !run.durationMin) return false;
  const e = s + run.durationMin;
  return s <= centerMin + margin && e >= centerMin - margin;
}

function matchesSpecialDate(spec, dateStr) {
  if (!spec) return false;
  if (spec === 'configurable') return !!(STATE.settings.birthday && dateStr.slice(5) === STATE.settings.birthday);
  if (spec.startsWith('auto:')) return seasonDate(Number(dateStr.slice(0, 4)), spec.slice(5)) === dateStr;
  return dateStr.slice(5) === spec;
}

/* ---------------- Normalisation ---------------- */

function normText(s) { return (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().toLowerCase(); }

function countryList() { return STATE.badges.filter(b => b.collection === 'pays').map(b => b.country); }
function departmentList() { return STATE.badges.filter(b => b.collection === 'departements').map(b => ({ code: b.deptCode, name: b.name })); }

function normalizeCountry(c) {
  if (!c) return '';
  const hit = countryList().find(x => normText(x) === normText(c));
  return hit || c.trim();
}
function normalizeDept(d) {
  if (!d) return '';
  let s = String(d).trim().toUpperCase();
  if (/^\d$/.test(s)) s = '0' + s;
  if (/^\d{5}$/.test(s)) s = s.startsWith('97') ? s.slice(0, 3) : s.slice(0, 2); // code postal
  if (s === '20') s = '';
  return s;
}
const OLD_WEATHER = { rain: 'pluie_fine', heavy_rain: 'deluge', wind: 'vent_face', heat: 'canicule', cold: 'grand_froid', snow: 'neige', fog: 'brouillard' };
function normalizeWeather(w) {
  const arr = Array.isArray(w) ? w : (w ? [w] : []);
  return [...new Set(arr.map(x => OLD_WEATHER[x] || x).filter(x => x && !['special', 'sunrise', 'sunset'].includes(x)))];
}
function isFrance(run) { return normText(run.country) === 'france'; }
function cleanCommune(c) { return String(c || '').trim().replace(/\s+/g, ' ').slice(0, 60); }
function communeKey(name, dept) { return normText(name).replace(/[-']/g, ' ').replace(/\s+/g, ' ') + '|' + (dept || ''); }
const PLACE_KEYS = PLACE_TYPES.map(p => p[0]);
const FEELINGS = [[1, '😌', 'Facile'], [2, '🙂', 'Bien'], [3, '😐', 'Correct'], [4, '😣', 'Dur'], [5, '🥵', 'Très dur']];
const MOODS = [['top', '😃', 'Au top'], ['bien', '😊', 'Content'], ['bof', '😐', 'Bof'], ['bas', '😔', 'Pas terrible']];
const MOOD_KEYS = MOODS.map(m => m[0]);

function normalizeRun(r) {
  r.country = normalizeCountry(r.country || 'France');
  r.department = isFrance(r) ? normalizeDept(r.department) : '';
  r.weather = normalizeWeather(r.weather);
  const seenC = new Set();
  r.communes = (Array.isArray(r.communes) ? r.communes : (r.commune ? [r.commune] : [])).map(cleanCommune)
    .filter(c => c && !seenC.has(normText(c)) && seenC.add(normText(c))).slice(0, 3);
  delete r.commune;
  r.places = [...new Set((r.places || []).filter(p => PLACE_KEYS.includes(p)))].slice(0, 2);
  r.feeling = [1, 2, 3, 4, 5].includes(Number(r.feeling)) ? Number(r.feeling) : null;
  r.mood = MOOD_KEYS.includes(r.mood) ? r.mood : '';
  r.distanceKm = Number(r.distanceKm) || 0;
  r.durationMin = Number(r.durationMin) || 0;
  r.elevationGain = Number(r.elevationGain) || 0;
  r.officialRace = !!r.officialRace;
  if (!r.officialRace) r.officialRaceType = '';
  r.paceMinPerKm = calculatePace(r.distanceKm, r.durationMin);
  r.speedKmH = calculateSpeed(r.distanceKm, r.durationMin);
  return r;
}

/* ---------------- Stockage ---------------- */

function freshBadges() { return JSON.parse(JSON.stringify(BADGES)); }
function freshChallenges() { return JSON.parse(JSON.stringify(CHALLENGES)); }

function saveData() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); return true; }
  catch (e) { console.error('Sauvegarde impossible', e); return false; }
}

function loadData() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); } catch (e) { saved = null; }
  STATE = buildState(saved);
  return STATE;
}

function buildState(saved) {
  saved = saved || {};
  const settings = Object.assign(DEFAULT_SETTINGS(), saved.settings || {});
  settings.notifications = Object.assign(DEFAULT_SETTINGS().notifications, (saved.settings || {}).notifications || {});
  const st = {
    version: APP_VERSION,
    runs: (saved.runs || []).map(r => Object.assign({}, r)),
    badges: freshBadges(),
    weeklyBadges: [],
    monthlyBadges: [],
    challenges: freshChallenges(),
    activeChallengeId: saved.activeChallengeId || null,
    settings,
  };
  // Migration : anciennes courses sans défi attribué → défi actif de l'époque
  const hadModel = (saved.runs || []).some(r => 'challengeId' in r);
  st.runs.forEach(r => {
    if (!r.id) r.id = 'run_' + Math.random().toString(36).slice(2);
    if (!('challengeId' in r)) r.challengeId = (!hadModel && saved.activeChallengeId) ? saved.activeChallengeId : null;
  });
  STATE = st;
  st.runs.forEach(normalizeRun);
  return st;
}

function exportData() {
  STATE.settings.lastExport = todayStr();
  saveData();
  const payload = { app: 'RunQuest', version: APP_VERSION, exportedAt: new Date().toISOString(),
    runs: STATE.runs, activeChallengeId: STATE.activeChallengeId, settings: STATE.settings };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `runquest-sauvegarde-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function importDataFromText(text) {
  const parsed = JSON.parse(text);
  if (!parsed || !Array.isArray(parsed.runs)) throw new Error('Format invalide');
  STATE = buildState(parsed);
  STATE.settings.birthdayAsked = true;
  recalculateEverything();
  saveData();
}

/* ---------------- Calculs de base ---------------- */

function calculatePace(distanceKm, durationMin) { return distanceKm > 0 && durationMin > 0 ? durationMin / distanceKm : null; }
function calculateSpeed(distanceKm, durationMin) { return durationMin > 0 ? distanceKm / durationMin * 60 : null; }
function paceStringToMinutes(str) { const [m, s] = String(str).split(':').map(Number); return m + (s || 0) / 60; }
function runSortKey(r) { return `${r.date}T${r.time || '00:00'}`; }
function sortedRuns() { return STATE.runs.slice().sort((a, b) => runSortKey(a).localeCompare(runSortKey(b))); }
function restDaysSetting() { return STATE.settings.streakMode === 'flexible' ? Math.max(1, Math.min(3, STATE.settings.restDays || 1)) : 0; }

/* ---------------- Accumulateur (rejoué course par course) ---------------- */

function newAcc() {
  return { count: 0, totalKm: 0, longestRun: 0, bestPace: null, biggestElevation: 0, officialCount: 0,
    streak: { start: null, prev: null, longest: 0 }, weekKm: {}, monthKm: {},
    early: 0, lunch: 0, weekdays: new Set(), firstDate: null, communes: new Set(), places: {},
    seasonCounts: {}, adventDays: {}, janRuns: {},
    prior: [], ghostWins: 0, ghostStreak: 0, ghostBestStreak: 0, easy: 0 };
}

// Fantôme : la meilleure (ou la dernière) sortie antérieure « jumelle »
// = distance à ±5 % et même commune de départ si elle est renseignée.
function findGhost(run, prior, mode) {
  if (run.distanceKm < 1 || !run.paceMinPerKm) return null;
  const c = run.communes[0] ? communeKey(run.communes[0], run.department) : null;
  const tol = Math.max(0.3, run.distanceKm * 0.05);
  const cands = prior.filter(p => p.paceMinPerKm && Math.abs(p.distanceKm - run.distanceKm) <= tol &&
    (!c || (p.communes[0] && communeKey(p.communes[0], p.department) === c)));
  if (!cands.length) return null;
  const g = mode === 'last' ? cands[cands.length - 1] : cands.reduce((a, b) => (b.paceMinPerKm < a.paceMinPerKm ? b : a));
  const deltaSec = Math.round((g.paceMinPerKm - run.paceMinPerKm) * run.distanceKm * 60);
  return { runId: g.id, date: g.date, pace: g.paceMinPerKm, distanceKm: g.distanceKm, win: deltaSec > 0, deltaSec,
    commune: c ? run.communes[0] : '', mode };
}

function accAdd(acc, r, restDays) {
  r.ghost = findGhost(r, acc.prior, STATE.settings.ghostMode);
  acc.prior.push(r);
  if (r.ghost) {
    if (r.ghost.win) { acc.ghostWins++; acc.ghostStreak++; acc.ghostBestStreak = Math.max(acc.ghostBestStreak, acc.ghostStreak); }
    else acc.ghostStreak = 0;
  }
  if (r.feeling && r.feeling <= 2) acc.easy++;
  acc.count++;
  acc.totalKm += r.distanceKm;
  acc.longestRun = Math.max(acc.longestRun, r.distanceKm);
  acc.biggestElevation = Math.max(acc.biggestElevation, r.elevationGain);
  if (r.distanceKm >= 1 && r.paceMinPerKm && (acc.bestPace == null || r.paceMinPerKm < acc.bestPace)) acc.bestPace = r.paceMinPerKm;
  if (r.officialRace) acc.officialCount++;
  const s = acc.streak;
  if (s.prev !== r.date) {
    if (s.prev == null || daysBetween(s.prev, r.date) - 1 > restDays) s.start = r.date;
    s.prev = r.date;
    s.longest = Math.max(s.longest, daysBetween(s.start, r.date) + 1);
  }
  const wk = weekKeyOf(r.date);
  acc.weekKm[wk] = (acc.weekKm[wk] || 0) + r.distanceKm;
  const mk = r.date.slice(0, 7);
  acc.monthKm[mk] = (acc.monthKm[mk] || 0) + r.distanceKm;
  const t = timeToMin(r.time);
  if (t != null && t < 7 * 60) acc.early++;
  if (t != null && t >= 12 * 60 && t < 14 * 60) acc.lunch++;
  acc.weekdays.add(parseLocalDate(r.date).getDay());
  if (!acc.firstDate) acc.firstDate = r.date;
  r.communes.forEach(c => acc.communes.add(communeKey(c, r.department)));
  r.places.forEach(p => { acc.places[p] = (acc.places[p] || 0) + 1; });
  const sk = seasonOf(r.date).key;
  acc.seasonCounts[sk] = (acc.seasonCounts[sk] || 0) + 1;
  const y = r.date.slice(0, 4), md = r.date.slice(5);
  if (md >= '12-01' && md <= '12-24') (acc.adventDays[y] = acc.adventDays[y] || new Set()).add(r.date);
  if (md.startsWith('01-')) acc.janRuns[y] = (acc.janRuns[y] || 0) + 1;
}

/* ---------------- Saisons (astronomiques) ---------------- */
const SEASON_CACHE = {};
function seasonBounds(y) {
  if (!SEASON_CACHE[y]) SEASON_CACHE[y] = ['march_equinox', 'june_solstice', 'september_equinox', 'december_solstice'].map(k => seasonDate(y, k));
  return SEASON_CACHE[y];
}
function seasonOf(dateStr) {
  const y = Number(dateStr.slice(0, 4));
  const [mar, jun, sep, dec] = seasonBounds(y);
  if (dateStr < mar) return { season: 'hiver', key: `hiver-${y - 1}` };
  if (dateStr < jun) return { season: 'printemps', key: `printemps-${y}` };
  if (dateStr < sep) return { season: 'ete', key: `ete-${y}` };
  if (dateStr < dec) return { season: 'automne', key: `automne-${y}` };
  return { season: 'hiver', key: `hiver-${y}` };
}
function bestSeasonCount(acc, season) {
  return Math.max(0, ...Object.entries(acc.seasonCounts).filter(([k]) => k.startsWith(season + '-')).map(([, v]) => v));
}
function currentSeasonCount(season) {
  const s = seasonOf(todayStr());
  return s.season === season ? (LAST_ACC.seasonCounts[s.key] || 0) : null;
}

/* ---------------- Règles de badges (data-driven) ----------------
   unlockedBy(badge, run, acc) : vrai si CETTE course (avec l'historique
   jusqu'à elle) débloque le badge → la date retenue est celle de la course.
   progress(badge, acc) : { value, target, unit } pour l'affichage.            */

const OFFICIAL_RULES = {
  official_first: (r, a) => a.officialCount >= 1,
  official_first_5k: r => r.officialRace && r.distanceKm >= 4.85,
  official_first_10k: r => r.officialRace && r.distanceKm >= 9.7,
  official_first_half: r => r.officialRace && r.distanceKm >= 20.5,
  official_first_nature: r => r.officialRace && r.officialRaceType === 'nature',
  official_first_trail: r => r.officialRace && r.officialRaceType === 'trail',
  official_first_night: r => r.officialRace && r.officialRaceType === 'nocturne',
  official_first_charity: r => r.officialRace && r.officialRaceType === 'caritative',
  official_first_abroad: r => r.officialRace && !!r.country && !isFrance(r),
  official_10: (r, a) => a.officialCount >= 10,
  official_25: (r, a) => a.officialCount >= 25,
  official_50: (r, a) => a.officialCount >= 50,
  official_100: (r, a) => a.officialCount >= 100,
};
const OFFICIAL_COUNT_TARGET = { official_10: 10, official_25: 25, official_50: 50, official_100: 100 };

const TIME_RULES = {
  time_sunrise: r => runOverlaps(r, sunTimes(r.date).sunrise, 20),
  time_sunset: r => runOverlaps(r, sunTimes(r.date).sunset, 20),
  time_midnight_runner: r => { const s = timeToMin(r.time); return s != null && s + r.durationMin > 1440; },
  time_night_owl: r => { const s = timeToMin(r.time); return s != null && s >= 0 && s + r.durationMin <= 300; },
};

const FUN_RULES = {
  fun_pile_poil: r => r.distanceKm >= 1 && Math.abs(r.distanceKm - Math.round(r.distanceKm)) < 0.005,
  fun_leve_tot: (r, a) => a.early >= 10,
  fun_pause_dej: (r, a) => a.lunch >= 10,
  fun_7_jours: (r, a) => a.weekdays.size >= 7,
  fun_un_an: (r, a) => !!a.firstDate && daysBetween(a.firstDate, r.date) >= 365,
  fun_tranquille: (r, a) => a.easy >= 10,
};
const FUN_PROGRESS = {
  fun_leve_tot: a => ({ value: a.early, target: 10, unit: 'sorties', label: 'Sorties avant 7 h' }),
  fun_pause_dej: a => ({ value: a.lunch, target: 10, unit: 'sorties', label: 'Sorties entre 12 h et 14 h' }),
  fun_7_jours: a => ({ value: a.weekdays.size, target: 7, unit: 'jours', label: 'Jours de la semaine couverts' }),
  fun_tranquille: a => ({ value: a.easy, target: 10, unit: 'sorties', label: 'Sorties ressenties faciles' }),
  fun_un_an: a => a.firstDate ? ({ value: Math.max(0, daysBetween(a.firstDate, todayStr())), target: 365, unit: 'jours', label: 'Jours depuis ta 1re course' }) : null,
};

const BADGE_RULES = {
  distance_unique: {
    unlockedBy: (b, r) => r.distanceKm >= b.target,
    progress: (b, a) => ({ value: a.longestRun, target: b.target, unit: 'km', label: 'Record sur une sortie' }),
  },
  regularite: {
    unlockedBy: (b, r, a) => a.streak.longest >= b.target,
    progress: (b, a) => ({ value: currentStreak(), target: b.target, unit: 'jours', label: 'Série actuelle' }),
  },
  vitesse: {
    unlockedBy: (b, r) => r.distanceKm >= 1 && r.paceMinPerKm != null && r.paceMinPerKm <= paceStringToMinutes(b.target) + 1e-9,
    progress: (b, a) => ({ value: a.bestPace, target: paceStringToMinutes(b.target), unit: 'min/km', label: 'Meilleure allure', lowerIsBetter: true }),
  },
  denivele: {
    unlockedBy: (b, r) => r.elevationGain >= b.target,
    progress: (b, a) => ({ value: a.biggestElevation, target: b.target, unit: 'm', label: 'Record de D+' }),
  },
  departements: { unlockedBy: (b, r) => isFrance(r) && r.department === b.deptCode },
  pays: { unlockedBy: (b, r) => normText(r.country) === normText(b.country) },
  jours_particuliers: { unlockedBy: (b, r) => matchesSpecialDate(b.date, r.date) },
  horaires: {
    unlockedBy: (b, r) => b.date ? matchesSpecialDate(b.date, r.date) : !!(TIME_RULES[b.id] && TIME_RULES[b.id](r)),
  },
  meteo: { unlockedBy: (b, r) => r.weather.includes(b.id.replace('weather_', '')) },
  distance_cumulee: {
    unlockedBy: (b, r, a) => a.totalKm >= b.target,
    progress: (b, a) => ({ value: a.totalKm, target: b.target, unit: 'km', label: 'Distance totale' }),
  },
  courses_officielles: {
    unlockedBy: (b, r, a) => !!(OFFICIAL_RULES[b.id] && OFFICIAL_RULES[b.id](r, a)),
    progress: (b, a) => OFFICIAL_COUNT_TARGET[b.id] ? { value: a.officialCount, target: OFFICIAL_COUNT_TARGET[b.id], unit: 'courses', label: 'Courses officielles' } : null,
  },
  fun: {
    unlockedBy: (b, r, a) => !!(FUN_RULES[b.id] && FUN_RULES[b.id](r, a)),
    progress: (b, a) => FUN_PROGRESS[b.id] ? FUN_PROGRESS[b.id](a) : null,
  },
  fantome: {
    unlockedBy: (b, r, a) => {
      if (b.id.startsWith('ghost_win_')) return a.ghostWins >= b.target;
      if (b.id === 'ghost_streak_3') return a.ghostBestStreak >= 3;
      if (b.id === 'ghost_year_month') {
        const mk = r.date.slice(0, 7), ly = `${Number(mk.slice(0, 4)) - 1}${mk.slice(4)}`;
        return (a.monthKm[ly] || 0) > 0 && a.monthKm[mk] > a.monthKm[ly];
      }
      return false;
    },
    progress: (b, a) => {
      if (b.id.startsWith('ghost_win_')) return { value: a.ghostWins, target: b.target, unit: 'victoires', label: 'Fantômes battus' };
      if (b.id === 'ghost_streak_3') return { value: a.ghostStreak, target: 3, unit: 'victoires', label: "Victoires d'affilée en cours" };
      return null;
    },
  },
  lieux: {
    unlockedBy: (b, r, a) => (a.places[b.place] || 0) >= b.target,
    progress: (b, a) => ({ value: a.places[b.place] || 0, target: b.target, unit: 'sorties', label: 'Passages enregistrés' }),
  },
  explorer: {
    unlockedBy: (b, r, a) => a.communes.size >= b.target,
    progress: (b, a) => ({ value: a.communes.size, target: b.target, unit: 'communes', label: 'Communes différentes' }),
  },
  saisons: {
    unlockedBy: (b, r, a) => {
      if (b.season) return bestSeasonCount(a, b.season) >= b.target;
      if (b.id === 'saison_quatre') return ['printemps', 'ete', 'automne', 'hiver'].every(s => (STATE.badges.find(x => x.id === 'saison_' + s) || {}).unlocked);
      if (b.id === 'cal_avent') return Math.max(0, ...Object.values(a.adventDays).map(x => x.size)) >= b.target;
      if (b.id === 'cal_janvier') return Math.max(0, ...Object.values(a.janRuns)) >= b.target;
      return false;
    },
    progress: (b, a) => {
      if (b.season) {
        const cur = currentSeasonCount(b.season);
        return cur != null ? { value: cur, target: b.target, unit: 'sorties', label: 'Cette saison' }
          : { value: bestSeasonCount(a, b.season), target: b.target, unit: 'sorties', label: 'Meilleure saison' };
      }
      if (b.id === 'saison_quatre') return { value: ['printemps', 'ete', 'automne', 'hiver'].filter(s => (STATE.badges.find(x => x.id === 'saison_' + s) || {}).unlocked).length, target: 4, unit: 'saisons', label: 'Saisons obtenues' };
      if (b.id === 'cal_avent') return { value: Math.max(0, ...Object.values(a.adventDays).map(x => x.size)), target: b.target, unit: 'jours', label: 'Meilleur Avent' };
      if (b.id === 'cal_janvier') return { value: Math.max(0, ...Object.values(a.janRuns)), target: b.target, unit: 'sorties', label: 'Meilleur mois de janvier' };
      return null;
    },
  },
};

/* ---------------- Badges hebdomadaires ---------------- */

function ensureWeeklyBadgesExist() {
  const needed = new Set([todayStr(), ...STATE.runs.map(r => r.date)].map(weekKeyOf));
  const existing = new Set(STATE.weeklyBadges.map(b => `${b.year}-W${b.week}`));
  needed.forEach(key => {
    if (existing.has(key)) return;
    const [y, w] = key.split('-W').map(Number);
    STATE.weeklyBadges.push(...makeWeeklyBadges(y, w));
    existing.add(key);
  });
  STATE.weeklyBadges.sort((a, b) => (b.year - a.year) || (b.week - a.week) || (a.level - b.level));
}

function ensureMonthlyBadgesExist() {
  const needed = new Set([todayStr(), ...STATE.runs.map(r => r.date)].map(d => d.slice(0, 7)));
  const existing = new Set(STATE.monthlyBadges.map(b => b.monthKey));
  needed.forEach(mk => {
    if (existing.has(mk)) return;
    const [y, m] = mk.split('-').map(Number);
    STATE.monthlyBadges.push(...makeMonthlyBadges(y, m));
  });
  STATE.monthlyBadges.sort((a, b) => b.monthKey.localeCompare(a.monthKey) || a.level - b.level);
}

/* ---------------- Recalcul complet ---------------- */

const CHECKPOINTS = [25, 50, 75, 100];
let LAST_ACC = newAcc();

function recalculateEverything() {
  STATE.runs.forEach(normalizeRun);
  STATE.weeklyBadges = [];
  ensureWeeklyBadgesExist();
  STATE.monthlyBadges = [];
  ensureMonthlyBadgesExist();
  STATE.badges.forEach(b => { b.unlocked = false; b.unlockedDate = null; b.unlockedRunId = null; });
  STATE.challenges.forEach(c => { c.currentKm = 0; c.checkpointsReached = []; c.checkpointDates = {}; c.completed = false; c.completedDate = null; });
  STATE.runs.forEach(r => { r.badgesEarned = []; });

  const restDays = restDaysSetting();
  const acc = newAcc();
  let locked = STATE.badges.slice();
  const weeklyByKey = {};
  STATE.weeklyBadges.forEach(b => { (weeklyByKey[`${b.year}-W${b.week}`] = weeklyByKey[`${b.year}-W${b.week}`] || []).push(b); });
  const monthlyByKey = {};
  STATE.monthlyBadges.forEach(b => { (monthlyByKey[b.monthKey] = monthlyByKey[b.monthKey] || []).push(b); });
  const challengeById = {};
  STATE.challenges.forEach(c => { challengeById[c.id] = c; });

  sortedRuns().forEach(run => {
    accAdd(acc, run, restDays);
    locked = locked.filter(b => {
      const rule = BADGE_RULES[b.collection];
      if (rule && rule.unlockedBy(b, run, acc)) {
        b.unlocked = true; b.unlockedDate = run.date; b.unlockedRunId = run.id;
        run.badgesEarned.push(b.id);
        return false;
      }
      return true;
    });
    const wk = weekKeyOf(run.date);
    (weeklyByKey[wk] || []).forEach(b => {
      if (!b.unlocked && acc.weekKm[wk] >= b.target - 1e-9) {
        b.unlocked = true; b.unlockedDate = run.date; b.unlockedRunId = run.id;
        run.badgesEarned.push(b.id);
      }
    });
    const mk = run.date.slice(0, 7);
    (monthlyByKey[mk] || []).forEach(b => {
      const ok = b.kind === 'single' ? run.distanceKm >= b.target - 1e-9 : acc.monthKm[mk] >= b.target - 1e-9;
      if (!b.unlocked && ok) {
        b.unlocked = true; b.unlockedDate = run.date; b.unlockedRunId = run.id;
        run.badgesEarned.push(b.id);
      }
    });
    const ch = run.challengeId && challengeById[run.challengeId];
    if (ch && !ch.completed) {
      ch.currentKm = Math.min(ch.targetKm, ch.currentKm + run.distanceKm);
      CHECKPOINTS.forEach(cp => {
        if (!ch.checkpointsReached.includes(cp) && ch.currentKm >= ch.targetKm * cp / 100 - 1e-9) {
          ch.checkpointsReached.push(cp); ch.checkpointDates[cp] = run.date;
        }
      });
      if (ch.currentKm >= ch.targetKm - 1e-9) {
        ch.completed = true; ch.completedDate = run.date;
        run.badgesEarned.push(ch.id);
      }
    }
  });
  LAST_ACC = acc;
  return acc;
}

/* ---------------- Statistiques ---------------- */

function currentStreak() {
  const days = [...new Set(STATE.runs.map(r => r.date))].sort();
  if (!days.length) return 0;
  const rest = restDaysSetting();
  let start = days[0], prev = days[0];
  for (let i = 1; i < days.length; i++) {
    if (daysBetween(prev, days[i]) - 1 > rest) start = days[i];
    prev = days[i];
  }
  return daysBetween(prev, todayStr()) <= rest + 1 ? daysBetween(start, prev) + 1 : 0;
}

function weeklyGoalStreak() {
  const goal = STATE.settings.weeklyGoalRuns || 3;
  const counts = {};
  STATE.runs.forEach(r => { const k = weekKeyOf(r.date); counts[k] = (counts[k] || 0) + 1; });
  let n = 0;
  let cursor = todayStr();
  if ((counts[weekKeyOf(cursor)] || 0) < goal) cursor = addDays(cursor, -7);
  while ((counts[weekKeyOf(cursor)] || 0) >= goal) { n++; cursor = addDays(cursor, -7); }
  return n;
}

function kmForWeek(key) { return STATE.runs.filter(r => weekKeyOf(r.date) === key).reduce((s, r) => s + r.distanceKm, 0); }

function calculateStats() {
  const runs = STATE.runs;
  const today = todayStr();
  const wk = weekKeyOf(today);
  const month = today.slice(0, 7), year = today.slice(0, 4);
  const st = { totalKm: 0, totalDuration: 0, totalElevation: 0, kmWeek: 0, kmMonth: 0, kmYear: 0, runsWeek: 0,
    totalRuns: runs.length, longestRun: 0, bestPace: null, biggestElevation: 0 };
  const depts = new Set(), countries = new Set();
  let official = 0;
  runs.forEach(r => {
    st.totalKm += r.distanceKm; st.totalDuration += r.durationMin; st.totalElevation += r.elevationGain;
    st.longestRun = Math.max(st.longestRun, r.distanceKm);
    st.biggestElevation = Math.max(st.biggestElevation, r.elevationGain);
    if (r.distanceKm >= 1 && r.paceMinPerKm && (st.bestPace == null || r.paceMinPerKm < st.bestPace)) st.bestPace = r.paceMinPerKm;
    if (r.department) depts.add(r.department);
    if (r.country) countries.add(normText(r.country));
    if (r.officialRace) official++;
    if (weekKeyOf(r.date) === wk) { st.kmWeek += r.distanceKm; st.runsWeek++; }
    if (r.date.startsWith(month)) st.kmMonth += r.distanceKm;
    if (r.date.startsWith(year)) st.kmYear += r.distanceKm;
  });
  st.avgPace = calculatePace(st.totalKm, st.totalDuration);
  st.departmentsVisited = [...depts];
  st.countriesVisited = [...countries];
  st.officialCount = official;
  st.communesCount = LAST_ACC.communes.size;
  const mBadges = currentMonthBadges();
  st.monthBadgesUnlocked = mBadges.filter(b => b.unlocked).length;
  st.currentStreak = currentStreak();
  st.longestStreak = LAST_ACC.streak.longest;
  st.weeklyGoalStreak = weeklyGoalStreak();
  const sr = sortedRuns();
  st.lastRun = sr.length ? sr[sr.length - 1] : null;
  return st;
}

/* ---------------- Progression / prochains objectifs ---------------- */

function badgeProgress(badge) {
  if (badge.collection === 'hebdomadaire') {
    return { value: kmForWeek(`${badge.year}-W${badge.week}`), target: badge.target, unit: 'km', label: 'Km cette semaine-là' };
  }
  if (badge.collection === 'mensuel') {
    if (badge.kind === 'single') {
      const best = Math.max(0, ...STATE.runs.filter(r => r.date.startsWith(badge.monthKey)).map(r => r.distanceKm));
      return { value: best, target: badge.target, unit: 'km', label: 'Plus longue sortie du mois' };
    }
    return { value: STATE.runs.filter(r => r.date.startsWith(badge.monthKey)).reduce((s, r) => s + r.distanceKm, 0), target: badge.target, unit: 'km', label: 'Km du mois' };
  }
  if (badge.collection === 'defis') {
    const c = STATE.challenges.find(x => x.id === badge.id);
    return c ? { value: c.currentKm, target: c.targetKm, unit: 'km', label: 'Progression du défi' } : null;
  }
  const rule = BADGE_RULES[badge.collection];
  return rule && rule.progress ? rule.progress(badge, LAST_ACC) : null;
}

function progressRatio(p) {
  if (!p || p.value == null || !p.target) return 0;
  if (p.lowerIsBetter) return p.value <= p.target ? 1 : p.target / p.value;
  return p.value / p.target;
}

function currentWeekBadges() {
  const { year, week } = isoWeekInfo(todayStr());
  return STATE.weeklyBadges.filter(b => b.year === year && b.week === week).sort((a, b) => a.level - b.level);
}

function currentMonthBadges() {
  const mk = todayStr().slice(0, 7);
  return STATE.monthlyBadges.filter(b => b.monthKey === mk).sort((a, b) => a.level - b.level);
}

function nextWeeklyBadge() {
  const list = currentWeekBadges();
  const next = list.find(b => !b.unlocked);
  if (!next) return null;
  const km = kmForWeek(weekKeyOf(todayStr()));
  return { badge: next, km, remaining: Math.max(0, next.target - km), pct: Math.min(100, km / next.target * 100), unlockedCount: list.filter(b => b.unlocked).length };
}

// Les badges les plus proches d'être débloqués, toutes catégories confondues
function nearestBadges(limit) {
  const out = [];
  const seenCollections = new Set();
  const candidates = STATE.badges.filter(b => !b.unlocked && BADGE_RULES[b.collection] && BADGE_RULES[b.collection].progress)
    .sort((a, b) => (Number(a.target) || 0) - (Number(b.target) || 0));
  candidates.forEach(b => {
    const gkey = b.collection + (OFFICIAL_COUNT_TARGET[b.id] ? 'c' : '') + (b.place || '') + (b.collection === 'fun' || b.collection === 'saisons' ? b.id : '');
    if (seenCollections.has(gkey)) return;
    const p = badgeProgress(b);
    if (!p || p.value == null) return;
    const ratio = progressRatio(p);
    if (ratio <= 0 || ratio >= 1) return;
    seenCollections.add(gkey);
    out.push({ badge: b, progress: p, ratio, hint: progressHint(b, p) });
  });
  const nextVol = currentMonthBadges().find(b => b.kind === 'volume' && !b.unlocked);
  if (nextVol) {
    const p = badgeProgress(nextVol);
    if (p.value > 0) out.push({ badge: nextVol, progress: p, ratio: p.value / p.target, hint: `Plus que ${fmtNum(p.target - p.value)} km ce mois-ci` });
  }
  const ch = activeChallenge();
  if (ch && !ch.completed) {
    const next = CHECKPOINTS.find(cp => !ch.checkpointsReached.includes(cp));
    if (next) {
      const targetKm = ch.targetKm * next / 100;
      out.push({ badge: { id: ch.id, name: `${ch.name} — ${next} %`, collection: 'defis' },
        progress: { value: ch.currentKm, target: targetKm, unit: 'km' }, ratio: ch.currentKm / targetKm,
        hint: `Plus que ${fmtNum(targetKm - ch.currentKm)} km` });
    }
  }
  return out.sort((a, b) => b.ratio - a.ratio).slice(0, limit);
}

function progressHint(b, p) {
  switch (b.collection) {
    case 'distance_unique': return `Une sortie de ${fmtNum(b.target)} km (record : ${fmtNum(p.value)} km)`;
    case 'denivele': return `Une sortie avec ${b.target} m de D+ (record : ${Math.round(p.value)} m)`;
    case 'vitesse': return `Allure ≤ ${b.target} /km sur 1 km ou plus (record : ${paceToString(p.value)})`;
    case 'distance_cumulee': return `Plus que ${fmtNum(p.target - p.value)} km au total`;
    case 'regularite': return `Plus que ${p.target - p.value} jours de série`;
    case 'courses_officielles': return `Plus que ${p.target - p.value} course(s) officielle(s)`;
    case 'explorer': return `Plus que ${p.target - p.value} commune(s) nouvelle(s)`;
    case 'lieux': return `Encore ${p.target - p.value} passage(s)`;
    case 'fun': return b.id === 'fun_un_an' ? `Encore ${p.target - p.value} jours` : `Encore ${p.target - p.value} ${p.unit}`;
    case 'saisons': return `Encore ${p.target - p.value} ${p.unit}`;
    case 'fantome': return `Encore ${p.target - p.value} victoire(s) contre ton fantôme`;
    default: return '';
  }
}

/* ---------------- Fantôme du calendrier ---------------- */

function kmBetween(from, to) { return STATE.runs.filter(r => r.date >= from && r.date <= to).reduce((s, r) => s + r.distanceKm, 0); }

function calendarGhost() {
  const today = todayStr();
  const ly = addDays(today, -364); // même jour de la semaine, un an plus tôt
  const d = parseLocalDate(today);
  const lyMonthStart = `${d.getFullYear() - 1}-${pad2(d.getMonth() + 1)}-01`;
  const lyMonthEnd = `${d.getFullYear() - 1}-${pad2(d.getMonth() + 1)}-${pad2(Math.min(d.getDate(), new Date(d.getFullYear() - 1, d.getMonth() + 1, 0).getDate()))}`;
  const lyMonthFull = kmBetween(lyMonthStart, `${d.getFullYear() - 1}-${pad2(d.getMonth() + 1)}-31`);
  const first = sortedRuns()[0];
  if (!first || first.date > lyMonthEnd) return null;
  return {
    week: { me: kmBetween(mondayOf(today), today), ghost: kmBetween(mondayOf(ly), ly) },
    month: { me: kmBetween(today.slice(0, 8) + '01', today), ghost: kmBetween(lyMonthStart, lyMonthEnd), ghostFull: lyMonthFull },
    year: { me: kmBetween(today.slice(0, 4) + '-01-01', today), ghost: kmBetween(`${d.getFullYear() - 1}-01-01`, addDays(today, -365)) },
  };
}

/* ---------------- Sensations ---------------- */

function feelingInsights() {
  const rated = STATE.runs.filter(r => r.feeling);
  if (rated.length < 3) return null;
  const avg = list => list.reduce((s, r) => s + r.feeling, 0) / list.length;
  const slots = [['matin', 'le matin', r => timeToMin(r.time) < 12 * 60], ['midi', 'le midi', r => timeToMin(r.time) >= 12 * 60 && timeToMin(r.time) < 14 * 60],
    ['soir', "l'après-midi et le soir", r => timeToMin(r.time) >= 14 * 60]];
  const bySlot = slots.map(([k, label, f]) => { const l = rated.filter(r => r.time && f(r)); return { k, label, n: l.length, avg: l.length ? avg(l) : null }; })
    .filter(x => x.n >= 3);
  const sorted = bySlot.slice().sort((a, b) => a.avg - b.avg);
  const best = sorted.length >= 2 && sorted[sorted.length - 1].avg - sorted[0].avg >= 0.4 ? sorted[0] : null;
  const recent = rated.slice().sort((a, b) => runSortKey(a).localeCompare(runSortKey(b))).slice(-5);
  return { count: rated.length, avg: avg(rated), bySlot, best, recentAvg: avg(recent),
    easyShare: rated.filter(r => r.feeling <= 2).length / rated.length };
}
function feelingLabel(v) { const f = FEELINGS[Math.min(4, Math.max(0, Math.round(v) - 1))]; return `${f[1]} ${f[2]}`; }

/* ---------------- Jauge de récupération ----------------
   Estimation (pas un avis médical) construite à partir de repères publiés :
   - charge d'une séance = durée × effort perçu (méthode « session RPE » de Foster),
     l'intensité étant pondérée au carré (proxy de type TSS : durée × RPE² / 10) ;
   - footing facile ≈ 12-24 h, séance dure ou sortie longue ≈ 48-72 h ;
   - course officielle : règle « 1 jour par mile couru » avant de recourir à fond ;
   - hausse brutale de charge (ratio aigu/chronique > 1,3) → récupération allongée ;
   - âge : environ +1 % par an au-delà de 25 ans.                                        */

const FEEL_TO_RPE = { 1: 3, 2: 4, 3: 5.5, 4: 7, 5: 8.5 };
function median(a) { const s = a.slice().sort((x, y) => x - y); const n = s.length; return n ? (n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2) : null; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function runEffort(run, prior) {
  let rpe, source;
  if (run.feeling) { rpe = FEEL_TO_RPE[run.feeling]; source = 'ta sensation'; }
  else {
    const ref = prior.filter(p => p.distanceKm >= 1 && p.paceMinPerKm).slice(-30);
    if (ref.length >= 5 && run.paceMinPerKm) {
      rpe = 4.5 + (median(ref.map(p => p.paceMinPerKm)) / run.paceMinPerKm - 1) * 25;
      if (run.distanceKm >= 1.5 * median(ref.map(p => p.distanceKm))) rpe += 1;
      source = 'ton allure habituelle';
    } else { rpe = 5; source = 'valeur par défaut'; }
  }
  if (run.officialRace) { rpe = Math.max(rpe, 8.5); source = 'course officielle'; }
  rpe = clamp(rpe, 2.5, 9);
  const effMin = run.durationMin * (1 + (run.elevationGain / 100) / Math.max(run.distanceKm, 1)); // 100 m D+ ≈ 1 km
  const load = effMin * rpe * rpe / 10;
  let hours = clamp(8 + 0.15 * load, 8, 72);
  let raceRule = false;
  if (run.officialRace && run.distanceKm / 1.609 * 24 > hours) { hours = run.distanceKm / 1.609 * 24; raceRule = true; }
  return { rpe, source, effMin, load, srpe: rpe * effMin, hours, raceRule };
}

function runEnd(run) {
  const d = parseLocalDate(run.date);
  const t = timeToMin(run.time);
  d.setMinutes((t == null ? 18 * 60 : t) + Math.round(run.durationMin));
  return d;
}

// Un créneau qui tombe la nuit est repoussé au lendemain matin (6 h)
function wakeUpTime(d) {
  const h = d.getHours();
  if (h >= 21) { const n = new Date(d); n.setDate(n.getDate() + 1); n.setHours(6, 0, 0, 0); return n; }
  if (h < 6) { const n = new Date(d); n.setHours(6, 0, 0, 0); return n; }
  return d;
}

function computeRecovery(now) {
  now = now || new Date();
  const runs = sortedRuns();
  if (!runs.length) return null;
  const today = localDateStr(now);
  const efforts = runs.map((r, i) => ({ run: r, end: runEnd(r), ...runEffort(r, runs.slice(0, i)) }));
  // ratio charge aiguë (7 j) / chronique (moyenne hebdo sur 28 j)
  const inWin = (e, days) => e.run.date > addDays(today, -days) && e.run.date <= today;
  const acute = efforts.filter(e => inWin(e, 7)).reduce((s, e) => s + e.srpe, 0);
  const chronic = efforts.filter(e => inWin(e, 28)).reduce((s, e) => s + e.srpe, 0) / 4;
  const enoughHistory = daysBetween(runs[0].date, today) >= 21;
  const acwr = enoughHistory && chronic > 0 ? acute / chronic : null;
  const spike = acwr != null && acwr > 1.5 ? 1.3 : acwr != null && acwr > 1.3 ? 1.15 : 1;
  const by = Number(STATE.settings.birthYear);
  const age = by > 1900 ? now.getFullYear() - by : null;
  const ageFactor = age ? 1 + Math.max(0, age - 25) * 0.01 : 1;

  let readyAt = null, easyAt = null, driver = null;
  const recent = efforts.filter(e => e.run.date >= addDays(today, -30));
  recent.forEach(e => {
    let hours = e.hours * ageFactor * (inWin(e, 7) ? spike : 1);
    if (readyAt && readyAt > e.end) hours += 0.5 * (readyAt - e.end) / 3600000; // fatigue qui s'empile
    if (!e.raceRule) hours = Math.min(hours, 96);
    e.totalHours = hours;
    e.readyAt = wakeUpTime(new Date(e.end.getTime() + hours * 3600000));
    e.easyAt = wakeUpTime(new Date(e.end.getTime() + Math.max(hours >= 36 ? 14 : 8, 0.25 * hours) * 3600000));
    if (!readyAt || e.readyAt > readyAt) { readyAt = e.readyAt; driver = e; }
    if (!easyAt || e.easyAt > easyAt) easyAt = e.easyAt;
  });
  if (!driver || now >= readyAt) {
    return { pct: 100, status: 'ready', readyAt, easyAt, driver, acwr, spike, age, ageFactor, recent };
  }
  const pct = clamp(Math.floor((now - driver.end) / (readyAt - driver.end) * 100), 0, 99);
  return { pct, status: now >= easyAt ? 'easy' : 'rest', readyAt, easyAt, driver, acwr, spike, age, ageFactor, recent };
}

/* ---------------- Bilan mensuel ---------------- */

function monthReport(mk) {
  const runs = sortedRuns().filter(r => r.date.startsWith(mk));
  const y = Number(mk.slice(0, 4)), m = Number(mk.slice(5));
  const prevMk = m === 1 ? `${y - 1}-12` : `${y}-${pad2(m - 1)}`;
  const lyMk = `${y - 1}-${pad2(m)}`;
  const sum = (list, f) => list.reduce((s, r) => s + f(r), 0);
  const km = sum(runs, r => r.distanceKm);
  const kmOf = k => sum(STATE.runs.filter(r => r.date.startsWith(k)), r => r.distanceKm);
  const firstSeen = {};
  sortedRuns().forEach(r => (r.communes || []).forEach(c => { const k = communeKey(c, r.department); if (!firstSeen[k]) firstSeen[k] = { date: r.date, name: c }; }));
  const allB = [...STATE.badges, ...STATE.weeklyBadges, ...STATE.monthlyBadges];
  const badges = allB.filter(b => b.unlocked && b.unlockedDate && b.unlockedDate.startsWith(mk));
  STATE.challenges.filter(c => c.completedDate && c.completedDate.startsWith(mk)).forEach(c => badges.push({ id: c.id, name: c.name, collection: 'defis', image: c.image }));
  const duels = runs.filter(r => r.ghost);
  const rated = runs.filter(r => r.feeling);
  const eligiblePace = runs.filter(r => r.distanceKm >= 1 && r.paceMinPerKm);
  return {
    mk, year: y, month: m, runs, count: runs.length, km,
    duration: sum(runs, r => r.durationMin), elevation: sum(runs, r => r.elevationGain),
    days: new Set(runs.map(r => r.date)),
    longest: runs.reduce((a, r) => (!a || r.distanceKm > a.distanceKm ? r : a), null),
    fastest: eligiblePace.reduce((a, r) => (!a || r.paceMinPerKm < a.paceMinPerKm ? r : a), null),
    avgPace: calculatePace(km, sum(runs, r => r.durationMin)),
    badges, newCommunes: Object.values(firstSeen).filter(x => x.date.startsWith(mk)).map(x => x.name),
    duels: duels.length, ghostWins: duels.filter(r => r.ghost.win).length,
    avgFeeling: rated.length ? sum(rated, r => r.feeling) / rated.length : null,
    prevKm: kmOf(prevMk), lyKm: kmOf(lyMk), hasLy: STATE.runs.some(r => r.date <= `${lyMk}-31`),
    monthly: STATE.monthlyBadges.filter(b => b.monthKey === mk),
  };
}
function monthsWithRuns() { return [...new Set(STATE.runs.map(r => r.date.slice(0, 7)))].sort(); }

/* ---------------- Défis ---------------- */

function activeChallenge() { return STATE.challenges.find(c => c.id === STATE.activeChallengeId) || null; }

function activateChallenge(id) { STATE.activeChallengeId = id; saveData(); }
function stopChallenge() { STATE.activeChallengeId = null; saveData(); }

/* ---------------- Modifications de l'historique ---------------- */

function snapshotProgress() {
  return {
    unlocked: new Set([...STATE.badges, ...STATE.weeklyBadges, ...STATE.monthlyBadges].filter(b => b.unlocked).map(b => b.id)),
    checkpoints: Object.fromEntries(STATE.challenges.map(c => [c.id, c.checkpointsReached.slice()])),
  };
}

// Applique une modification, recalcule tout, et renvoie ce qui vient d'être gagné
function commitRunChange(mutator) {
  const before = snapshotProgress();
  mutator();
  recalculateEverything();
  const newBadges = [...STATE.badges, ...STATE.weeklyBadges, ...STATE.monthlyBadges].filter(b => b.unlocked && !before.unlocked.has(b.id));
  const events = [];
  STATE.challenges.forEach(c => {
    const prev = before.checkpoints[c.id] || [];
    c.checkpointsReached.filter(cp => !prev.includes(cp)).sort((a, b) => a - b).forEach(cp => events.push({ challenge: c, checkpoint: cp }));
  });
  const ac = activeChallenge();
  const completed = ac && ac.completed && !(before.checkpoints[ac.id] || []).includes(100) ? ac : null;
  if (completed) STATE.activeChallengeId = null;
  saveData();
  return { newBadges, events, completed };
}

function addRun(runData) {
  const id = 'run_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
  const res = commitRunChange(() => {
    const ac = activeChallenge();
    STATE.runs.push(normalizeRun(Object.assign({ id, challengeId: ac && !ac.completed ? ac.id : null }, runData)));
  });
  res.run = STATE.runs.find(r => r.id === id);
  return res;
}

function addRuns(list, countInChallenge) {
  return commitRunChange(() => {
    const ac = activeChallenge();
    list.forEach((data, i) => {
      STATE.runs.push(normalizeRun(Object.assign({ id: `run_${Date.now()}_${i}`, challengeId: countInChallenge && ac && !ac.completed ? ac.id : null }, data)));
    });
  });
}

function updateRun(runId, updates) {
  const res = commitRunChange(() => {
    const r = STATE.runs.find(x => x.id === runId);
    if (r) Object.assign(r, updates);
  });
  res.run = STATE.runs.find(r => r.id === runId);
  return res;
}

function deleteRun(runId) {
  return commitRunChange(() => { STATE.runs = STATE.runs.filter(r => r.id !== runId); });
}

function findDuplicate(run) {
  return STATE.runs.find(r => r.date === run.date && Math.abs(r.distanceKm - run.distanceKm) < 0.05 &&
    (!r.time || !run.time || Math.abs(timeToMin(r.time) - timeToMin(run.time)) <= 2));
}

/* ---------------- Import TCX ---------------- */

function parseTCX(xmlString) {
  const xml = new DOMParser().parseFromString(xmlString, 'application/xml');
  if (xml.getElementsByTagName('parsererror').length) throw new Error('XML invalide');
  const activities = Array.from(xml.getElementsByTagName('Activity'));
  if (!activities.length) throw new Error('Aucune activité');
  return activities.map(act => {
    const laps = Array.from(act.getElementsByTagName('Lap'));
    let timeSec = 0, distM = 0;
    laps.forEach(lap => {
      const t = lap.getElementsByTagName('TotalTimeSeconds')[0];
      const d = lap.getElementsByTagName('DistanceMeters')[0];
      if (t) timeSec += parseFloat(t.textContent) || 0;
      if (d && d.parentNode === lap) distM += parseFloat(d.textContent) || 0;
    });
    const tps = Array.from(act.getElementsByTagName('Trackpoint'));
    let first = null, last = null, lastDist = 0, gain = 0, ref = null;
    tps.forEach(tp => {
      const te = tp.getElementsByTagName('Time')[0];
      if (te) { if (!first) first = te.textContent; last = te.textContent; }
      const de = tp.getElementsByTagName('DistanceMeters')[0];
      if (de) lastDist = Math.max(lastDist, parseFloat(de.textContent) || 0);
      const ae = tp.getElementsByTagName('AltitudeMeters')[0];
      if (ae) {
        const alt = parseFloat(ae.textContent);
        if (!isNaN(alt)) {
          // hystérésis de 3 m pour ignorer le bruit GPS
          if (ref == null) ref = alt;
          else if (alt - ref >= 3) { gain += alt - ref; ref = alt; }
          else if (alt < ref) ref = alt;
        }
      }
    });
    if (!first) { const idEl = act.getElementsByTagName('Id')[0]; first = idEl ? idEl.textContent : null; }
    if (!distM) distM = lastDist;
    if (!timeSec && first && last) timeSec = (new Date(last) - new Date(first)) / 1000;
    const start = first ? new Date(first) : null;
    return {
      date: start ? localDateStr(start) : todayStr(),
      time: start ? `${pad2(start.getHours())}:${pad2(start.getMinutes())}` : '',
      distanceKm: Math.round(distM / 10) / 100,
      durationMin: timeSec / 60,
      elevationGain: Math.round(gain),
      sport: act.getAttribute('Sport') || '',
    };
  }).filter(a => a.distanceKm > 0 && a.durationMin > 0);
}

/* ---------------- Résumé pour le coach (notifications) ---------------- */

function buildCoachSummary() {
  const stats = calculateStats();
  const nw = nextWeeklyBadge();
  const ac = activeChallenge();
  let challenge = null;
  if (ac && !ac.completed) {
    const cp = CHECKPOINTS.find(x => !ac.checkpointsReached.includes(x));
    challenge = { id: ac.id, name: ac.name, currentKm: ac.currentKm, targetKm: ac.targetKm,
      nextCheckpointPct: cp || null, nextCheckpointKm: cp ? ac.targetKm * cp / 100 : null };
  }
  return {
    generatedAt: new Date().toISOString(),
    prefs: STATE.settings.notifications,
    lastRunDate: stats.lastRun ? stats.lastRun.date : null,
    runsCount: stats.totalRuns,
    weekKey: weekKeyOf(todayStr()),
    kmWeek: stats.kmWeek,
    weeklyLevels: WEEKLY_LEVELS_KM,
    weeklyUnlockedCount: nw ? nw.unlockedCount : WEEKLY_LEVELS_KM.length,
    currentStreak: stats.currentStreak,
    restDays: restDaysSetting(),
    challenge,
    lastExport: STATE.settings.lastExport,
    recovery: (() => { const r = computeRecovery(); return r && r.driver ? { readyAt: r.readyAt.toISOString(), hours: r.driver.totalHours, runDate: r.driver.run.date } : null; })(),
    prevMonthRuns: (() => { const d = new Date(); const pm = new Date(d.getFullYear(), d.getMonth() - 1, 1); const k = `${pm.getFullYear()}-${pad2(pm.getMonth() + 1)}`;
      return STATE.runs.filter(r => r.date.startsWith(k)).length; })(),
  };
}

/* ---------------- Formatage ---------------- */

function fmtNum(n, dec) {
  if (n == null || isNaN(n)) return '—';
  const d = dec == null ? 1 : dec;
  const f = Math.pow(10, d);
  return (Math.round(n * f) / f).toLocaleString('fr-FR');
}
function paceToString(p) {
  if (p == null || !isFinite(p)) return '—';
  let m = Math.floor(p), s = Math.round((p - m) * 60);
  if (s === 60) { m++; s = 0; }
  return `${m}:${pad2(s)}`;
}
function formatDuration(minutes) {
  if (!minutes) return '—';
  const total = Math.round(minutes * 60);
  const h = Math.floor(total / 3600), m = Math.floor((total % 3600) / 60), s = total % 60;
  return h > 0 ? `${h} h ${pad2(m)}` : `${m} min ${pad2(s)}`;
}
function formatDate(s, opts) {
  if (!s) return '—';
  return parseLocalDate(s).toLocaleDateString('fr-FR', opts || { day: 'numeric', month: 'short', year: 'numeric' });
}
function escapeHtml(str) {
  return String(str == null ? '' : str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}

function hashSeed(str) { let h = 2166136261; for (const c of str) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function seededRandom(seed) { let s = seed; return () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; }; }

/* ---------------- Carte stylisée d'un défi ---------------- */

function routeSvg(ch) {
  const rnd = seededRandom(hashSeed(ch.id));
  const W = 320, H = 110, N = 26;
  const pts = [];
  const a1 = 10 + rnd() * 18, a2 = 6 + rnd() * 10, f1 = 1 + rnd() * 2, f2 = 3 + rnd() * 3, ph = rnd() * 6;
  for (let i = 0; i < N; i++) {
    const t = i / (N - 1);
    pts.push([14 + t * (W - 28), H / 2 + a1 * Math.sin(t * Math.PI * f1 + ph) + a2 * Math.sin(t * Math.PI * f2 + ph * 2) + (rnd() - 0.5) * 6]);
  }
  const lens = [0];
  for (let i = 1; i < N; i++) lens.push(lens[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  const total = lens[N - 1];
  const at = f => {
    const L = f * total;
    let i = 1; while (i < N - 1 && lens[i] < L) i++;
    const r = (L - lens[i - 1]) / ((lens[i] - lens[i - 1]) || 1);
    return [pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * r, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * r];
  };
  const d = 'M' + pts.map(p => p.map(v => v.toFixed(1)).join(' ')).join(' L');
  const pct = Math.min(100, ch.currentKm / ch.targetKm * 100);
  const flags = [25, 50, 75].map(cp => {
    const [x, y] = at(cp / 100); const on = ch.checkpointsReached.includes(cp);
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5" class="rt-cp ${on ? 'on' : ''}"/>`;
  }).join('');
  const [ex, ey] = at(1); const [rx, ry] = at(pct / 100);
  return `<svg class="route-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    <path d="${d}" class="rt-base"/>
    <path d="${d}" class="rt-done" pathLength="100" stroke-dasharray="${pct.toFixed(2)} 100"/>
    ${flags}
    <text x="${ex.toFixed(1)}" y="${(ey - 8).toFixed(1)}" class="rt-finish" text-anchor="middle">🏁</text>
    <circle cx="${rx.toFixed(1)}" cy="${ry.toFixed(1)}" r="7" class="rt-runner"/>
  </svg>`;
}

    <button class="fab-inline" data-go="ajouter">+ Ajouter une course</button>
  `;

  const on = (id, fn) => { const b = el.querySelector('#' + id); if (b) b.addEventListener('click', fn); };
  const rc = el.querySelector('#recovery-card');
  if (rc) rc.addEventListener('click', openRecoverySheet);
  on('bn-notif', () => enableNotifications());
  on('bn-notif-x', () => { s.dismissed.notifBanner = true; saveData(); renderCurrentScreen(); });
  on('bn-install', () => promptInstall());
  on('bn-bilan', () => { s.dismissed['bilan_' + prevMk] = true; saveData(); bilanMonth = prevMk; goToScreen('bilan'); });
  on('bn-bilan-x', () => { s.dismissed['bilan_' + prevMk] = true; saveData(); renderCurrentScreen(); });
  on('bn-install-x', () => { s.dismissed.installBanner = true; saveData(); renderCurrentScreen(); });
}

function fmtWhen(date) {
  const now = new Date();
  const h = (date - now) / 3600000;
  if (h <= 0) return 'maintenant';
  const morning = date.getHours() === 6 && date.getMinutes() === 0;
  const hh = morning ? 'matin' : `vers ${pad2(date.getHours())} h ${pad2(date.getMinutes())}`;
  const dayDiff = daysBetween(localDateStr(now), localDateStr(date));
  if (dayDiff === 0) return morning ? 'ce matin' : `aujourd'hui ${hh}`;
  if (dayDiff === 1) return `demain ${hh}`;
  if (dayDiff < 7) return `${date.toLocaleDateString('fr-FR', { weekday: 'long' })} ${hh}`;
  return `le ${date.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long' })}`;
}
function fmtHours(h) { return h < 48 ? `${Math.round(h)} h` : `${fmtNum(h / 24, 1)} jours`; }

const RECOVERY_STATES = {
  ready: { color: 'var(--moss)', title: 'Récupéré', icon: '✅', text: 'Prêt pour tout : séance intense, sortie longue ou course.' },
  easy: { color: 'var(--gold)', title: 'Footing facile OK', icon: '🟡', text: 'Une sortie tranquille, à allure de conversation, sans côtes ni accélérations.' },
  rest: { color: 'var(--danger)', title: 'Récupération en cours', icon: '🔴', text: 'Repos, marche ou étirements doux conseillés.' },
};

function recoveryRing(pct, color, size) {
  const r = 42, c = 2 * Math.PI * r;
  return `<svg class="rec-ring" viewBox="0 0 100 100" width="${size}" height="${size}" aria-hidden="true">
    <circle cx="50" cy="50" r="${r}" class="rec-track"/>
    <circle cx="50" cy="50" r="${r}" class="rec-val" style="stroke:${color}" stroke-dasharray="${(c * pct / 100).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 50 50)"/>
    <text x="50" y="56" text-anchor="middle" class="rec-pct">${pct}%</text></svg>`;
}

function recoveryCardHtml() {
  const R = computeRecovery();
  if (!R) return '';
  const st = RECOVERY_STATES[R.status];
  const lines = R.status === 'ready' ? `<div class="rec-line">${st.text}</div>` :
    `<div class="rec-line">🏃 Footing facile : <b>${fmtWhen(R.easyAt)}</b></div><div class="rec-line">⚡ Séance intense / longue : <b>${fmtWhen(R.readyAt)}</b></div>`;
  return `<section class="card rec-card" id="recovery-card">
    ${recoveryRing(R.pct, st.color, 84)}
    <div class="rec-main"><div class="card-eyebrow">Récupération</div>
      <div class="rec-title" style="color:${st.color}">${st.title}</div>${lines}
      ${R.spike > 1 ? '<div class="rec-warn">⚠️ Charge en forte hausse cette semaine</div>' : ''}
    </div></section>`;
}

function openRecoverySheet() {
  const R = computeRecovery();
  if (!R) return;
  const st = RECOVERY_STATES[R.status];
  const d = R.driver;
  const effortLabel = rpe => rpe < 4.5 ? 'facile' : rpe < 6.5 ? 'modéré' : rpe < 8 ? 'soutenu' : 'très dur';
  const list = R.recent.slice(-5).reverse();
  openSheet(`
    <div class="rec-sheet-head">${recoveryRing(R.pct, st.color, 110)}
      <div><div class="sheet-title" style="color:${st.color};margin:0">${st.icon} ${st.title}</div><p class="muted">${st.text}</p></div></div>
    ${R.status !== 'ready' ? `<div class="kv-list">
      <div class="kv"><span>🏃 Footing facile possible</span><b>${fmtWhen(R.easyAt)}</b></div>
      <div class="kv"><span>⚡ Séance intense ou longue</span><b>${fmtWhen(R.readyAt)}</b></div>
      <div class="kv"><span>Sortie qui pèse le plus</span><b>${formatDate(d.run.date, { day: 'numeric', month: 'short' })} · ${fmtNum(d.run.distanceKm)} km</b></div>
      <div class="kv"><span>Récupération estimée</span><b>${fmtHours(d.totalHours)}</b></div></div>` : ''}
    ${R.acwr != null ? `<div class="rec-acwr ${R.acwr > 1.3 ? 'warn' : R.acwr < 0.8 ? 'low' : 'ok'}">
      <b>Charge de la semaine : ${fmtNum(R.acwr, 2)}× ta moyenne</b>
      <span>${R.acwr > 1.5 ? "Hausse très brutale : c'est la zone où le risque de blessure augmente nettement. Lève le pied quelques jours." :
        R.acwr > 1.3 ? 'Hausse rapide : les récupérations sont allongées par prudence.' :
        R.acwr < 0.8 ? 'Semaine plus légère que d\'habitude : tu as de la marge pour reprendre progressivement.' : 'Zone idéale (0,8 à 1,3) : progression sans surcharge.'}</span></div>` : ''}
    <div class="card-eyebrow" style="margin-top:14px">Dernières sorties</div>
    ${list.map(e => `<div class="kv"><span>${formatDate(e.run.date, { weekday: 'short', day: 'numeric', month: 'short' })} · ${fmtNum(e.run.distanceKm)} km</span>
      <b>${effortLabel(e.rpe)} · ${fmtHours(e.totalHours || e.hours)}${e.raceRule ? ' 🎽' : ''}</b></div>`).join('')}
    <details class="rec-method"><summary>Comment c'est calculé ?</summary>
      <p>Chaque sortie reçoit une charge : <b>durée × effort perçu</b> (méthode dite « session RPE »), l'intensité comptant plus que la durée. L'effort vient de ta <b>sensation</b> si tu l'as notée, sinon de ton allure comparée à ton allure habituelle. 100 m de D+ comptent comme 1 km de plus.</p>
      <p>Repères utilisés : environ 12 à 24 h après un footing facile, 48 à 72 h après une séance dure ou une sortie longue. Après une <b>course officielle</b>, la règle classique d'<b>un jour par mile couru</b> avant de refaire un effort à fond (≈ 3 jours pour un 5 km, 6 pour un 10 km, 13 pour un semi). Un footing très léger reste possible avant.</p>
      <p>Si ta charge de la semaine dépasse 1,3 fois ta moyenne des 4 dernières semaines, les récupérations sont allongées. ${R.age ? `Ton âge (${R.age} ans) ajoute ${Math.round((R.ageFactor - 1) * 100)} %.` : "Tu peux indiquer ton année de naissance dans les Réglages : la récupération s'allonge d'environ 1 % par an après 25 ans."}</p>
      <p><b>C'est une estimation, pas un avis médical.</b> Tes vrais signaux priment : jambes lourdes à l'échauffement, mauvais sommeil, fatigue inhabituelle. Une douleur qui s'aggrave, localisée à une articulation ou qui dure plus de 3 jours mérite l'avis d'un professionnel de santé.</p>
    </details>
    <button class="btn-primary" data-close>Compris</button>`);
}

function calendarGhostHtml() {
  const g = calendarGhost();
  if (!g) return '';
  const line = (label, o) => {
    const diff = o.me - o.ghost;
    const pct = Math.max(o.me, o.ghost) > 0 ? o.me / Math.max(o.me, o.ghost) * 100 : 0;
    const gpct = Math.max(o.me, o.ghost) > 0 ? o.ghost / Math.max(o.me, o.ghost) * 100 : 0;
    return `<div class="cg-row"><div class="cg-head"><span>${label}</span>
      <b class="${diff >= 0 ? 'ahead' : 'behind'}">${diff >= 0 ? '+' : '−'}${fmtNum(Math.abs(diff))} km</b></div>
      <div class="cg-bars"><div class="cg-bar me" style="width:${pct}%"></div><div class="cg-bar ghost" style="width:${gpct}%"></div></div>
      <div class="cg-foot">Toi ${fmtNum(o.me)} km · 👻 ${fmtNum(o.ghost)} km</div></div>`;
  };
  return `<section class="card cg-card"><div class="card-eyebrow">👻 Toi contre toi, il y a un an</div>
    ${line('Cette semaine', g.week)}${line('Ce mois-ci', g.month)}${line('Depuis janvier', g.year)}</section>`;
}

function monthCardHtml() {
  const list = currentMonthBadges();
  if (!list.length) return '';
  const mk = todayStr().slice(0, 7);
  const km = STATE.runs.filter(r => r.date.startsWith(mk)).reduce((s, r) => s + r.distanceKm, 0);

  return `<section class="card month-card">

    <div class="month-chips">${list.map(b => `<span class="month-chip ${b.unlocked ? 'on' : ''}">${b.unlocked ? '✓ ' : ''}${b.kind === 'single' ? (b.target === 5 ? '5K' : '10K') : b.target + ' km'}</span>`).join('')}</div>
    ${nextVol ? `${progressBar(km / nextVol.target * 100, 'accent')}
      <div class="card-foot">${fmtNum(km)} / ${nextVol.target} km ce mois · ${daysLeft > 0 ? `${daysLeft} jour${daysLeft > 1 ? 's' : ''} restant${daysLeft > 1 ? 's' : ''}` : 'dernier jour !'}</div>`
      : `<div class="card-foot">${fmtNum(km)} km ce mois : tous les paliers de volume sont atteints 🏆</div>`}

}

      </section>` : `<p class="muted">Choisis un défi : chaque kilomètre couru ensuite y sera ajouté automatiquement. Tu peux en changer quand tu veux, la progression de chaque défi est conservée.</p>`}
    ${cats.map(([cat, label]) => `
      <h2 class="section-title">${label}</h2>
      <div class="challenge-list">
        ${STATE.challenges.filter(c => c.category === cat).map(c => {
          const pct = Math.min(100, Math.round(c.currentKm / c.targetKm * 100));
